<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notices — Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/drawer.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); min-height: 56px; }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .btn-primary { appearance: none; background: var(--brand); color: var(--brand-fg); border: none; padding: 0.5rem 0.9rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: all var(--duration-fast) var(--ease); min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-5) var(--space-6) var(--space-10); } }

  /* Authority filter */
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: var(--space-3); scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { appearance: none; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); padding: 0.4rem 0.75rem; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 500; cursor: pointer; flex-shrink: 0; transition: all var(--duration-fast) var(--ease); font-family: inherit; min-height: 32px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .search { width: 100%; padding: 0.7rem 0.9rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--text); margin-bottom: var(--space-3); min-height: 44px; }
  .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }

  .list { display: flex; flex-direction: column; gap: var(--space-3); }

  /* Notice card */
  .notice {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    transition: border-color var(--duration-fast) var(--ease);
    position: relative;
  }
  .notice:hover { border-color: var(--border-strong); }
  .notice[data-unread]::before {
    content: '';
    position: absolute; left: -3px; top: 20px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px var(--bg);
  }

  .notice__authority {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brand);
    margin-bottom: var(--space-2);
  }
  .notice__authority svg { width: 12px; height: 12px; }
  .notice__authority-text { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: var(--text-xs); }

  .notice__title {
    font-size: var(--text-md);
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: var(--leading-snug);
    margin-bottom: var(--space-2);
    overflow-wrap: anywhere;
    color: var(--text);
  }
  .notice[data-unread] .notice__title { font-weight: 800; }

  .notice__body {
    font-size: var(--text-sm);
    color: var(--text-muted);
    line-height: var(--leading-base);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .notice[data-expanded] .notice__body { -webkit-line-clamp: unset; display: block; }

  .notice__meta {
    display: flex; flex-wrap: wrap;
    gap: var(--space-2);
    align-items: center;
    margin-top: var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border);
  }
  .tag { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: var(--radius-full); }
  .tag--general      { background: #f5f5f4; color: #57534e; }
  .tag--important    { background: #fef3c7; color: #92400e; }
  .tag--urgent       { background: #fee2e2; color: #991b1b; }
  .tag--registration { background: #dcfce7; color: #166534; }
  .tag--seminar      { background: #dbeafe; color: #1e40af; }
  .tag--update       { background: #e0e7ff; color: #3730a3; }
  @media (prefers-color-scheme: dark) {
    .tag--general      { background: #292524; color: #a8a29e; }
    .tag--important    { background: #451a03; color: #fcd34d; }
    .tag--urgent       { background: #450a0a; color: #fca5a5; }
    .tag--registration { background: #052e16; color: #86efac; }
    .tag--seminar      { background: #172554; color: #93c5fd; }
    .tag--update       { background: #1e1b4b; color: #a5b4fc; }
  }
  .scope-pill {
    font-size: 0.625rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 3px 8px; border-radius: var(--radius-full);
    background: var(--bg-sunken); color: var(--text-muted);
  }

  .notice__time { font-size: var(--text-xs); color: var(--text-subtle); margin-left: auto; }

  .notice__expand {
    appearance: none; background: transparent; border: none;
    color: var(--brand); font-size: var(--text-xs); font-weight: 600;
    cursor: pointer; padding: 6px 0 0; font-family: inherit;
  }
  .notice__expand:hover { text-decoration: underline; }

  .empty { padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .empty svg { color: var(--border-strong); margin-bottom: var(--space-3); }
  .empty h3 { font-size: var(--text-base); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: var(--space-4); opacity: 0; pointer-events: none; transition: opacity var(--duration) var(--ease); }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }
  .modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; padding: var(--space-5); transform: translateY(12px); transition: transform var(--duration) var(--ease); }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }
  .modal h2 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }
  .modal .sub { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-4); }
  .modal .field { margin-bottom: var(--space-3); }
  .modal label { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .modal input, .modal textarea, .modal select { width: 100%; padding: 0.75rem 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--text); font-family: inherit; transition: all var(--duration-fast) var(--ease); min-height: 46px; }
  .modal textarea { min-height: 140px; resize: vertical; line-height: var(--leading-base); }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }
  .modal-alert { display: none; padding: 0.7rem 0.9rem; border-radius: var(--radius-md); font-size: var(--text-sm); margin-bottom: var(--space-3); overflow-wrap: anywhere; }
  .modal-alert[data-show] { display: block; }
  .modal-alert--error { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); }
  .modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); justify-content: flex-end; }
  @media (max-width: 480px) { .modal-actions { flex-direction: column-reverse; } }
  .btn-ghost { appearance: none; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.65rem 1rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: all var(--duration-fast) var(--ease); min-height: 42px; font-family: inherit; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 0.65rem 1rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: all var(--duration) var(--ease); z-index: 60; max-width: 90vw; text-align: center; }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Notices</div>
  <div class="topbar__right">
    <button class="btn-primary" id="btn-new" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </div>
</header>

<main class="wrap">

  <div class="filters" id="filters" role="tablist">
    <button class="chip" data-scope="all" aria-pressed="true">All</button>
    <button class="chip" data-scope="university" aria-pressed="false">University</button>
    <button class="chip" data-scope="faculty" aria-pressed="false">Faculty</button>
    <button class="chip" data-scope="department" aria-pressed="false">Department</button>
    <button class="chip" data-scope="course" aria-pressed="false">Course</button>
  </div>

  <input type="search" class="search" id="search" placeholder="Search notices…" autocomplete="off">

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div id="feed" hidden></div>

</main>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let meId = null, me = null, canPost = false;
  let all = [];
  let scope = 'all';
  let search = '';
  let editingId = null;

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  meId = session.user.id;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  const timeAgo = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }

  // Authority icons
  const scopeIcon = (s) => {
    const base = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    switch (s) {
      case 'university': return base('<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>');
      case 'faculty':    return base('<path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>');
      case 'department': return base('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/>');
      case 'course':     return base('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>');
      default:           return base('<path d="M3 11l18-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>');
    }
  };

  // ---------- Load profile + perms ----------
  const { data: prof } = await supabase.from('profiles')
    .select('id, full_name, role, institution_id, faculty_id, department_id')
    .eq('id', meId).single();
  me = prof || {};

  const { data: canCreate } = await supabase.rpc('has_permission', { p_permission: 'announcements.create' });
  canPost = !!canCreate;
  if (canPost) $('btn-new').hidden = false;

  // ---------- Load ----------
  async function load() {
    const { data, error } = await supabase
      .from('announcements')
      .select(`id, title, body, tag, scope, scope_id, created_at, author_id,
               profiles:author_id ( full_name, avatar_url, role )`)
      .order('created_at', { ascending: false })
      .limit(200);

    if (error) {
      $('state-loading').hidden = true;
      $('state-error').hidden = false;
      $('state-error').textContent = 'Could not load notices: ' + error.message;
      return;
    }
    all = data || [];
    $('state-loading').hidden = true;
    $('feed').hidden = false;
    render();
  }

  function render() {
    const body = $('feed');
    const q = search.trim().toLowerCase();
    const filtered = all.filter(a => {
      if (scope !== 'all' && (a.scope || 'university') !== scope) return false;
      if (!q) return true;
      return (a.title || '').toLowerCase().includes(q)
          || (a.body  || '').toLowerCase().includes(q)
          || (a.profiles?.full_name || '').toLowerCase().includes(q);
    });

    if (filtered.length === 0) {
      body.innerHTML = `<div class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
        <h3>${q || scope !== 'all' ? 'Nothing matches' : 'No notices yet'}</h3>
        <p>${q || scope !== 'all' ? 'Try another filter.' : 'Official notices will appear here.'}</p>
      </div>`;
      return;
    }

    body.innerHTML = '<div class="list">' + filtered.map(a => noticeCard(a)).join('') + '</div>';
  }

  function noticeCard(a) {
    const author = a.profiles?.full_name || 'Matric';
    const authorRole = (a.profiles?.role || 'staff');
    const sc = a.scope || 'university';
    const authorityLabel =
      sc === 'university' ? 'University notice' :
      sc === 'faculty'    ? 'Faculty notice' :
      sc === 'department' ? 'Department notice' :
      sc === 'course'     ? 'Course notice' : 'Notice';
    const isLong = (a.body || '').length > 240;
    const canEdit = a.author_id === meId && canPost;

    return `
      <article class="notice" data-id="${esc(a.id)}" data-expanded="0">
        <div class="notice__authority">
          ${scopeIcon(sc)}
          <span>${esc(authorityLabel)}</span>
          <span class="notice__authority-text">· ${esc(author)}</span>
        </div>
        <h3 class="notice__title">${esc(a.title)}</h3>
        <div class="notice__body">${esc(a.body)}</div>
        ${isLong ? `<button class="notice__expand" data-action="expand" data-id="${esc(a.id)}">Read more</button>` : ''}
        <div class="notice__meta">
          <span class="tag tag--${esc(a.tag)}">${esc(a.tag)}</span>
          <span class="scope-pill">${esc(sc)}</span>
          <span class="notice__time">${timeAgo(a.created_at)}</span>
        </div>
      </article>`;
  }

  // ---------- Filters ----------
  $('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    scope = chip.dataset.scope;
    document.querySelectorAll('#filters .chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.scope === scope)));
    render();
  });
  $('search').addEventListener('input', (e) => { search = e.target.value; render(); });

  // ---------- Expand ----------
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="expand"]');
    if (btn) {
      const card = btn.closest('.notice');
      const isExpanded = card.getAttribute('data-expanded') === '1';
      card.setAttribute('data-expanded', isExpanded ? '0' : '1');
      btn.textContent = isExpanded ? 'Read more' : 'Show less';
    }
  });

  // ---------- New notice modal ----------
  $('btn-new').addEventListener('click', () => {
    editingId = null;
    openCompose();
  });

  function openCompose() {
    const scopeOptions = [];
    scopeOptions.push({ value: 'university', label: 'University — everyone at your institution' });
    if (me.faculty_id)    scopeOptions.push({ value: 'faculty',    label: 'Faculty — Faculty of Science' });
    if (me.department_id) scopeOptions.push({ value: 'department', label: 'Department — Computer Science' });

    const body = `
      <h2>New notice</h2>
      <p class="sub">Posted notices reach everyone in the selected scope.</p>
      <form id="m-form">
        <div class="field">
          <label for="m-scope">Scope</label>
          <select id="m-scope" required>
            ${scopeOptions.map(o => `<option value="${o.value}">${esc(o.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="m-tag">Category</label>
          <select id="m-tag" required>
            <option value="general">General</option>
            <option value="important">Important</option>
            <option value="urgent">Urgent</option>
            <option value="registration">Registration</option>
            <option value="seminar">Seminar</option>
            <option value="update">Update</option>
          </select>
        </div>
        <div class="field">
          <label for="m-title">Title</label>
          <input type="text" id="m-title" required maxlength="150" placeholder="Short, descriptive title">
        </div>
        <div class="field">
          <label for="m-body">Message</label>
          <textarea id="m-body" required maxlength="5000" placeholder="Write the notice…"></textarea>
        </div>
        <div class="modal-alert modal-alert--error" id="m-alert"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="m-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="m-submit">Publish</button>
        </div>
      </form>`;

    $('modal-body').innerHTML = body;
    $('modal').setAttribute('data-open', '1');
    $('modal').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    $('m-cancel').addEventListener('click', closeModal);

    $('m-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('m-submit');
      const alertEl = $('m-alert');
      alertEl.removeAttribute('data-show');

      const sc = $('m-scope').value;
      const tag = $('m-tag').value;
      const title = $('m-title').value.trim();
      const bodyText = $('m-body').value.trim();

      if (!title || !bodyText) { alertEl.textContent = 'Title and message required.'; alertEl.setAttribute('data-show', '1'); return; }

      btn.disabled = true; btn.textContent = 'Publishing…';

      try {
        let scopeId = null;
        if (sc === 'faculty')    scopeId = me.faculty_id;
        if (sc === 'department') scopeId = me.department_id;

        const { error } = await supabase.from('announcements').insert({
          institution_id: me.institution_id,
          author_id: meId,
          title,
          body: bodyText,
          tag,
          scope: sc,
          scope_id: scopeId,
        });
        if (error) throw error;
        toast('Published.');
        closeModal();
        await load();
      } catch (err) {
        alertEl.textContent = err.message || 'Something went wrong.';
        alertEl.setAttribute('data-show', '1');
      } finally {
        btn.disabled = false; btn.textContent = 'Publish';
      }
    });
  }

  function closeModal() {
    $('modal').removeAttribute('data-open');
    $('modal').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal(); });

  // ---------- URL filter param ----------
  const params = new URLSearchParams(location.search);
  const initial = params.get('filter');
  if (initial && ['all','university','faculty','department','course'].includes(initial)) {
    scope = initial;
    document.querySelectorAll('#filters .chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.scope === scope)));
  }

  await load();
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
</html>
