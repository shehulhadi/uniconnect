<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .btn-primary {
    appearance: none; background: var(--brand); color: var(--brand-fg);
    border: none; padding: 0.5rem 0.9rem;
    border-radius: var(--radius-md); font-size: var(--text-sm);
    font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    min-height: 36px; display: inline-flex;
    align-items: center; gap: var(--space-2);
  }
  .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
  @media (min-width: 640px) { .wrap { padding: var(--space-8) var(--space-6); } }

  .head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap;
  }
  .head h1 {
    font-size: var(--text-2xl); font-weight: 600;
    letter-spacing: -0.02em; line-height: var(--leading-tight);
    margin-bottom: var(--space-2);
  }
  @media (min-width: 640px) { .head h1 { font-size: var(--text-3xl); } }
  .head p { color: var(--text-muted); font-size: var(--text-base); }

  .list { display: flex; flex-direction: column; gap: 2px; }

  .thread {
    display: flex; gap: var(--space-3); align-items: center;
    padding: var(--space-3) var(--space-3);
    border-radius: var(--radius-md);
    text-decoration: none; color: var(--text);
    transition: background var(--duration-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .thread:hover { background: var(--bg-sunken); }
  .thread[data-unread] .thread__name { font-weight: 700; }
  .thread[data-unread] .thread__preview { color: var(--text); font-weight: 500; }

  .avatar {
    width: 44px; height: 44px; border-radius: var(--radius-full);
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-sm); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .avatar--lg {
    width: 56px; height: 56px; font-size: var(--text-md);
  }

  .thread__body { flex: 1; min-width: 0; }
  .thread__row {
    display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--space-2);
    margin-bottom: 2px;
  }
  .thread__name {
    font-size: var(--text-sm); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread__time {
    font-size: var(--text-xs); color: var(--text-subtle);
    flex-shrink: 0;
  }
  .thread__preview {
    font-size: var(--text-sm); color: var(--text-muted);
    line-height: var(--leading-snug);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread__badge {
    min-width: 20px; height: 20px;
    border-radius: var(--radius-full);
    background: var(--brand); color: var(--brand-fg);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.6875rem; font-weight: 700;
    padding: 0 6px; flex-shrink: 0;
  }

  .empty {
    padding: var(--space-10) var(--space-4);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-sm);
  }
  .empty svg { color: var(--border-strong); margin-bottom: var(--space-3); }
  .empty h3 {
    font-size: var(--text-base); color: var(--text);
    margin-bottom: var(--space-2); font-weight: 600;
  }
  .empty p { max-width: 34ch; margin: 0 auto var(--space-4); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-lg); width: 100%; max-width: 440px;
    max-height: 85vh; overflow-y: auto; padding: var(--space-5);
    transform: translateY(12px); transition: transform var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }
  .modal h2 {
    font-size: var(--text-lg); font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: var(--space-2);
  }
  .modal .sub {
    font-size: var(--text-sm); color: var(--text-muted);
    margin-bottom: var(--space-4);
  }
  .modal input[type="search"] {
    width: 100%; padding: 0.65rem 0.85rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); margin-bottom: var(--space-3);
  }
  .modal input[type="search"]:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }

  .user-list { display: flex; flex-direction: column; gap: 2px; }
  .user-item {
    display: flex; gap: var(--space-3); align-items: center;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease);
    text-align: left;
    border: none; background: transparent; width: 100%;
    color: var(--text);
    font-family: inherit;
  }
  .user-item:hover { background: var(--bg-sunken); }
  .user-item__name { font-size: var(--text-sm); font-weight: 500; }
  .user-item__sub { font-size: var(--text-xs); color: var(--text-muted); }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  .toast {
    position: fixed; bottom: 84px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all var(--duration) var(--ease);
    z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/notifications.css">
  <link rel="stylesheet" href="../css/topbar.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    UniConnect
  </div>
  <div class="topbar__right">
    <button class="btn-primary" id="btn-new">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Messages</h1>
      <p>Direct conversations with people at your institution.</p>
    </div>
  </div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div id="inbox" hidden></div>
</main>

<!-- New message modal -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">New message</h2>
    <p class="sub">Pick someone at your institution to start a conversation with.</p>
    <input type="search" id="user-search" placeholder="Search by name or email…" autocomplete="off">
    <div class="user-list" id="user-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  const meId = session.user.id;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  const timeAgo = (iso) => {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3500);
  }

  // ---- Load inbox ----
  async function loadInbox() {
    const { data, error } = await supabase.rpc('dm_inbox');
    if (error) {
      $('state-loading').hidden = true;
      $('state-error').hidden = false;
      $('state-error').textContent = 'Could not load messages: ' + error.message;
      return;
    }
    $('state-loading').hidden = true;
    $('inbox').hidden = false;

    if (!data || data.length === 0) {
      $('inbox').innerHTML = `
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <h3>No conversations yet</h3>
          <p>Start a conversation with someone at your institution.</p>
        </div>`;
      return;
    }

    $('inbox').innerHTML = '<div class="list">' + data.map(t => {
      const name = t.other_name || t.other_email || 'Unknown';
      const unreadAttr = t.unread > 0 ? ' data-unread="1"' : '';
      const badge = t.unread > 0 ? `<span class="thread__badge">${t.unread}</span>` : '';
      return `
        <a class="thread"${unreadAttr} href="dm.html?id=${esc(t.thread_id)}">
          <div class="avatar">${esc(initials(name))}</div>
          <div class="thread__body">
            <div class="thread__row">
              <span class="thread__name">${esc(name)}</span>
              <span class="thread__time">${timeAgo(t.last_message_at)}</span>
            </div>
            <div class="thread__preview">${esc(t.last_message || 'No messages yet')}</div>
          </div>
          ${badge}
        </a>`;
    }).join('') + '</div>';
  }

  // ---- New message: pick a user ----
  async function openUserPicker() {
    $('modal').setAttribute('data-open', '1');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('user-search').focus(), 50);

    $('user-list').innerHTML = '<div class="state">Loading…</div>';

    // Profiles in the same institution, excluding self
    const { data, error } = await supabase
      .from('profiles')
      .select('id, full_name, email, role')
      .neq('id', meId)
      .order('full_name');

    if (error) {
      $('user-list').innerHTML = '<div class="state state--error">' + esc(error.message) + '</div>';
      return;
    }

    const users = data || [];
    if (users.length === 0) {
      $('user-list').innerHTML = '<div class="state">No other users at your institution yet.</div>';
      return;
    }

    renderUsers(users);

    $('user-search').oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = !q ? users : users.filter(u =>
        (u.full_name || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q)
      );
      renderUsers(filtered);
    };
  }

  function renderUsers(users) {
    $('user-list').innerHTML = users.map(u => `
      <button class="user-item" data-id="${esc(u.id)}" data-name="${esc(u.full_name || u.email)}" type="button">
        <div class="avatar" style="width:36px;height:36px;font-size:var(--text-xs);">${esc(initials(u.full_name || u.email))}</div>
        <div style="flex:1;min-width:0;">
          <div class="user-item__name">${esc(u.full_name || '(no name)')}</div>
          <div class="user-item__sub">${esc(u.role)} · ${esc(u.email)}</div>
        </div>
      </button>
    `).join('');
  }

  function closeModal() {
    $('modal').removeAttribute('data-open');
    document.body.style.overflow = '';
    $('user-search').value = '';
  }

  $('btn-new').addEventListener('click', openUserPicker);
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')) return closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal();
  });

  // Picking a user: find-or-create thread, then go to it
  $('user-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('.user-item');
    if (!btn) return;
    const otherId = btn.dataset.id;
    btn.disabled = true;

    const { data, error } = await supabase.rpc('find_or_create_dm_thread', { other: otherId });
    if (error) {
      toast(error.message, 'error');
      btn.disabled = false;
      return;
    }
    location.href = 'dm.html?id=' + data;
  });

  loadInbox();
</script>

</body>
</html>
