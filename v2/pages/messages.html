<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-5) var(--space-6) var(--space-10); } }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    margin-bottom: var(--space-4);
  }
  .tab {
    appearance: none; border: none; background: transparent;
    padding: 0.55rem 0.5rem;
    font-size: var(--text-sm); font-weight: 500;
    color: var(--text-muted);
    border-radius: calc(var(--radius-md) - 3px);
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px;
    position: relative;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--bg-elevated); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .tab__badge {
    min-width: 18px; height: 18px; border-radius: 9px;
    background: var(--danger); color: #fff;
    font-size: 0.625rem; font-weight: 700;
    display: none; align-items: center; justify-content: center;
    padding: 0 5px;
  }
  .tab__badge[data-show] { display: inline-flex; }

  .panel[hidden] { display: none; }

  .search {
    width: 100%; padding: 0.7rem 0.9rem;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); margin-bottom: var(--space-4);
    min-height: 44px;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }

  .section-label {
    font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle);
    margin-bottom: var(--space-2); margin-top: var(--space-4);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label:first-child { margin-top: 0; }

  .list { display: flex; flex-direction: column; gap: 2px; }

  .row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    text-decoration: none; color: var(--text);
    transition: background var(--duration-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
    border: none; background: transparent;
    width: 100%; text-align: left;
    font-family: inherit; font-size: inherit;
  }
  .row:hover { background: var(--bg-sunken); }
  .row[data-clickable] { cursor: pointer; }

  .avatar {
    width: 44px; height: 44px; border-radius: var(--radius-full);
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-sm); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
    overflow: hidden; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar__dot {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--bg-elevated);
    background: var(--text-subtle);
  }
  .avatar__dot[data-status="online"] { background: var(--success); }
  .avatar__dot[data-status="away"]   { background: var(--warning); }
  .avatar__dot[data-status="busy"]   { background: var(--danger); }

  .row__body { flex: 1; min-width: 0; }
  .row__name {
    font-size: var(--text-sm); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .row__name .role-chip {
    font-size: 0.5625rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--bg-sunken); color: var(--text-subtle);
    padding: 1px 5px; border-radius: var(--radius-sm);
  }
  .row__sub {
    font-size: var(--text-xs); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }

  .row__action { flex-shrink: 0; display: flex; gap: 6px; align-items: center; }

  .btn-mini {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 0.35rem 0.7rem;
    border-radius: var(--radius-md);
    font-size: var(--text-xs); font-weight: 500;
    cursor: pointer; min-height: 32px;
    transition: all var(--duration-fast) var(--ease);
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .btn-mini:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .btn-mini:disabled { opacity: 0.5; cursor: wait; }
  .btn-mini--primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .btn-mini--primary:hover:not(:disabled) { background: var(--brand-hover); color: var(--brand-fg); }
  .btn-mini--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
  .btn-mini--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 10%, transparent); }

  .empty {
    padding: var(--space-8) var(--space-4);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
  }
  .empty svg { color: var(--border-strong); margin-bottom: var(--space-3); }
  .empty h3 { font-size: var(--text-base); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  .toast {
    position: fixed; bottom: 84px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all var(--duration) var(--ease);
    z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="application-name" content="UniConnect">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniConnect">
  <script src="../../v2/js/pwa.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Messages</div>
  <div class="topbar__right"></div>
</header>

<main class="wrap">

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="chats">Chats</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="friends">
      Friends <span class="tab__badge" id="tab-badge-friends"></span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="people">People</button>
  </div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>

  <!-- Chats -->
  <section class="panel" id="panel-chats" hidden>
    <div id="chats-body"></div>
  </section>

  <!-- Friends -->
  <section class="panel" id="panel-friends" hidden>
    <input type="search" class="search" id="friends-search" placeholder="Search friends…" autocomplete="off">
    <div id="friends-body"></div>
  </section>

  <!-- People -->
  <section class="panel" id="panel-people" hidden>
    <input type="search" class="search" id="people-search" placeholder="Search by name or email…" autocomplete="off">
    <div id="people-body"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let meId = null;
  let currentTab = 'chats';

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  meId = session.user.id;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  const timeAgo = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }
  function showError(msg) {
    $('state-loading').hidden = true;
    $('state-error').hidden = false;
    $('state-error').textContent = msg;
  }

  // ------------------------------------------------------------------
  // Tab switching
  // ------------------------------------------------------------------
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.tab === name))
    );
    ['chats','friends','people'].forEach(k => {
      const el = $(`panel-${k}`);
      if (el) el.hidden = k !== name;
    });
    if (name === 'chats')   loadChats();
    if (name === 'friends') loadFriends();
    if (name === 'people')  loadPeople('');
  }

  // ------------------------------------------------------------------
  // CHATS
  // ------------------------------------------------------------------
  async function loadChats() {
    const body = $('chats-body');
    body.innerHTML = '<div class="state">Loading chats…</div>';
    const { data, error } = await supabase.rpc('dm_inbox');
    if (error) {
      body.innerHTML = `<div class="state state--error">${esc(error.message)}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      body.innerHTML = `
        <div class="empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <h3>No conversations yet</h3>
          <p>Open the <strong>Friends</strong> tab and start a chat with someone.</p>
        </div>`;
      return;
    }

    body.innerHTML = '<div class="list">' + data.map(t => {
      const name = t.other_name || t.other_email || 'Unknown';
      const unread = t.unread > 0;
      const last = t.last_message || 'No messages yet';
      return `
        <a class="row" href="dm.html?id=${esc(t.thread_id)}" data-clickable>
          <div class="avatar">${esc(initials(name))}</div>
          <div class="row__body">
            <div class="row__name">${esc(name)}</div>
            <div class="row__sub" style="${unread ? 'color:var(--text);font-weight:500;' : ''}">${esc(last)}</div>
          </div>
          <div class="row__action">
            ${unread ? `<span class="tab__badge" data-show="1">${t.unread}</span>` : ''}
            <span style="font-size:var(--text-xs);color:var(--text-subtle)">${timeAgo(t.last_message_at)}</span>
          </div>
        </a>`;
    }).join('') + '</div>';
  }

  // ------------------------------------------------------------------
  // FRIENDS
  // ------------------------------------------------------------------
  let friendsCache = { pendingIncoming: [], pendingOutgoing: [], friends: [] };

  async function loadFriends() {
    const body = $('friends-body');
    body.innerHTML = '<div class="state">Loading…</div>';

    const { data, error } = await supabase
      .from('user_relationships')
      .select(`
        id, kind, created_at,
        from_user_id, to_user_id,
        from_profile:profiles!user_relationships_from_user_id_fkey ( id, full_name, email, avatar_url, role, status ),
        to_profile:profiles!user_relationships_to_user_id_fkey ( id, full_name, email, avatar_url, role, status )
      `)
      .in('kind', ['friend_request','friend'])
      .or(`from_user_id.eq.${meId},to_user_id.eq.${meId}`);

    if (error) {
      body.innerHTML = `<div class="state state--error">${esc(error.message)}</div>`;
      return;
    }

    const pendingIncoming = [];
    const pendingOutgoing = [];
    const friends = [];

    (data || []).forEach(row => {
      if (row.kind === 'friend_request') {
        if (row.to_user_id === meId) pendingIncoming.push({ id: row.id, user: row.from_profile, at: row.created_at });
        else                          pendingOutgoing.push({ id: row.id, user: row.to_profile, at: row.created_at });
      } else if (row.kind === 'friend') {
        const other = row.from_user_id === meId ? row.to_profile : row.from_profile;
        friends.push(other);
      }
    });

    friendsCache = { pendingIncoming, pendingOutgoing, friends };

    // Tab badge
    const badge = $('tab-badge-friends');
    if (pendingIncoming.length) {
      badge.textContent = pendingIncoming.length;
      badge.setAttribute('data-show', '1');
    } else {
      badge.removeAttribute('data-show');
    }

    renderFriends($('friends-search').value.trim().toLowerCase());
  }

  function renderFriends(q) {
    const body = $('friends-body');
    const { pendingIncoming, pendingOutgoing, friends } = friendsCache;
    const filtered = !q ? friends : friends.filter(f =>
      (f?.full_name || '').toLowerCase().includes(q) ||
      (f?.email || '').toLowerCase().includes(q)
    );

    let html = '';

    if (pendingIncoming.length) {
      html += `<div class="section-label">Requests for you <span style="color:var(--danger)">${pendingIncoming.length}</span></div>`;
      html += '<div class="list">' + pendingIncoming.map(p => rowForUser(p.user, {
        actions: [
          { label: 'Accept', kind: 'primary', action: 'accept', id: p.id },
          { label: 'Decline', kind: 'danger', action: 'decline', id: p.id },
        ],
      })).join('') + '</div>';
    }

    if (pendingOutgoing.length) {
      html += `<div class="section-label">Sent</div>`;
      html += '<div class="list">' + pendingOutgoing.map(p => rowForUser(p.user, {
        actions: [{ label: 'Cancel', kind: 'danger', action: 'cancel', id: p.id }],
      })).join('') + '</div>';
    }

    html += `<div class="section-label">Friends <span style="color:var(--text-subtle)">${filtered.length}</span></div>`;
    if (filtered.length === 0) {
      html += `<div class="empty">
        ${q ? 'No friends match that search.' : 'You haven\'t added any friends yet. Check the <strong>People</strong> tab.'}
      </div>`;
    } else {
      html += '<div class="list">' + filtered.map(f => rowForUser(f, {
        actions: [
          { label: 'Message', kind: 'primary', action: 'message', id: f.id },
          { label: 'Unfriend', kind: 'danger', action: 'unfriend', id: f.id },
        ],
      })).join('') + '</div>';
    }

    body.innerHTML = html;
  }

  $('friends-search').addEventListener('input', (e) => {
    renderFriends(e.target.value.trim().toLowerCase());
  });

  function rowForUser(u, opts = {}) {
    if (!u) return '';
    const name = u.full_name || u.email || 'Unknown';
    const sub = u.email || '';
    const avatar = u.avatar_url
      ? `<img src="${esc(u.avatar_url)}" alt="">`
      : esc(initials(name));
    const dot = u.status && u.status !== 'offline'
      ? `<span class="avatar__dot" data-status="${esc(u.status)}"></span>` : '';

    const actions = (opts.actions || []).map(a =>
      `<button class="btn-mini ${a.kind === 'primary' ? 'btn-mini--primary' : a.kind === 'danger' ? 'btn-mini--danger' : ''}"
              data-relation-action="${esc(a.action)}"
              data-relation-id="${esc(a.id)}"
              type="button">${esc(a.label)}</button>`
    ).join('');

    return `
      <div class="row">
        <div class="avatar">${avatar}${dot}</div>
        <div class="row__body">
          <div class="row__name">${esc(name)} <span class="role-chip">${esc(u.role || 'student')}</span></div>
          <div class="row__sub">${esc(sub)}</div>
        </div>
        <div class="row__action">${actions}</div>
      </div>`;
  }

  // ------------------------------------------------------------------
  // PEOPLE
  // ------------------------------------------------------------------
  async function loadPeople(q) {
    const body = $('people-body');
    body.innerHTML = '<div class="state">Loading…</div>';

    const { data, error } = await supabase.rpc('people_directory', { p_search: q || null });
    if (error) {
      body.innerHTML = `<div class="state state--error">${esc(error.message)}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      body.innerHTML = `<div class="empty">
        ${q ? 'No one matches that search.' : 'No other users at your institution yet.'}
      </div>`;
      return;
    }

    body.innerHTML = '<div class="list">' + data.map(p => {
      const actions = [];

      if (p.friendship === 'none' || p.friendship === 'blocked_me') {
        if (p.friendship !== 'blocked_me') {
          actions.push({ label: 'Add friend', kind: 'primary', action: 'friend_request', id: p.user_id });
        }
      } else if (p.friendship === 'request_sent') {
        actions.push({ label: 'Request sent', action: 'noop', id: '', disabled: true });
      } else if (p.friendship === 'request_received') {
        actions.push({ label: 'Accept request', kind: 'primary', action: 'accept', id: p.user_id });
      } else if (p.friendship === 'friend') {
        actions.push({ label: 'Message', kind: 'primary', action: 'message', id: p.user_id });
      }

      if (p.friendship === 'blocked_by_me') {
        actions.push({ label: 'Unblock', kind: 'danger', action: 'unblock', id: p.user_id });
      } else if (p.friendship !== 'blocked_me') {
        if (p.is_following) {
          actions.push({ label: 'Unfollow', action: 'unfollow', id: p.user_id });
        } else {
          actions.push({ label: 'Follow', action: 'follow', id: p.user_id });
        }
        actions.push({ label: 'Block', kind: 'danger', action: 'block', id: p.user_id });
      }

      const chips = [];
      if (p.is_following) chips.push('Following');
      if (p.follows_me)   chips.push('Follows you');
      if (p.friendship === 'friend') chips.push('Friend');

      return `
        <div class="row">
          <div class="avatar">
            ${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(initials(p.full_name || p.email))}
            ${p.status && p.status !== 'offline' ? `<span class="avatar__dot" data-status="${esc(p.status)}"></span>` : ''}
          </div>
          <div class="row__body">
            <div class="row__name">${esc(p.full_name || p.email)} <span class="role-chip">${esc(p.role || 'student')}</span></div>
            <div class="row__sub">${esc(p.email || '')}${chips.length ? ' · ' + chips.join(' · ') : ''}</div>
          </div>
          <div class="row__action">
            ${actions.map(a => `
              <button class="btn-mini ${a.kind === 'primary' ? 'btn-mini--primary' : a.kind === 'danger' ? 'btn-mini--danger' : ''}"
                      ${a.disabled ? 'disabled' : ''}
                      data-people-action="${esc(a.action)}"
                      data-people-id="${esc(a.id)}"
                      type="button">${esc(a.label)}</button>
            `).join('')}
          </div>
        </div>`;
    }).join('') + '</div>';
  }

  $('people-search').addEventListener('input', (e) => {
    clearTimeout(loadPeople._t);
    const v = e.target.value.trim();
    loadPeople._t = setTimeout(() => loadPeople(v), 250);
  });

  // ------------------------------------------------------------------
  // Actions (event-delegated)
  // ------------------------------------------------------------------
  document.addEventListener('click', async (e) => {
    const relBtn = e.target.closest('[data-relation-action]');
    if (relBtn) { e.preventDefault(); await handleRelation(relBtn); return; }

    const pplBtn = e.target.closest('[data-people-action]');
    if (pplBtn) { e.preventDefault(); await handlePeople(pplBtn); return; }
  });

  async function handleRelation(btn) {
    const action = btn.dataset.relationAction;
    const id = btn.dataset.relationId;
    btn.disabled = true;

    try {
      if (action === 'accept' || action === 'decline') {
        const { error } = await supabase.rpc('respond_friend_request', {
          p_request_id: id, p_accept: action === 'accept',
        });
        if (error) throw error;
        toast(action === 'accept' ? 'Friend added.' : 'Request declined.');
      } else if (action === 'cancel') {
        const { error } = await supabase.rpc('respond_friend_request', {
          p_request_id: id, p_accept: false,
        });
        if (error) throw error;
        toast('Request cancelled.');
      } else if (action === 'message') {
        const { data, error } = await supabase.rpc('find_or_create_dm_thread', { other: id });
        if (error) throw error;
        location.href = 'dm.html?id=' + data;
        return;
      } else if (action === 'unfriend') {
        const { error } = await supabase.rpc('unfriend', { p_other_user: id });
        if (error) throw error;
        toast('Unfriended.');
      }
      await loadFriends();
    } catch (err) {
      toast(err.message || 'Action failed', 'error');
      btn.disabled = false;
    }
  }

  async function handlePeople(btn) {
    const action = btn.dataset.peopleAction;
    const id = btn.dataset.peopleId;
    if (action === 'noop') return;
    btn.disabled = true;

    try {
      if (action === 'friend_request') {
        const { error } = await supabase.rpc('send_friend_request', { p_to_user: id });
        if (error) throw error;
        toast('Friend request sent.');
      } else if (action === 'accept') {
        // incoming request: find the request id first
        const { data: req } = await supabase
          .from('user_relationships')
          .select('id')
          .eq('kind','friend_request')
          .eq('from_user_id', id)
          .eq('to_user_id', meId)
          .maybeSingle();
        if (!req) throw new Error('Request not found');
        const { error } = await supabase.rpc('respond_friend_request', { p_request_id: req.id, p_accept: true });
        if (error) throw error;
        toast('Friend added.');
      } else if (action === 'follow') {
        const { error } = await supabase.rpc('follow_user', { p_to_user: id });
        if (error) throw error;
        toast('Following.');
      } else if (action === 'unfollow') {
        const { error } = await supabase.rpc('unfollow_user', { p_to_user: id });
        if (error) throw error;
        toast('Unfollowed.');
      } else if (action === 'block') {
        if (!confirm('Block this person? They won\'t be able to message you.')) { btn.disabled = false; return; }
        const { error } = await supabase.rpc('block_user', { p_to_user: id });
        if (error) throw error;
        toast('Blocked.');
      } else if (action === 'unblock') {
        const { error } = await supabase.rpc('unblock_user', { p_to_user: id });
        if (error) throw error;
        toast('Unblocked.');
      } else if (action === 'message') {
        const { data, error } = await supabase.rpc('find_or_create_dm_thread', { other: id });
        if (error) throw error;
        location.href = 'dm.html?id=' + data;
        return;
      }
      const q = $('people-search').value.trim();
      await loadPeople(q);
    } catch (err) {
      toast(err.message || 'Action failed', 'error');
      btn.disabled = false;
    }
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  $('state-loading').hidden = true;
  switchTab('chats');
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
