<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module test</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #0c0a09; color: #fafaf9; }
  pre { background: #1c1917; padding: 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .ok { color: #4ade80; } .err { color: #f87171; } .dim { color: #78716c; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="application-name" content="UniConnect">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniConnect">
  <script src="../../v2/js/pwa.js" defer></script>
</head>
<body>
<h3>Module loader test</h3>
<pre id="out">Starting…</pre>
<script type="module">
  const out = document.getElementById('out');
  function line(s, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = s + '\n';
    out.textContent = ''; // not ideal but simple
    out.appendChild(span);
  }
  const lines = [];
  function log(s, cls) {
    lines.push({ s, cls });
    out.innerHTML = lines.map(l =>
      `<span class="${l.cls || ''}">${l.s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span>`
    ).join('\n');
  }

  try {
    log('1. Module script started', 'ok');
    log('2. Importing ../js/supabase.js…');
    const mod = await import('../js/supabase.js');
    log('3. Import resolved', 'ok');
    if (mod && mod.supabase) {
      log('4. supabase export present', 'ok');
      log('   url = ' + mod.supabase.supabaseUrl, 'dim');
      try {
        const { data, error } = await mod.supabase
          .from('institutions')
          .select('name')
          .limit(1);
        if (error) {
          log('5. Test query FAILED: ' + error.message, 'err');
        } else {
          log('5. Test query OK — first row: ' + (data && data[0] ? data[0].name : '(none)'), 'ok');
        }
      } catch (e) {
        log('5. Test query threw: ' + e.message, 'err');
      }
    } else {
      log('4. supabase export MISSING', 'err');
    }
  } catch (e) {
    log('IMPORT FAILED: ' + (e && e.message ? e.message : String(e)), 'err');
  }
</script>
</body>
</html>
