<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Teaching — Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/drawer.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); min-height: 56px; }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-5) var(--space-6) var(--space-10); } }

  .section { margin-bottom: var(--space-6); }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: 0 4px var(--space-3); }
  .section__title { font-size: var(--text-md); font-weight: 800; letter-spacing: -0.02em; }
  .section__hint { font-size: 12px; color: var(--text-subtle); padding: 0 4px 8px; line-height: 1.5; }

  .list { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }

  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 10px;
    border-radius: 12px;
    background: transparent; border: none;
    width: 100%; text-align: left;
    font-family: inherit; color: var(--text);
  }

  .row__icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: #ede9fe; color: #5b21b6;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .row__icon svg { width: 20px; height: 20px; }
  @media (prefers-color-scheme: dark) {
    .row__icon { background: #2e1065; color: #c4b5fd; }
  }

  .row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row__title {
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row__meta {
    font-size: 13px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row__meta .code {
    font-weight: 700;
    color: var(--brand);
    background: var(--brand-subtle);
    padding: 1px 6px; border-radius: 4px;
    margin-right: 6px;
  }

  .row__action { flex-shrink: 0; }

  .pill {
    appearance: none;
    height: 34px;
    padding: 0 14px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px;
    transition: all 150ms var(--ease);
    white-space: nowrap;
  }
  .pill:hover:not(:disabled) { border-color: var(--border-strong); }
  .pill:disabled { opacity: 0.55; cursor: default; }
  .pill--primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .pill--primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
  .pill--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 25%, transparent); }
  .pill--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 8%, transparent); }

  .empty { padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .empty svg { color: var(--border-strong); margin-bottom: 12px; }
  .empty h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
  .empty p { margin: 0; line-height: 1.5; }

  .state { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  .toast {
    position: fixed; bottom: 84px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: 12px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all 200ms var(--ease);
    z-index: 80; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">My Teaching</div>
  <div class="topbar__right"></div>
</header>

<main class="wrap">
  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>

  <div id="content" hidden>
    <section class="section">
      <div class="section__head"><div class="section__title">Courses I teach</div></div>
      <div class="section__hint">These are the courses you're responsible for this session. Adding a course makes you visible to students enrolled in it.</div>
      <div class="list" id="my-courses"></div>
    </section>

    <section class="section">
      <div class="section__head"><div class="section__title">Available in your department</div></div>
      <div class="section__hint">Other courses in your department. Tap Add to start teaching one.</div>
      <div class="list" id="available-courses"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let meId = null, me = null;

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  meId = session.user.id;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }

  const { data: prof } = await supabase.from('profiles')
    .select('id, full_name, role, department_id, institution_id').eq('id', meId).single();
  me = prof || {};

  if (!me.department_id) {
    $('state-loading').hidden = true;
    $('state-error').hidden = false;
    $('state-error').textContent = 'Your profile has no department. Complete onboarding first.';
    throw new Error('no department');
  }

  const bookIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

  let myIds = new Set();
  let allCourses = [];

  async function load() {
    const [caRes, coRes] = await Promise.all([
      supabase.from('course_assignments')
        .select('course_id, status')
        .eq('lecturer_id', meId),
      supabase.from('courses')
        .select('id, code, title, level_ordinal, semester')
        .eq('department_id', me.department_id)
        .order('code'),
    ]);

    if (coRes.error) {
      $('state-loading').hidden = true;
      $('state-error').hidden = false;
      $('state-error').textContent = coRes.error.message;
      return;
    }

    myIds = new Set((caRes.data || []).map(r => r.course_id));
    allCourses = coRes.data || [];

    $('state-loading').hidden = true;
    $('content').hidden = false;
    render();
  }

  function rowFor(c, opts) {
    const hasAssignments = opts.hasAssignments || false;
    const action = opts.remove
      ? `<button class="pill pill--danger" ${hasAssignments ? 'disabled title="You have assignments for this course"' : ''} data-action="remove" data-id="${esc(c.id)}" type="button">Remove</button>`
      : `<button class="pill pill--primary" data-action="add" data-id="${esc(c.id)}" type="button">Add</button>`;
    const meta = [c.level_ordinal ? c.level_ordinal + 'L' : null, c.semester ? 'Sem ' + c.semester : null]
      .filter(Boolean).join(' · ');
    return `
      <div class="row">
        <div class="row__icon">${bookIcon}</div>
        <div class="row__body">
          <div class="row__title">${esc(c.title)}</div>
          <div class="row__meta"><span class="code">${esc(c.code)}</span>${esc(meta)}</div>
        </div>
        <div class="row__action">${action}</div>
      </div>`;
  }

  async function render() {
    const mine = allCourses.filter(c => myIds.has(c.id));
    const others = allCourses.filter(c => !myIds.has(c.id));

    // Check assignment counts for courses I teach (to disable Remove when needed)
    let assignCounts = {};
    if (mine.length) {
      const { data } = await supabase.from('assignments')
        .select('course_id').eq('created_by', meId).in('course_id', mine.map(c => c.id));
      (data || []).forEach(a => { assignCounts[a.course_id] = (assignCounts[a.course_id] || 0) + 1; });
    }

    const myBody = $('my-courses');
    if (mine.length === 0) {
      myBody.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <h3>No courses yet</h3>
        <p>Add a course from the list below.</p>
      </div>`;
    } else {
      myBody.innerHTML = mine.map(c =>
        rowFor(c, { remove: true, hasAssignments: (assignCounts[c.id] || 0) > 0 })
      ).join('');
    }

    const otherBody = $('available-courses');
    if (others.length === 0) {
      otherBody.innerHTML = `<div class="empty"><p>You already teach every course in this department.</p></div>`;
    } else {
      otherBody.innerHTML = others.map(c => rowFor(c, {})).join('');
    }
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    btn.disabled = true;

    try {
      if (action === 'add') {
        const { error } = await supabase.rpc('add_teaching_course', { p_course_id: id });
        if (error) throw error;
        toast('Course added.');
      } else if (action === 'remove') {
        const { error } = await supabase.rpc('remove_teaching_course', { p_course_id: id });
        if (error) throw error;
        toast('Course removed.');
      }
      await load();
    } catch (err) {
      toast(err.message || 'Action failed.', 'error');
      btn.disabled = false;
    }
  });

  await load();
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
</html>
