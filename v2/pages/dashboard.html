<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand { display: flex; align-items: center; gap: var(--space-2); font-weight: 700; font-size: var(--text-base); letter-spacing: -0.015em; }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-6) var(--space-6) var(--space-10); } }

  /* ---------- Greeting ---------- */
  .greet { margin-bottom: var(--space-5); }
  .greet__title {
    font-size: var(--text-2xl); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.1;
    margin-bottom: 6px;
  }
  @media (min-width: 640px) { .greet__title { font-size: var(--text-3xl); } }
  .greet__row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: var(--text-sm); color: var(--text-muted);
  }
  .role-badge {
    display: inline-flex; align-items: center;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    font-size: 0.6875rem; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--brand-subtle); color: var(--brand);
    flex-shrink: 0;
  }
  .greet__scope { color: var(--text-muted); }

  /* ---------- Stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bg-sunken);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-5);
    padding: var(--space-3) 0;
    overflow: hidden;
  }
  .stat {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    padding: 0 var(--space-2);
    border-right: 1px solid var(--border);
    text-decoration: none; color: var(--text);
    min-width: 0;
  }
  .stat:last-child { border-right: none; }
  .stat__num {
    font-size: var(--text-xl); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1;
    font-feature-settings: "tnum";
  }
  .stat__label {
    font-size: 0.5625rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--text-subtle);
    text-align: center;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .stat__num[data-pulse] { animation: numPulse 0.5s var(--ease); }
  @keyframes numPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); color: var(--brand); }
    100% { transform: scale(1); }
  }

  /* ---------- Quick actions ---------- */
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-2);
    margin-bottom: var(--space-6);
  }
  .action {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    padding: 8px 4px;
    text-decoration: none; color: var(--text);
    background: transparent; border: none;
    font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .action__icon {
    width: 52px; height: 52px;
    border-radius: var(--radius-full);
    background: var(--brand-subtle);
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--duration-fast) var(--ease);
  }
  .action:hover .action__icon { transform: translateY(-2px); background: color-mix(in srgb, var(--brand) 18%, transparent); }
  .action__icon svg { width: 22px; height: 22px; }
  .action__label {
    font-size: 0.75rem; font-weight: 500;
    text-align: center; line-height: 1.2;
    color: var(--text);
  }

  /* ---------- Sections ---------- */
  .section { margin-bottom: var(--space-6); }
  .section__head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--space-3); margin-bottom: var(--space-3);
  }
  .section__title {
    font-size: var(--text-md); font-weight: 800;
    letter-spacing: -0.02em;
  }
  .section__link {
    font-size: var(--text-sm); font-weight: 500;
    color: var(--brand); text-decoration: none;
    flex-shrink: 0;
  }
  .section__link:hover { text-decoration: underline; }

  /* ---------- Filter chips ---------- */
  .chips {
    display: flex; gap: 6px;
    overflow-x: auto; padding-bottom: 8px;
    margin-bottom: var(--space-2);
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.4rem 0.85rem;
    border-radius: var(--radius-full);
    font-size: var(--text-sm); font-weight: 500;
    cursor: pointer; flex-shrink: 0;
    transition: all var(--duration-fast) var(--ease);
    font-family: inherit;
    min-height: 34px;
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip[aria-pressed="true"] { background: #0c0a09; color: #fff; border-color: #0c0a09; }

  /* ---------- List rows ---------- */
  .list { display: flex; flex-direction: column; gap: 2px; }

  .row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    text-decoration: none; color: var(--text);
    transition: background var(--duration-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
    border: none; background: transparent;
    width: 100%; text-align: left;
    font-family: inherit; font-size: inherit;
  }
  .row:hover { background: var(--bg-sunken); }
  .row[data-clickable] { cursor: pointer; }

  .row__icn {
    width: 40px; height: 40px;
    border-radius: var(--radius-full);
    background: var(--brand-subtle);
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: var(--text-sm); font-weight: 700;
    text-transform: uppercase;
    overflow: hidden;
  }
  .row__icn svg { width: 18px; height: 18px; }
  .row__icn img { width: 100%; height: 100%; object-fit: cover; }
  .row__icn--alert { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .row__icn--warn  { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
  .row__icn--ok    { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }

  .row__body { flex: 1; min-width: 0; }
  .row__title {
    font-size: var(--text-sm); font-weight: 500;
    line-height: var(--leading-snug);
    margin-bottom: 2px;
    overflow-wrap: anywhere;
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .row__sub {
    font-size: var(--text-xs); color: var(--text-muted);
    line-height: var(--leading-snug);
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }
  .row__meta {
    font-size: var(--text-xs); color: var(--text-subtle);
    flex-shrink: 0; text-align: right;
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 4px;
  }
  .row__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand); flex-shrink: 0;
  }

  .course-chip {
    font-size: 0.625rem; font-weight: 700;
    padding: 2px 6px; border-radius: var(--radius-sm);
    background: var(--brand-subtle); color: var(--brand);
    letter-spacing: 0.02em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Progress bars ---------- */
  .bar {
    height: 8px; border-radius: 4px;
    background: var(--bg-sunken);
    overflow: hidden;
    margin-top: 6px;
  }
  .bar__fill {
    height: 100%; border-radius: 4px;
    background: var(--brand);
    transition: width 400ms var(--ease);
  }

  /* ---------- Empty states ---------- */
  .empty-inline {
    padding: var(--space-5) var(--space-4);
    background: var(--bg-sunken);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border-strong);
    text-align: center;
    font-size: var(--text-sm);
    color: var(--text-muted);
    line-height: var(--leading-snug);
  }

  .state { padding: var(--space-8) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }
  #content[hidden] { display: none; }

  .skel {
    background: linear-gradient(90deg, var(--bg-sunken) 0%, var(--bg-elevated) 50%, var(--bg-sunken) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: var(--radius-md);
    height: 60px;
    margin-bottom: 6px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .toast {
    position: fixed; bottom: 84px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all var(--duration) var(--ease);
    z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    Matric
  </div>
  <div class="topbar__right"></div>
</header>

<main class="wrap">
  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div id="content" hidden></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let meId = null, me = null, roleNames = [], dashType = 'student';
  let channel = null;

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  meId = session.user.id;

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  const timeAgo = (iso) => {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }
  function showError(msg) {
    $('state-loading').hidden = true;
    $('state-error').hidden = false;
    $('state-error').textContent = msg;
  }
  function animateNumber(el, to) {
    const from = parseInt(el.textContent, 10);
    el.textContent = to;
    if (!Number.isNaN(from) && from !== to) {
      el.removeAttribute('data-pulse');
      void el.offsetWidth;
      el.setAttribute('data-pulse', '1');
      setTimeout(() => el.removeAttribute('data-pulse'), 500);
    }
  }

  // ---------- Icons ----------
  const I = {
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
    megaphone: '<path d="M3 11l18-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    checkSquare: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    bar: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
    doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>',
    db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>',
    globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  };
  const svg = (path, size = 20) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

  // ---------- Load profile + roles ----------
  const { data: profile, error: pErr } = await supabase
    .from('profiles')
    .select(`
      id, full_name, email, role, status, registration_step, verification_status,
      institution_id, faculty_id, department_id, programme_id, level_id, session_id,
      matric_no, staff_no, avatar_url, created_at,
      institutions ( name ),
      faculties    ( name ),
      departments  ( name ),
      programmes   ( name ),
      levels       ( display_name, ordinal ),
      academic_sessions ( name )
    `)
    .eq('id', meId)
    .single();

  if (pErr) { showError('Could not load profile: ' + pErr.message); throw pErr; }
  if (profile.registration_step && profile.registration_step !== 'complete') {
    location.replace('onboarding.html'); throw new Error('onboarding incomplete');
  }
  me = profile;

  const { data: roleRows } = await supabase
    .from('user_role_assignments')
    .select('scope_type, scope_id, role_definitions(name)')
    .eq('user_id', meId)
    .eq('status', 'active');
  roleNames = (roleRows || []).map(r => r.role_definitions?.name).filter(Boolean);

  // Priority: Dean > HOD > Lecturer > Staff > Student
  if (roleNames.includes('FACULTY_ADMIN')) dashType = 'dean';
  else if (roleNames.includes('HOD'))      dashType = 'hod';
  else if (roleNames.includes('LECTURER')) dashType = 'lecturer';
  else if (roleNames.includes('STAFF'))    dashType = 'staff';
  else                                     dashType = 'student';

  // ---------- Shared greeting ----------
  function greeting() {
    const first = (me.full_name || 'there').split(' ')[0];
    const hour = new Date().getHours();
    const w = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    return `${w}, ${first}.`;
  }

  function roleBadge() {
    const map = {
      student:  { label: 'Verified Student',       scope: me.institutions?.name || '' },
      lecturer: { label: 'Lecturer',               scope: [me.departments?.name, me.institutions?.name].filter(Boolean).join(', ') },
      hod:      { label: 'Head of Department',     scope: 'Scope: ' + (me.departments?.name || '—') },
      dean:     { label: 'Dean',                   scope: 'Scope: ' + (me.faculties?.name || '—') },
      staff:    { label: 'Staff',                  scope: me.institutions?.name || '' },
    };
    const m = map[dashType] || map.student;
    return `<div class="greet__row"><span class="role-badge">${esc(m.label)}</span><span class="greet__scope">${esc(m.scope)}</span></div>`;
  }

  function renderGreeting() {
    return `<section class="greet">
      <h1 class="greet__title">${esc(greeting())}</h1>
      ${roleBadge()}
    </section>`;
  }

  // ---------- Small HTML builders ----------
  function statTile(num, label, id) {
    return `<a class="stat" href="#" data-stat="${id}">
      <span class="stat__num" id="stat-${id}">${num}</span>
      <span class="stat__label">${esc(label)}</span>
    </a>`;
  }
  function actionTile(href, label, iconPath) {
    return `<a class="action" href="${esc(href)}">
      <span class="action__icon">${svg(iconPath, 22)}</span>
      <span class="action__label">${esc(label)}</span>
    </a>`;
  }
  function emptyInline(msg) {
    return `<div class="empty-inline">${esc(msg)}</div>`;
  }
  function sectionHead(title, linkHref, linkLabel) {
    return `<div class="section__head">
      <h2 class="section__title">${esc(title)}</h2>
      ${linkHref ? `<a class="section__link" href="${esc(linkHref)}">${esc(linkLabel || 'View all')} →</a>` : ''}
    </div>`;
  }

  // ============================================================
  // STUDENT dashboard
  // ============================================================
  async function renderStudent() {
    const html = `
      ${renderGreeting()}
      <div class="stats" id="stats-row">
        ${statTile('—', 'Unread',  'unread')}
        ${statTile('—', 'Notices', 'notices')}
        ${statTile('—', 'Courses', 'courses')}
        ${statTile('—', 'Groups',  'groups')}
      </div>
      <div class="actions">
        ${actionTile('messages.html', 'Chat', I.chat)}
        ${actionTile('materials.html', 'Materials', I.folder)}
        ${actionTile('groups.html', 'Join', I.userPlus)}
        ${actionTile('profile.html', 'Profile', I.user)}
      </div>

      <section class="section">
        ${sectionHead('Up next', 'assignments.html', 'All assignments')}
        <div id="up-next"><div class="skel"></div></div>
      </section>

      <section class="section">
        ${sectionHead('Activity', 'announcements.html', 'All notices')}
        <div class="chips" id="activity-chips">
          <button class="chip" data-a="all" aria-pressed="true">All</button>
          <button class="chip" data-a="announcement" aria-pressed="false">Notices</button>
          <button class="chip" data-a="material" aria-pressed="false">Materials</button>
          <button class="chip" data-a="system" aria-pressed="false">Messages</button>
        </div>
        <div id="activity-feed"><div class="skel"></div><div class="skel"></div></div>
      </section>

      <section class="section">
        ${sectionHead('My courses', 'groups.html', 'View all')}
        <div id="my-courses"><div class="skel" style="height:60px;"></div><div class="skel" style="height:60px;"></div></div>
      </section>
    `;
    $('content').innerHTML = html;

  async function loadHodStudentsByLevel() {
    const body = $('students-by-level');
    const deptId = me.department_id;
    if (!deptId) { body.innerHTML = emptyInline('Department not set.'); return; }

    const { data } = await supabase
      .from('profiles')
      .select('level_id, levels ( ordinal, display_name )')
      .eq('department_id', deptId).eq('role', 'student');

    const counts = {};
    (data || []).forEach(r => {
      const key = r.levels?.ordinal ?? 0;
      counts[key] = (counts[key] || 0) + 1;
    });
    const rows = Object.entries(counts)
      .map(([ord, n]) => ({ ord: parseInt(ord, 10), n }))
      .filter(r => r.ord > 0)
      .sort((a, b) => a.ord - b.ord);

    if (!rows.length) { body.innerHTML = emptyInline('No enrolled students yet.'); return; }
    const max = Math.max(...rows.map(r => r.n));
    body.innerHTML = '<div class="list">' + rows.map(r => `

        <div class="row__body">
          <div class="row__title" style="font-weight:600;">${r.ord} Level</div>
          <div class="bar"><div class="bar__fill" style="width:${(r.n / max) * 100}%"></div></div>
        </div>

  // ---------- Student: upcoming assignments ----------
  async function loadStudentUpNext() {
    const body = document.getElementById('up-next');
    if (!body) return;
    try {
      const { data: ce } = await supabase.from('course_enrollments')
        .select('course_id')
        .eq('user_id', meId).eq('status', 'active');
      const ids = (ce || []).map(r => r.course_id);
      if (!ids.length) { body.innerHTML = emptyInline('Enrol in courses to see assignments.'); return; }

      const { data, error } = await supabase.from('assignments')
        .select('id, title, due_at, course_id, max_score, courses ( code )')
        .in('course_id', ids)
        .order('due_at', { ascending: true })
        .limit(5);

      if (error) { body.innerHTML = emptyInline('Could not load assignments.'); return; }
      if (!data || !data.length) { body.innerHTML = emptyInline('No upcoming assignments.'); return; }

      const { data: subs } = await supabase.from('assignment_submissions')
        .select('assignment_id').eq('student_id', meId).in('assignment_id', data.map(a => a.id));
      const submittedIds = new Set((subs || []).map(s => s.assignment_id));

      const pending = data.filter(a => !submittedIds.has(a.id));
      if (!pending.length) { body.innerHTML = emptyInline('You are all caught up.'); return; }

      body.innerHTML = '<div class="list">' + pending.map(a => `
        <a class="row" href="assignments.html">
          <span class="row__icn row__icn--warn">${svg(I.doc, 18)}</span>
          <div class="row__body">
            <div class="row__title">${esc(a.title)} <span class="course-chip">${esc(a.courses?.code || '')}</span></div>
            <div class="row__sub">${a.due_at ? 'Due ' + new Date(a.due_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'No due date'}</div>
          </div>
          <span class="row__meta" style="color:var(--text-subtle);">›</span>
        </a>
      `).join('') + '</div>';
    } catch (err) {
      console.error('[dashboard] loadStudentUpNext:', err);
      body.innerHTML = emptyInline('Could not load assignments.');
    }
  }

  // ---------- Lecturer: ungraded submissions ----------
  async function loadLecturerAttention() {
    const body = document.getElementById('lect-attention');
    if (!body) return;
    try {
      const { data: ca } = await supabase.from('course_assignments')
        .select('course_id').eq('lecturer_id', meId);
      const ids = (ca || []).map(r => r.course_id);
      if (!ids.length) { body.innerHTML = emptyInline('No courses assigned to you.'); return; }

      const { data: asgs } = await supabase.from('assignments')
        .select('id, title, courses ( code )').in('course_id', ids);
      if (!asgs || !asgs.length) { body.innerHTML = emptyInline('No assignments created yet.'); return; }

      const { data: subs } = await supabase.from('assignment_submissions')
        .select('id, assignment_id, status, submitted_at, profiles:student_id ( full_name )')
        .in('assignment_id', asgs.map(a => a.id))
        .neq('status', 'graded')
        .order('submitted_at', { ascending: false })
        .limit(5);

      if (!subs || !subs.length) { body.innerHTML = emptyInline('All submissions graded.'); return; }

      const asgMap = Object.fromEntries(asgs.map(a => [a.id, a]));
      body.innerHTML = '<div class="list">' + subs.map(s => {
        const a = asgMap[s.assignment_id];
        return `
          <a class="row" href="assignments.html">
            <span class="row__icn row__icn--warn">${svg(I.user, 18)}</span>
            <div class="row__body">
              <div class="row__title">${esc(s.profiles?.full_name || 'Student')} <span class="course-chip">${esc(a?.courses?.code || '')}</span></div>
              <div class="row__sub">${esc(a?.title || '')} · ${timeAgo(s.submitted_at)}</div>
            </div>
            <span class="row__meta" style="color:var(--brand);font-weight:600;">Grade</span>
          </a>`;
      }).join('') + '</div>';
    } catch (err) {
      console.error('[dashboard] loadLecturerAttention:', err);
      body.innerHTML = emptyInline('Could not load submissions.');
    }
  }

  // ---------- Wire it up ----------
  const renderers = {
    student: renderStudent,
    lecturer: renderLecturer,
    hod: renderHod,
    dean: renderDean,
    staff: renderStaff,
  };
  try {
    await (renderers[dashType] || renderStudent)();
    $('state-loading').hidden = true;
    $('content').hidden = false;
  } catch (err) {
    console.error('[dashboard] boot failed:', err);
    $('state-loading').hidden = true;
    const errBox = $('state-error');
    errBox.hidden = false;
    errBox.textContent = 'Dashboard error: ' + (err && err.message ? err.message : String(err));
  }


  // ---------- Chips handlers (student activity, dean departments) ----------
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-a]');
    if (chip) {
      studentActivityFilter = chip.dataset.a;
      document.querySelectorAll('[data-a]').forEach(c =>
        c.setAttribute('aria-pressed', String(c.dataset.a === studentActivityFilter)));
      renderStudentActivity();
    }
    const dchip = e.target.closest('[data-d]');
    if (dchip) {
      document.querySelectorAll('[data-d]').forEach(c =>
        c.setAttribute('aria-pressed', String(c.dataset.d === dchip.dataset.d)));
      // Only "students" is implemented; others show the same list for now
      loadDeanDepartments();
    }
  });

  // ---------- Realtime: badges / stats refresh ----------
  channel = supabase
    .channel('dashboard-live:' + meId)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + meId },
        () => {
          if (dashType === 'student') { loadStudentStats(); loadStudentActivity(); }
          else if (dashType === 'lecturer') { loadLecturerStats(); }
          else if (dashType === 'staff') { renderStaff(); }
        })
    .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: 'recipient_id=eq.' + meId },
        () => { if (dashType === 'student') loadStudentStats(); })
    .subscribe();

  // Bump last_seen
  supabase.rpc('touch_my_last_seen').then(() => {});

  window.addEventListener('beforeunload', () => {
    if (channel) supabase.removeChannel(channel);
  });
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
</html>
