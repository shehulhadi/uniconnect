<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--brand); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-8) var(--space-6) var(--space-10); } }

  .greeting { margin-bottom: var(--space-6); }
  .greeting h1 {
    font-size: var(--text-2xl); font-weight: 600;
    letter-spacing: -0.02em; line-height: var(--leading-tight);
    margin-bottom: var(--space-2);
  }
  @media (min-width: 640px) { .greeting h1 { font-size: var(--text-3xl); } }
  .greeting p { color: var(--text-muted); font-size: var(--text-base); }

  /* ---- Primary nav grid ---- */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
    margin-bottom: var(--space-6);
  }
  @media (min-width: 480px) { .nav-grid { grid-template-columns: repeat(4, 1fr); } }

  .nav-card {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: var(--space-3);
    padding: var(--space-4);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-decoration: none; color: var(--text);
    transition: all var(--duration-fast) var(--ease);
    min-height: 96px;
  }
  .nav-card:hover { border-color: var(--brand); transform: translateY(-1px); }
  .nav-card__icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--brand); background: var(--brand-subtle);
    border-radius: var(--radius-md);
  }
  .nav-card__label {
    font-size: var(--text-sm); font-weight: 500;
    letter-spacing: -0.005em;
  }

  /* ---- Sections ---- */
  .section { margin-bottom: var(--space-8); }
  .section__head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--space-4);
  }
  .section__head h2 {
    font-size: var(--text-md); font-weight: 600;
    letter-spacing: -0.01em;
  }
  .section__link {
    font-size: var(--text-sm); color: var(--brand);
    font-weight: 500; text-decoration: none;
  }
  .section__link:hover { text-decoration: underline; }

  /* ---- Item cards ---- */
  .item {
    display: flex; gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-2);
    text-decoration: none; color: var(--text);
    transition: all var(--duration-fast) var(--ease);
  }
  .item:hover { border-color: var(--border-strong); }
  .item:last-child { margin-bottom: 0; }

  .item__icon {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-sunken); color: var(--text-muted);
    border-radius: var(--radius-md);
  }
  .item__body { flex: 1; min-width: 0; }
  .item__title {
    font-size: var(--text-sm); font-weight: 600;
    line-height: var(--leading-snug);
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    margin-bottom: 2px;
  }
  .item__meta {
    font-size: var(--text-xs); color: var(--text-subtle);
    display: flex; gap: var(--space-2); flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    display: inline-block; padding: 0.1rem 0.5rem;
    border-radius: var(--radius-full);
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 0.6875rem;
  }
  .pill--general      { background: #f5f5f4; color: #57534e; }
  .pill--important    { background: #fef3c7; color: #92400e; }
  .pill--urgent       { background: #fee2e2; color: #991b1b; }
  .pill--registration { background: #dcfce7; color: #166534; }
  .pill--seminar      { background: #dbeafe; color: #1e40af; }
  .pill--update       { background: #e0e7ff; color: #3730a3; }
  @media (prefers-color-scheme: dark) {
    .pill--general      { background: #292524; color: #a8a29e; }
    .pill--important    { background: #451a03; color: #fcd34d; }
    .pill--urgent       { background: #450a0a; color: #fca5a5; }
    .pill--registration { background: #052e16; color: #86efac; }
    .pill--seminar      { background: #172554; color: #93c5fd; }
    .pill--update       { background: #1e1b4b; color: #a5b4fc; }
  }
  .course-code {
    font-weight: 600; color: var(--brand);
    background: var(--brand-subtle);
    padding: 0.1rem 0.5rem; border-radius: var(--radius-sm);
    font-size: 0.6875rem; letter-spacing: 0.02em;
  }

  .empty-inline {
    padding: var(--space-5) var(--space-4);
    background: var(--bg-sunken);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border-strong);
    text-align: center;
    font-size: var(--text-sm); color: var(--text-muted);
  }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state--error { color: var(--danger); }
  .state[hidden] { display: none; }

  .skel {
    background: linear-gradient(90deg, var(--bg-sunken) 0%, var(--bg-elevated) 50%, var(--bg-sunken) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: var(--radius-md);
    height: 68px; margin-bottom: var(--space-2);
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    UniConnect
  </div>
  <div class="topbar__right">
    <a class="avatar" href="profile.html" id="topbar-avatar" title="Your profile">?</a>
    <button class="avatar" style="border:none;cursor:pointer;" id="btn-signout" title="Sign out" aria-label="Sign out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
    </button>
  </div>
</header>

<main class="wrap">

  <div class="greeting">
    <h1 id="greeting-title">Hello.</h1>
    <p id="greeting-sub">Welcome back.</p>
  </div>

  <div class="nav-grid">
    <a class="nav-card" href="announcements.html">
      <span class="nav-card__icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8v18L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
      </span>
      <span class="nav-card__label">Announcements</span>
    </a>
    <a class="nav-card" href="materials.html">
      <span class="nav-card__icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </span>
      <span class="nav-card__label">Materials</span>
    </a>
    <a class="nav-card" href="groups.html">
      <span class="nav-card__icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      <span class="nav-card__label">Groups</span>
    </a>
    <a class="nav-card" href="profile.html">
      <span class="nav-card__icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <span class="nav-card__label">Profile</span>
    </a>
  </div>

  <section class="section">
    <div class="section__head">
      <h2>Recent announcements</h2>
      <a class="section__link" href="announcements.html">See all →</a>
    </div>
    <div id="feed-ann">
      <div class="skel"></div><div class="skel"></div>
    </div>
  </section>

  <section class="section">
    <div class="section__head">
      <h2>Recent materials</h2>
      <a class="section__link" href="materials.html">See all →</a>
    </div>
    <div id="feed-mat">
      <div class="skel"></div><div class="skel"></div>
    </div>
  </section>

  <section class="section">
    <div class="section__head">
      <h2>Your groups</h2>
      <a class="section__link" href="groups.html">Manage →</a>
    </div>
    <div id="feed-groups">
      <div class="skel"></div>
    </div>
  </section>

</main>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }

  const meId = session.user.id;

  // ---- Helpers ----
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function fmtBytes(bytes) {
    if (!bytes) return '';
    const kb = bytes / 1024;
    if (kb < 1024) return kb.toFixed(0) + ' KB';
    return (kb / 1024).toFixed(1) + ' MB';
  }
  function initials(name) {
    return (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }
  function emptyHtml(msg) { return `<div class="empty-inline">${esc(msg)}</div>`; }

  // ---- Profile ----
  const { data: profile } = await supabase
    .from('profiles')
    .select('id, full_name, role')
    .eq('id', meId)
    .single();

  const firstName = (profile?.full_name || 'there').split(' ')[0];
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  $('greeting-title').textContent = `${greet}, ${firstName}.`;
  $('greeting-sub').textContent = 'Here is what is new.';

  $('topbar-avatar').textContent = initials(profile?.full_name);

  // ---- Announcements feed ----
  async function loadAnnouncements() {
    const { data, error } = await supabase
      .from('announcements')
      .select('id, title, tag, created_at')
      .order('created_at', { ascending: false })
      .limit(3);

    const el = $('feed-ann');
    if (error) { el.innerHTML = emptyHtml('Could not load announcements.'); return; }
    if (!data || data.length === 0) { el.innerHTML = emptyHtml('No announcements yet.'); return; }

    el.innerHTML = data.map(a => `
      <a class="item" href="announcements.html">
        <div class="item__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8v18L3 13v-2z"/></svg>
        </div>
        <div class="item__body">
          <div class="item__title">${esc(a.title)}</div>
          <div class="item__meta">
            <span class="pill pill--${esc(a.tag)}">${esc(a.tag)}</span>
            <span>${timeAgo(a.created_at)}</span>
          </div>
        </div>
      </a>
    `).join('');
  }

  // ---- Materials feed ----
  async function loadMaterials() {
    const { data, error } = await supabase
      .from('materials')
      .select('id, title, course_code, file_size, created_at')
      .order('created_at', { ascending: false })
      .limit(3);

    const el = $('feed-mat');
    if (error) { el.innerHTML = emptyHtml('Could not load materials.'); return; }
    if (!data || data.length === 0) { el.innerHTML = emptyHtml('No materials yet.'); return; }

    el.innerHTML = data.map(m => `
      <a class="item" href="materials.html">
        <div class="item__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div class="item__body">
          <div class="item__title">${esc(m.title)}</div>
          <div class="item__meta">
            <span class="course-code">${esc(m.course_code)}</span>
            <span>${fmtBytes(m.file_size)}</span>
            <span>·</span>
            <span>${timeAgo(m.created_at)}</span>
          </div>
        </div>
      </a>
    `).join('');
  }

  // ---- Groups feed ----
  async function loadGroups() {
    const { data, error } = await supabase
      .from('group_members')
      .select(`
        joined_at,
        groups ( id, name, type )
      `)
      .eq('user_id', meId)
      .order('joined_at', { ascending: false })
      .limit(4);

    const el = $('feed-groups');
    if (error) { el.innerHTML = emptyHtml('Could not load groups.'); return; }
    if (!data || data.length === 0) {
      el.innerHTML = emptyHtml('You are not in any groups yet. <a href="groups.html" style="color:var(--brand)">Find one →</a>');
      return;
    }

    el.innerHTML = data.map(row => {
      const g = row.groups;
      if (!g) return '';
      return `
        <a class="item" href="group-chat.html?id=${esc(g.id)}">
          <div class="item__icon" style="background:var(--brand-subtle);color:var(--brand);font-weight:600;font-size:12px;">${initials(g.name)}</div>
          <div class="item__body">
            <div class="item__title">${esc(g.name)}</div>
            <div class="item__meta">
              <span>${esc(g.type)}</span>
              <span>·</span>
              <span>joined ${timeAgo(row.joined_at)}</span>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  // ---- Sign out ----
  $('btn-signout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.replace('login.html');
  });

  // ---- Boot (parallel) ----
  await Promise.all([loadAnnouncements(), loadMaterials(), loadGroups()]);
</script>

  <script type="module" src="../js/bottom-nav.js"></script>
</body>
</html>
