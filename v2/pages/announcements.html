<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Announcements — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-5);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--brand); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .btn-ghost {
    appearance: none; background: transparent;
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.45rem 0.85rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease); min-height: 36px;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn-ghost:hover {
    border-color: var(--border-strong); color: var(--text);
    background: var(--bg-elevated);
  }
  .btn-primary {
    appearance: none; background: var(--brand); color: var(--brand-fg);
    border: none; padding: 0.55rem 1rem;
    border-radius: var(--radius-md); font-size: var(--text-sm);
    font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    min-height: 38px; display: inline-flex;
    align-items: center; gap: var(--space-2);
  }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
  @media (min-width: 640px) { .wrap { padding: var(--space-8) var(--space-6); } }

  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap;
  }
  .page-head h1 {
    font-size: var(--text-2xl); font-weight: 600;
    letter-spacing: -0.02em; line-height: var(--leading-tight);
    margin-bottom: var(--space-2);
  }
  @media (min-width: 640px) { .page-head h1 { font-size: var(--text-3xl); } }
  .page-head p { color: var(--text-muted); font-size: var(--text-base); }

  .filters { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .chip {
    appearance: none; background: var(--bg-elevated);
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.35rem 0.75rem; border-radius: var(--radius-full);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .list { display: flex; flex-direction: column; gap: var(--space-3); }

  .ann {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--space-5);
    transition: border-color var(--duration-fast) var(--ease);
  }
  .ann:hover { border-color: var(--border-strong); }

  .ann__meta {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-3); flex-wrap: wrap;
  }
  .tag {
    font-size: var(--text-xs); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.2rem 0.55rem; border-radius: var(--radius-full);
  }
  .tag--general      { background: #f5f5f4; color: #57534e; }
  .tag--important    { background: #fef3c7; color: #92400e; }
  .tag--urgent       { background: #fee2e2; color: #991b1b; }
  .tag--registration { background: #dcfce7; color: #166534; }
  .tag--seminar      { background: #dbeafe; color: #1e40af; }
  .tag--update       { background: #e0e7ff; color: #3730a3; }

  @media (prefers-color-scheme: dark) {
    .tag--general      { background: #292524; color: #a8a29e; }
    .tag--important    { background: #451a03; color: #fcd34d; }
    .tag--urgent       { background: #450a0a; color: #fca5a5; }
    .tag--registration { background: #052e16; color: #86efac; }
    .tag--seminar      { background: #172554; color: #93c5fd; }
    .tag--update       { background: #1e1b4b; color: #a5b4fc; }
  }

  .ann__time { font-size: var(--text-xs); color: var(--text-subtle); }
  .ann__title {
    font-size: var(--text-md); font-weight: 600;
    letter-spacing: -0.01em; line-height: var(--leading-snug);
    margin-bottom: var(--space-2);
  }
  .ann__body {
    color: var(--text-muted); font-size: var(--text-sm);
    line-height: var(--leading-base); white-space: pre-wrap;
  }

  .state { padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }
  .state h3 { font-size: var(--text-md); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }
  .state p { max-width: 40ch; margin: 0 auto; }

  #list[hidden] { display: none; }

  /* --- Modal --- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 500px;
    max-height: 90vh; overflow-y: auto;
    padding: var(--space-6);
    transform: translateY(12px);
    transition: transform var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }

  .modal h2 {
    font-size: var(--text-lg); font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: var(--space-2);
  }
  .modal .sub {
    font-size: var(--text-sm); color: var(--text-muted);
    margin-bottom: var(--space-5);
  }
  .modal .field { margin-bottom: var(--space-4); }
  .modal label {
    display: block; font-size: var(--text-sm);
    font-weight: 500; color: var(--text);
    margin-bottom: var(--space-2);
  }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 0.7rem 0.85rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-base);
    color: var(--text); transition: all var(--duration-fast) var(--ease);
  }
  .modal textarea { min-height: 120px; resize: vertical; font-family: inherit; line-height: var(--leading-base); }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
    outline: none;
  }

  .modal-alert {
    display: none; padding: 0.7rem 0.9rem;
    border-radius: var(--radius-md); font-size: var(--text-sm);
    margin-bottom: var(--space-4); line-height: var(--leading-snug);
  }
  .modal-alert[data-show] { display: block; }
  .modal-alert--error {
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
  }

  .modal-actions {
    display: flex; gap: var(--space-3);
    margin-top: var(--space-5); justify-content: flex-end;
  }
  @media (max-width: 480px) { .modal-actions { flex-direction: column-reverse; } }
  .btn-danger {
    appearance: none; background: transparent; color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
    padding: 0.55rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease); min-height: 38px;
  }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
</style>
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/notifications.css">
  <link rel="stylesheet" href="../css/topbar.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    UniConnect
  </div>
  <div class="topbar__right"></div>
</header>

<main class="wrap">

  <div class="page-head">
    <div>
      <h1>Announcements</h1>
      <p>Notices from your institution.</p>
    </div>
    <button class="btn-primary" id="btn-new" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </div>

  <div class="filters" id="filters">
    <button class="chip" data-tag="all" aria-pressed="true">All</button>
    <button class="chip" data-tag="important" aria-pressed="false">Important</button>
    <button class="chip" data-tag="urgent" aria-pressed="false">Urgent</button>
    <button class="chip" data-tag="registration" aria-pressed="false">Registration</button>
    <button class="chip" data-tag="seminar" aria-pressed="false">Seminar</button>
    <button class="chip" data-tag="update" aria-pressed="false">Update</button>
  </div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div class="state" id="state-empty" hidden>
    <h3>Nothing here yet</h3>
    <p>No announcements match this filter.</p>
  </div>
  <div class="list" id="list" hidden></div>

</main>

<!-- Modal -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">New announcement</h2>
    <p class="sub">This will be visible to everyone at your institution.</p>

    <div class="modal-alert modal-alert--error" id="modal-alert"></div>

    <form id="form-new">
      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" required maxlength="150" placeholder="Short, descriptive title">
      </div>
      <div class="field">
        <label for="f-tag">Category</label>
        <select id="f-tag" required>
          <option value="general">General</option>
          <option value="important">Important</option>
          <option value="urgent">Urgent</option>
          <option value="registration">Registration</option>
          <option value="seminar">Seminar</option>
          <option value="update">Update</option>
        </select>
      </div>
      <div class="field">
        <label for="f-body">Message</label>
        <textarea id="f-body" required maxlength="5000" placeholder="Write the announcement…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-submit">Publish</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let allAnnouncements = [];
  let activeTag = 'all';
  let currentProfile = null;

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.replace('login.html');
    throw new Error('unauthenticated');
  }

  // ---- Load profile ----
  const { data: profile, error: pErr } = await supabase
    .from('profiles')
    .select('id, full_name, email, role, institution_id')
    .eq('id', session.user.id)
    .single();

  if (pErr) {
    showError('Could not load profile: ' + pErr.message);
    throw pErr;
  }
  currentProfile = profile;

  const initials = (profile.full_name || profile.email || '?')
    .split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('');
  $('topbar-avatar').textContent = initials.toUpperCase();
  $('topbar-avatar').hidden = false;

  // Show "New" button only for roles permitted by RLS
  const canPost = ['lecturer','staff','hod','admin','leadership'].includes(profile.role);
  if (canPost && profile.institution_id) {
    $('btn-new').hidden = false;
  }

  // ---- Load announcements ----
  function showError(msg) {
    $('state-loading').hidden = true;
    $('state-error').textContent = msg;
    $('state-error').hidden = false;
  }

  async function load() {
    const { data, error } = await supabase
      .from('announcements')
      .select('id, title, body, tag, created_at')
      .order('created_at', { ascending: false });

    if (error) {
      showError('Could not load announcements: ' + error.message);
      return;
    }

    allAnnouncements = data || [];
    $('state-loading').hidden = true;
    render();
  }

  // ---- Render ----
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function render() {
    const filtered = activeTag === 'all'
      ? allAnnouncements
      : allAnnouncements.filter(a => a.tag === activeTag);

    $('list').hidden = filtered.length === 0;
    $('state-empty').hidden = filtered.length !== 0;

    $('list').innerHTML = filtered.map(a => `
      <article class="ann">
        <div class="ann__meta">
          <span class="tag tag--${escapeHtml(a.tag)}">${escapeHtml(a.tag)}</span>
          <span class="ann__time">${formatTime(a.created_at)}</span>
        </div>
        <h2 class="ann__title">${escapeHtml(a.title)}</h2>
        <p class="ann__body">${escapeHtml(a.body)}</p>
      </article>
    `).join('');
  }

  // ---- Filters ----
  $('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    activeTag = btn.dataset.tag;
    document.querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.tag === activeTag))
    );
    render();
  });

  // ---- Modal ----
  function openModal() {
    $('modal-alert').removeAttribute('data-show');
    $('form-new').reset();
    $('modal').setAttribute('data-open', '1');
    $('modal').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('f-title').focus(), 50);
  }
  function closeModal() {
    $('modal').removeAttribute('data-open');
    $('modal').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  $('btn-new').addEventListener('click', openModal);
  $('btn-cancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal();
  });

  // ---- Submit ----
  $('form-new').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = $('f-title').value.trim();
    const body  = $('f-body').value.trim();
    const tag   = $('f-tag').value;
    const btn   = $('btn-submit');
    const alertEl = $('modal-alert');

    alertEl.removeAttribute('data-show');

    if (!title || !body) {
      alertEl.textContent = 'Title and message are required.';
      alertEl.setAttribute('data-show', '1');
      return;
    }
    if (!profile.institution_id) {
      alertEl.textContent = 'Your account is not assigned to an institution.';
      alertEl.setAttribute('data-show', '1');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Publishing…';

    const { error } = await supabase.from('announcements').insert({
      institution_id: profile.institution_id,
      author_id: profile.id,
      title,
      body,
      tag,
    });

    btn.disabled = false;
    btn.textContent = 'Publish';

    if (error) {
      alertEl.textContent = error.message;
      alertEl.setAttribute('data-show', '1');
      return;
    }

    closeModal();
    await load();
  });

  // ---- Sign out ----
  $('btn-signout')?.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.replace('login.html');
  });

  load();
</script>

  <script type="module" src="../js/bottom-nav.js"></script>
  <script type="module" src="../js/notifications.js"></script>
</body>
</html>
