<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Group — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { height: 100%; height: 100dvh; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
    flex-shrink: 0;
  }
  .topbar__left { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); text-decoration: none;
    transition: all var(--duration-fast) var(--ease);
    flex-shrink: 0;
  }
  .back:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elevated); }

  .head { min-width: 0; }
  .head__name {
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head__meta {
    font-size: var(--text-xs); color: var(--text-subtle);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .main {
    flex: 1; min-height: 0;
    max-width: 720px; width: 100%;
    margin: 0 auto;
    padding: 0 var(--space-4) 96px var(--space-4);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  .msgs {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: var(--space-4) 0;
    display: flex; flex-direction: column; gap: var(--space-3);
  }
  .msgs::-webkit-scrollbar { width: 6px; }
  .msgs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .date-divider {
    text-align: center;
    font-size: var(--text-xs);
    color: var(--text-subtle);
    padding: var(--space-2) 0;
    position: relative;
  }
  .date-divider span {
    background: var(--bg); padding: 0 var(--space-3);
    position: relative; z-index: 1;
  }
  .date-divider::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--border);
  }

  .msg {
    display: flex; gap: var(--space-3);
    align-items: flex-end;
    max-width: 85%;
  }
  .msg--mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg__avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .msg--mine .msg__avatar { background: var(--brand); color: var(--brand-fg); }
  .msg__bubble {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-2) var(--space-3);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg--mine .msg__bubble {
    background: var(--brand); color: var(--brand-fg);
    border-color: var(--brand);
  }
  .msg__sender {
    font-size: var(--text-xs); font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .msg__time {
    font-size: 0.6875rem; color: var(--text-subtle);
    margin-top: 3px; display: block;
  }
  .msg--mine .msg__time { color: color-mix(in srgb, var(--brand-fg) 70%, transparent); }

  .composer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: var(--space-3) var(--space-4) max(var(--space-3), env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    .composer {
      left: 50%;
      transform: translateX(-50%);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
    }
  }
  .composer__row { display: flex; gap: var(--space-2); align-items: flex-end; }
  .composer textarea {
    flex: 1;
    min-height: 40px; max-height: 140px;
    padding: 0.65rem 0.85rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: var(--text-base); font-family: inherit;
    color: var(--text); line-height: 1.4;
    resize: none;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .composer textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .composer textarea:disabled { opacity: 0.6; cursor: not-allowed; }
  .send {
    appearance: none;
    background: var(--brand); color: var(--brand-fg);
    border: none; border-radius: var(--radius-md);
    padding: 0 1rem; min-width: 60px; min-height: 40px;
    font-size: var(--text-sm); font-weight: 500;
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--space-1);
  }
  .send:hover:not(:disabled) { background: var(--brand-hover); }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }

  .state {
    padding: var(--space-6) var(--space-4);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-sm);
  }
  .state--error { color: var(--danger); }
  .state--empty { margin: auto; max-width: 34ch; }
  .state--empty h3 {
    font-size: var(--text-base); color: var(--text);
    margin-bottom: var(--space-2); font-weight: 600;
  }
  .state[hidden] { display: none; }

  .live-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--success);
    margin-right: 4px; vertical-align: middle;
  }
  .live-dot.off { background: var(--text-subtle); }
</style>
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/notifications.css">
</head>
<body data-no-nav="1" data-no-notifications="1">

<header class="topbar">
  <div class="topbar__left">
    <a class="back" href="groups.html" aria-label="Back to groups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <div class="head">
      <div class="head__name" id="g-name">Loading…</div>
      <div class="head__meta"><span class="live-dot off" id="live-dot"></span><span id="g-meta">Connecting…</span></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="msgs" id="msgs">
    <div class="state" id="state-loading">Loading messages…</div>
  </div>

  <form class="composer" id="composer">
    <div class="composer__row">
      <textarea id="input" rows="1" placeholder="Write a message…" maxlength="2000" autocomplete="off" disabled></textarea>
      <button class="send" id="btn-send" type="submit" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </form>
</main>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  const log = (...a) => console.log('[group]', ...a);
  const warn = (...a) => console.warn('[group]', ...a);

  const params = new URLSearchParams(location.search);
  const groupId = params.get('id');

  log('boot, groupId =', groupId);

  if (!groupId) {
    location.replace('groups.html');
    throw new Error('missing group id');
  }

  // ---- Auth guard ----
  const { data: { session }, error: sessErr } = await supabase.auth.getSession();
  if (sessErr) { log('session error', sessErr); }
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  const meId = session.user.id;
  log('me =', meId);

  // ---- Topbar status helper ----
  function setMeta(text, isError) {
    $('g-meta').textContent = text;
    $('g-meta').style.color = isError ? 'var(--danger)' : '';
  }

  // ---- Profile cache ----
  const profilesCache = new Map();
  async function getProfile(userId) {
    if (profilesCache.has(userId)) return profilesCache.get(userId);
    const { data } = await supabase
      .from('profiles')
      .select('id, full_name, email')
      .eq('id', userId)
      .maybeSingle();
    const val = data || { id: userId, full_name: 'Unknown', email: '' };
    profilesCache.set(userId, val);
    return val;
  }

  // ---- DOM helpers ----
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function dateKey(iso) { return new Date(iso).toDateString(); }
  function dateLabel(key) {
    const d = new Date(key);
    const now = new Date();
    const day = 1000 * 60 * 60 * 24;
    const diff = Math.floor((now.setHours(0,0,0,0) - d.setHours(0,0,0,0)) / day);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  }

  async function makeMessageNode(m) {
    const isMine = m.sender_id === meId;
    const p = await getProfile(m.sender_id);
    const initials = (p.full_name || p.email || '?')
      .split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();

    const wrap = el('div', 'msg' + (isMine ? ' msg--mine' : ''));
    wrap.dataset.id = m.id;

    const av = el('div', 'msg__avatar', initials);
    const bubble = el('div', 'msg__bubble');

    if (!isMine) bubble.appendChild(el('div', 'msg__sender', p.full_name || p.email || 'Unknown'));
    bubble.appendChild(document.createTextNode(m.body));
    bubble.appendChild(el('span', 'msg__time', fmtTime(m.created_at)));

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    return wrap;
  }

  function scrollToBottom(smooth = true) {
    requestAnimationFrame(() => {
      msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    });
  }

  // ---- Step 1: load the group ----
  async function loadGroup() {
    const { data, error } = await supabase
      .from('groups')
      .select('id, name, description, type')
      .eq('id', groupId)
      .maybeSingle();

    if (error) { log('loadGroup error', error); return { error }; }
    if (!data)  { return { error: { message: 'Group not found.' } }; }
    return { data };
  }

  // ---- Step 2: check membership ----
  async function checkMembership() {
    const { data, error } = await supabase
      .from('group_members')
      .select('group_id')
      .eq('group_id', groupId)
      .eq('user_id', meId)
      .maybeSingle();
    if (error) { log('membership error', error); return { error }; }
    return { isMember: !!data };
  }

  // ---- Step 3: load messages ----
  const msgsEl = $('msgs');

  async function loadMessages() {
    const { data, error } = await supabase
      .from('group_messages')
      .select('id, sender_id, body, created_at')
      .eq('group_id', groupId)
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) {
      log('loadMessages error', error);
      msgsEl.innerHTML = '';
      const e = el('div', 'state state--error', 'Could not load messages: ' + error.message);
      msgsEl.appendChild(e);
      return;
    }

    msgsEl.innerHTML = '';

    if (!data || data.length === 0) {
      const empty = el('div', 'state state--empty');
      empty.appendChild(el('h3', null, 'No messages yet'));
      empty.appendChild(el('p', null, 'Say hello, or share what the group is working on.'));
      msgsEl.appendChild(empty);
      return;
    }

    let lastKey = null;
    for (const m of data) {
      const k = dateKey(m.created_at);
      if (k !== lastKey) {
        const d = el('div', 'date-divider');
        d.appendChild(el('span', null, dateLabel(k)));
        msgsEl.appendChild(d);
        lastKey = k;
      }
      msgsEl.appendChild(await makeMessageNode(m));
    }
    scrollToBottom(false);
  }

  // ---- Step 4: realtime ----
  let channel = null;
  function subscribe() {
    channel = supabase
      .channel(`group:${groupId}`)
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'group_messages', filter: `group_id=eq.${groupId}` },
        async (payload) => {
          const m = payload.new;
          log('realtime insert', m.id);
          if (msgsEl.querySelector(`[data-id="${m.id}"]`)) return;
          msgsEl.querySelector('.state--empty')?.remove();

          const k = dateKey(m.created_at);
          const lastDivider = msgsEl.querySelector('.date-divider:last-of-type');
          if (lastDivider?.dataset.key !== k) {
            const d = el('div', 'date-divider');
            d.dataset.key = k;
            d.appendChild(el('span', null, dateLabel(k)));
            msgsEl.appendChild(d);
          }
          msgsEl.appendChild(await makeMessageNode(m));
          scrollToBottom();
        }
      )
      .subscribe((status) => {
        log('realtime status:', status);
        const dot = $('live-dot');
        if (status === 'SUBSCRIBED') {
          dot.classList.remove('off');
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          dot.classList.add('off');
        }
      });
  }

  // ---- Composer ----
  const form = $('composer');
  const input = $('input');
  const sendBtn = $('btn-send');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 768px)').matches) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const { data, error } = await supabase
      .from('group_messages')
      .insert({ group_id: groupId, sender_id: meId, body })
      .select('id, sender_id, body, created_at')
      .single();

    sendBtn.disabled = false;

    if (error) {
      log('send error', error);
      input.value = body;
      input.dispatchEvent(new Event('input'));
      setMeta('Send failed: ' + error.message, true);
      setTimeout(() => setMeta('Connected · live'), 4000);
      return;
    }

    msgsEl.querySelector('.state--empty')?.remove();
    msgsEl.appendChild(await makeMessageNode(data));
    scrollToBottom();
  });

  function enableComposer() {
    input.disabled = false;
    sendBtn.disabled = false;
  }
  function disableComposer(reason) {
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = reason;
  }

  // ================================================================
  // BOOT
  // ================================================================

  // 1. Fetch group info
  const gRes = await loadGroup();
  if (gRes.error) {
    $('g-name').textContent = 'Group';
    setMeta(gRes.error.message, true);
    msgsEl.innerHTML = '';
    msgsEl.appendChild(el('div', 'state state--error', gRes.error.message));
    throw new Error(gRes.error.message);
  }

  $('g-name').textContent = gRes.data.name;
  document.title = `${gRes.data.name} — UniConnect`;
  setMeta('Loading…');

  // 2. Check membership before enabling the composer
  const mRes = await checkMembership();
  if (mRes.error) {
    setMeta('Membership check failed', true);
  } else if (!mRes.isMember) {
    setMeta('You are not a member of this group');
    disableComposer('Join the group to post messages');
  } else {
    enableComposer();
  }

  // 3. Load messages (don't block composer)
  await loadMessages();

  // 4. Subscribe to realtime
  if (mRes.isMember) {
    subscribe();
    setMeta('Connected · live');
  }

  log('boot complete');

  window.addEventListener('beforeunload', () => {
    if (channel) supabase.removeChannel(channel);
  });
</script>

  <script type="module" src="../js/bottom-nav.js"></script>
  <script type="module" src="../js/notifications.js"></script>
</body>
</html>
