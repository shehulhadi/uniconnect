<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Course — Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/drawer.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  html, body { height: 100%; height: 100dvh; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    flex-shrink: 0;
    min-height: 56px;
  }
  .back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); text-decoration: none; flex-shrink: 0;
  }
  .back:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-sunken); }

  .head { min-width: 0; flex: 1; }
  .head__name {
    font-weight: 700; font-size: 15px; letter-spacing: -0.015em;
    line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head__meta {
    font-size: 12px; color: var(--text-subtle);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head__meta .live-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--success); margin-right: 4px; vertical-align: middle;
  }
  .head__meta .live-dot.off { background: var(--text-subtle); }

  /* ---------- Tabs ---------- */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--border);
    padding: 0;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .tabs[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
  .tabs[data-count="5"] { grid-template-columns: repeat(5, 1fr); }
  .tab {
    appearance: none; border: none; background: transparent;
    padding: 0.7rem 0.5rem;
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 150ms var(--ease);
    border-bottom: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 44px;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] {
    color: var(--brand);
    border-bottom-color: var(--brand);
    background: var(--bg-elevated);
  }
  .tab__count {
    font-size: 10px; font-weight: 700;
    background: var(--bg-sunken);
    color: var(--text-subtle);
    padding: 1px 5px; border-radius: 4px;
    min-width: 16px; text-align: center;
  }
  .tab[aria-selected="true"] .tab__count {
    background: var(--brand-subtle); color: var(--brand);
  }

  /* ---------- Panels ---------- */
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  .panel__scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 0 var(--space-4) var(--space-6);
  }
  .panel__pad { padding: var(--space-4); }
  @media (min-width: 720px) { .panel__scroll { padding: 0 var(--space-6) var(--space-6); } }

  /* ---------- Chat ---------- */
  .msgs {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: var(--space-4);
    display: flex; flex-direction: column; gap: var(--space-3);
  }
  .date-divider {
    text-align: center; font-size: 11px; color: var(--text-subtle);
    padding: var(--space-2) 0; position: relative;
  }
  .date-divider span { background: var(--bg); padding: 0 12px; position: relative; z-index: 1; }
  .date-divider::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--border);
  }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
  .msg--mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg__avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; text-transform: uppercase;
  }
  .msg--mine .msg__avatar { background: var(--brand); color: var(--brand-fg); }
  .msg__bubble {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px 12px;
    font-size: 14px; line-height: 1.45;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .msg--mine .msg__bubble { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .msg__sender { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
  .msg__time { font-size: 10px; color: var(--text-subtle); margin-top: 3px; display: block; }
  .msg--mine .msg__time { color: color-mix(in srgb, var(--brand-fg) 70%, transparent); }

  .composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer__row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-height: 40px; max-height: 120px;
    padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; font-size: 14px; font-family: inherit;
    color: var(--text); line-height: 1.4; resize: none;
  }
  .composer textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent); }
  .composer button {
    appearance: none;
    background: var(--brand); color: var(--brand-fg);
    border: none; border-radius: 12px;
    padding: 0 16px; min-width: 60px; min-height: 40px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Work (assignments) ---------- */
  .work-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--space-4) 0 var(--space-3);
    gap: var(--space-3);
  }
  .work-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
  .work-head button {
    appearance: none;
    background: var(--brand); color: var(--brand-fg);
    border: none; border-radius: 10px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .work-head button:disabled { opacity: 0.5; }

  .asg {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 150ms var(--ease);
  }
  .asg:hover { border-color: var(--border-strong); }
  .asg__head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 8px;
  }
  .asg__title {
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.35;
    flex: 1; min-width: 0;
    overflow-wrap: anywhere;
  }
  .asg__status {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 8px;
    border-radius: var(--radius-full); flex-shrink: 0;
  }
  .asg__status--pending { background: #fef3c7; color: #92400e; }
  .asg__status--submitted { background: #dbeafe; color: #1e40af; }
  .asg__status--graded { background: #dcfce7; color: #166534; }
  .asg__status--overdue { background: #fee2e2; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .asg__status--pending { background: #451a03; color: #fcd34d; }
    .asg__status--submitted { background: #172554; color: #93c5fd; }
    .asg__status--graded { background: #052e16; color: #86efac; }
    .asg__status--overdue { background: #450a0a; color: #fca5a5; }
  }
  .asg__meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-muted);
  }
  .asg__meta strong { color: var(--text); font-weight: 600; }

  /* ---------- Members ---------- */
  .member {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 8px; border-radius: 12px;
  }
  .member:hover { background: var(--bg-sunken); }
  .member__avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
    text-transform: uppercase; overflow: hidden;
  }
  .member__avatar img { width: 100%; height: 100%; object-fit: cover; }
  .member__body { flex: 1; min-width: 0; }
  .member__name { font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .member__sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- About ---------- */
  .about-card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    margin-bottom: 12px;
  }
  .about-card h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); margin-bottom: 8px; }
  .about-card p { font-size: 14px; line-height: 1.55; color: var(--text); margin: 0; overflow-wrap: anywhere; }
  .about-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .about-row:last-child { border-bottom: none; padding-bottom: 0; }
  .about-row dt { color: var(--text-muted); }
  .about-row dd { color: var(--text); font-weight: 500; text-align: right; }

  /* ---------- States ---------- */
  .empty {
    padding: 48px 20px; text-align: center;
    color: var(--text-muted); font-size: 14px;
  }
  .empty svg { color: var(--border-strong); margin-bottom: 12px; }
  .empty h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
  .empty p { margin: 0; line-height: 1.5; }

  .state { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  /* ---------- Modal (sheet on mobile) ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 220ms var(--ease);
  }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elevated);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    width: 100%; max-width: 560px;
    max-height: 90vh; max-height: 90dvh;
    overflow-y: auto;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(0.2, 0, 0, 1);
  }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 16px; }
    .modal { border-radius: 16px; max-width: 520px; }
  }
  .modal__grab {
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--border-strong);
    margin: 0 auto 12px;
  }
  @media (min-width: 640px) { .modal__grab { display: none; } }
  .modal h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 6px; }
  .modal .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .modal .field { margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; color: var(--text);
    font-family: inherit; min-height: 46px;
    transition: border-color 150ms var(--ease);
  }
  .modal textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .modal input:focus, .modal textarea:focus, .modal select:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent);
  }
  .modal-alert {
    display: none; padding: 10px 12px;
    border-radius: 10px; font-size: 13px;
    margin-bottom: 12px; overflow-wrap: anywhere;
  }
  .modal-alert[data-show] { display: block; }
  .modal-alert--error {
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
  }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end;
  }
  @media (max-width: 480px) { .modal-actions { flex-direction: column-reverse; } }
  .btn-ghost {
    appearance: none; background: transparent;
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit; min-height: 42px; flex: 1;
  }
  .btn-primary {
    appearance: none; background: var(--brand); color: var(--brand-fg);
    border: none; padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; min-height: 42px; flex: 1;
  }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .sub-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; background: var(--bg-sunken);
    border-radius: 10px; margin-bottom: 8px; cursor: pointer;
  }
  .sub-item:hover { background: color-mix(in srgb, var(--brand) 6%, transparent); }
  .sub-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; text-transform: uppercase;
  }
  .sub-body { flex: 1; min-width: 0; }
  .sub-name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .sub-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .sub-score { font-size: 14px; font-weight: 700; color: var(--success); flex-shrink: 0; }
  .sub-score[data-ungraded] { color: var(--warning); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  .instructions {
    padding: 12px; background: var(--bg-sunken);
    border-radius: 10px; font-size: 14px;
    line-height: 1.55; white-space: pre-wrap;
    margin-bottom: 16px; overflow-wrap: anywhere;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all 200ms var(--ease);
    z-index: 80; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }

  /* Non-course communities get a 3-tab bar (no Work) */
  .panel[data-kind-hidden] { display: none; }
</style>
</head>
<body data-no-nav="1" data-no-notifications="1">

<header class="topbar">
  <a class="back" href="messages.html?tab=communities" aria-label="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <div class="head">
    <div class="head__name" id="g-name">Loading…</div>
    <div class="head__meta"><span class="live-dot off" id="live-dot"></span><span id="g-meta">Connecting…</span></div>
  </div>
</header>

<div class="tabs" id="tabs" role="tablist" data-count="4">
  <button class="tab" data-tab="chat" aria-selected="true">Chat</button>
  <button class="tab" data-tab="work" id="tab-work">Work <span class="tab__count" id="work-count"></span></button>
  <button class="tab" data-tab="members">Members</button>
  <button class="tab" data-tab="about">About</button>
</div>

<!-- CHAT -->
<section class="panel" id="panel-chat">
  <div class="msgs" id="msgs">
    <div class="state" id="state-loading">Loading messages…</div>
  </div>
  <form class="composer" id="composer">
    <div class="composer__row">
      <textarea id="input" rows="1" placeholder="Message…" maxlength="2000" autocomplete="off" disabled></textarea>
      <button id="btn-send" type="submit" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </form>
</section>

<!-- WORK (assignments) -->
<section class="panel" id="panel-work" hidden>
  <div class="panel__scroll">
    <div class="work-head">
      <h2 id="work-title">Assignments</h2>
      <button id="btn-new-asg" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
    </div>
    <div id="work-body">
      <div class="state">Loading…</div>
    </div>
  </div>
</section>

<!-- MEMBERS -->
<section class="panel" id="panel-members" hidden>
  <div class="panel__scroll">
    <div class="work-head"><h2>Members</h2></div>
    <div id="members-body"><div class="state">Loading…</div></div>
  </div>
</section>

<!-- ABOUT -->
<section class="panel" id="panel-about" hidden>
  <div class="panel__scroll">
    <div class="work-head"><h2>About</h2></div>
    <div id="about-body"><div class="state">Loading…</div></div>
  </div>
</section>

<!-- Modal -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal">
    <div class="modal__grab"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const communityId = params.get('id');
  if (!communityId) { location.replace('messages.html?tab=communities'); throw new Error('no id'); }

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauth'); }
  const meId = session.user.id;

  // ---------- State ----------
  let me = null;
  let roleNames = [];
  let community = null;
  let isCourse = false;
  let isMember = false;
  let isTeacherOfCourse = false;
  let canPostAssignment = false;
  let currentTab = 'chat';
  let channel = null;
  let assignments = [];
  let submissions = [];

  // ---------- Helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  const timeAgo = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const isOverdue = (d) => d && new Date(d) < new Date();
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }

  // ---------- Load profile + roles ----------
  const { data: prof } = await supabase.from('profiles')
    .select('id, full_name, role, institution_id, department_id')
    .eq('id', meId).single();
  me = prof || {};

  const { data: roleRows } = await supabase
    .from('user_role_assignments')
    .select('role_definitions(name)')
    .eq('user_id', meId).eq('status', 'active');
  roleNames = (roleRows || []).map(r => r.role_definitions?.name).filter(Boolean);

  // ---------- Load community ----------
  async function loadCommunity() {
    const { data, error } = await supabase
      .from('communities')
      .select('id, name, description, kind, membership_mode, course_id, department_id, session_id, created_at, community_members ( count )')
      .eq('id', communityId)
      .maybeSingle();
    if (error || !data) return { error };

    community = data;
    isCourse = data.kind === 'course';
    $('g-name').textContent = data.name;
    document.title = data.name + ' — Matric';

    const count = Array.isArray(data.community_members) && data.community_members[0]
      ? data.community_members[0].count : 0;
    $('g-meta').textContent = `${count} member${count === 1 ? '' : 's'}`;

    // Membership?
    const { data: mem } = await supabase
      .from('community_members')
      .select('community_id')
      .eq('community_id', communityId)
      .eq('user_id', meId)
      .maybeSingle();
    isMember = !!mem;

    // If course: is teacher?
    if (isCourse && data.course_id) {
      const { data: ca } = await supabase
        .from('course_assignments')
        .select('course_id')
        .eq('course_id', data.course_id)
        .eq('lecturer_id', meId)
        .maybeSingle();
      isTeacherOfCourse = !!ca;
    }

    canPostAssignment = isCourse && (isTeacherOfCourse
      || roleNames.includes('HOD')
      || roleNames.includes('FACULTY_ADMIN')
      || roleNames.includes('UNIVERSITY_ADMIN'));

    // Tabs: courses get Work; non-courses get 3 tabs
    if (!isCourse) {
      $('tabs').setAttribute('data-count', '3');
      $('tab-work').hidden = true;
    } else {
      $('tabs').setAttribute('data-count', '4');
      $('tab-work').hidden = false;
      if (canPostAssignment) $('btn-new-asg').hidden = false;
    }

    return { data };
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });
  function switchTab(name) {
    if (name === 'work' && !isCourse) return;
    currentTab = name;
    document.querySelectorAll('.tab').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.tab === name))
    );
    ['chat','work','members','about'].forEach(k => {
      const el = $(`panel-${k}`);
      if (el) el.hidden = k !== name;
    });
    if (name === 'work')    loadWork();
    if (name === 'members') loadMembers();
    if (name === 'about')   loadAbout();
  }

  // ============================================================
  // CHAT
  // ============================================================
  const msgsEl = $('msgs');
  const composer = $('composer');
  const input = $('input');
  const sendBtn = $('btn-send');

  const profilesCache = new Map();
  async function getProfile(userId) {
    if (profilesCache.has(userId)) return profilesCache.get(userId);
    const { data } = await supabase.from('profiles').select('id, full_name, email, avatar_url').eq('id', userId).maybeSingle();
    const val = data || { id: userId, full_name: 'Unknown', email: '' };
    profilesCache.set(userId, val);
    return val;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtTime(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
  function dateKey(iso) { return new Date(iso).toDateString(); }
  function dateLabel(key) {
    const d = new Date(key), now = new Date();
    const day = 1000 * 60 * 60 * 24;
    const diff = Math.floor((now.setHours(0,0,0,0) - d.setHours(0,0,0,0)) / day);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  }

  async function makeMessageNode(m) {
    const isMine = m.sender_id === meId;
    const p = await getProfile(m.sender_id);
    const ini = initials(p.full_name || p.email);

    const wrap = el('div', 'msg' + (isMine ? ' msg--mine' : ''));
    wrap.dataset.id = m.id;

    const av = el('div', 'msg__avatar', ini);
    const bubble = el('div', 'msg__bubble');
    if (!isMine) bubble.appendChild(el('div', 'msg__sender', p.full_name || p.email || 'Unknown'));
    bubble.appendChild(document.createTextNode(m.body));
    bubble.appendChild(el('span', 'msg__time', fmtTime(m.created_at)));

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    return wrap;
  }

  function scrollToBottom(smooth = true) {
    requestAnimationFrame(() => {
      msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    });
  }

  async function loadMessages() {
    const { data, error } = await supabase
      .from('community_messages')
      .select('id, sender_id, body, created_at')
      .eq('community_id', communityId)
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) {
      msgsEl.innerHTML = '';
      msgsEl.appendChild(el('div', 'state state--error', 'Could not load messages: ' + error.message));
      return;
    }

    msgsEl.innerHTML = '';
    if (!data || !data.length) {
      const empty = el('div', 'empty');
      empty.appendChild(el('h3', null, 'No messages yet'));
      empty.appendChild(el('p', null, 'Say hello, or share what the group is working on.'));
      msgsEl.appendChild(empty);
      return;
    }

    let lastKey = null;
    for (const m of data) {
      const k = dateKey(m.created_at);
      if (k !== lastKey) {
        const d = el('div', 'date-divider');
        d.appendChild(el('span', null, dateLabel(k)));
        msgsEl.appendChild(d);
        lastKey = k;
      }
      msgsEl.appendChild(await makeMessageNode(m));
    }
    scrollToBottom(false);
  }

  function subscribeChat() {
    channel = supabase
      .channel('community:' + communityId)
      .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'community_messages', filter: `community_id=eq.${communityId}` },
          async (payload) => {
            const m = payload.new;
            if (msgsEl.querySelector(`[data-id="${m.id}"]`)) return;
            msgsEl.querySelector('.empty')?.remove();
            const k = dateKey(m.created_at);
            const lastDiv = msgsEl.querySelector('.date-divider:last-of-type');
            if (lastDiv?.dataset.key !== k) {
              const d = el('div', 'date-divider');
              d.dataset.key = k;
              d.appendChild(el('span', null, dateLabel(k)));
              msgsEl.appendChild(d);
            }
            msgsEl.appendChild(await makeMessageNode(m));
            scrollToBottom();
          })
      .subscribe((status) => {
        const dot = $('live-dot');
        if (status === 'SUBSCRIBED') dot.classList.remove('off');
        else if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)) dot.classList.add('off');
      });
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 768px)').matches) {
      e.preventDefault(); composer.requestSubmit();
    }
  });

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;
    input.value = ''; input.style.height = 'auto';
    sendBtn.disabled = true;
    const { data, error } = await supabase
      .from('community_messages')
      .insert({ community_id: communityId, sender_id: meId, body })
      .select('id, sender_id, body, created_at').single();
    sendBtn.disabled = false;
    if (error) { input.value = body; toast(error.message, 'error'); return; }
    msgsEl.querySelector('.empty')?.remove();
    msgsEl.appendChild(await makeMessageNode(data));
    scrollToBottom();
  });

  if (isMember || community?.membership_mode === 'open') {
    input.disabled = false; sendBtn.disabled = false;
  } else {
    input.disabled = true; sendBtn.disabled = true;
    input.placeholder = 'Join this community to post';
  }

  // ============================================================
  // WORK (assignments)
  // ============================================================
  async function loadWork() {
    if (!isCourse) return;
    const body = $('work-body');
    body.innerHTML = '<div class="state">Loading…</div>';

    const { data: asgs, error } = await supabase
      .from('assignments')
      .select('id, title, instructions, due_at, max_score, status, created_at, created_by, course_id, session_id')
      .eq('course_id', community.course_id)
      .order('created_at', { ascending: false });

    if (error) { body.innerHTML = `<div class="state state--error">${esc(error.message)}</div>`; return; }
    assignments = asgs || [];

    // Load submissions
    if (assignments.length) {
      const ids = assignments.map(a => a.id);
      if (isTeacherOfCourse || canPostAssignment) {
        const { data: subs } = await supabase
          .from('assignment_submissions')
          .select(`id, assignment_id, status, submitted_at, score, feedback, body, file_name, profiles:student_id ( id, full_name, avatar_url )`)
          .in('assignment_id', ids);
        submissions = subs || [];
      } else {
        const { data: subs } = await supabase
          .from('assignment_submissions')
          .select('id, assignment_id, status, submitted_at, score, feedback, body, file_name')
          .in('assignment_id', ids)
          .eq('student_id', meId);
        submissions = subs || [];
      }
    }

    // Badge count on the Work tab
    const pendingCount = isTeacherOfCourse || canPostAssignment
      ? submissions.filter(s => s.status !== 'graded').length
      : assignments.filter(a => !submissions.find(s => s.assignment_id === a.id) && !isOverdue(a.due_at)).length;
    const badge = $('work-count');
    if (pendingCount > 0) { badge.textContent = pendingCount; }
    else badge.textContent = '';

    renderWork();
  }

  function statusFor(a) {
    if (isTeacherOfCourse || canPostAssignment) {
      const subs = submissions.filter(s => s.assignment_id === a.id);
      const ungraded = subs.filter(s => s.status !== 'graded').length;
      return {
        key: ungraded > 0 ? 'submitted' : 'graded',
        label: ungraded > 0
          ? `${ungraded} to grade`
          : (subs.length ? `${subs.length} graded` : 'No submissions'),
      };
    }
    const sub = submissions.find(s => s.assignment_id === a.id);
    if (sub?.status === 'graded') return { key: 'graded', label: `Graded · ${sub.score ?? '—'}/${a.max_score || '?'}` };
    if (sub) return { key: 'submitted', label: 'Submitted' };
    if (isOverdue(a.due_at)) return { key: 'overdue', label: 'Overdue' };
    return { key: 'pending', label: 'Not submitted' };
  }

  function renderWork() {
    const body = $('work-body');
    if (!assignments.length) {
      body.innerHTML = `<div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <h3>${canPostAssignment ? 'No assignments yet' : 'Nothing here'}</h3>
        <p>${canPostAssignment ? 'Create the first assignment for this course.' : 'Assignments will appear here.'}</p>
      </div>`;
      return;
    }
    body.innerHTML = assignments.map(a => {
      const st = statusFor(a);
      return `
        <div class="asg" data-id="${esc(a.id)}">
          <div class="asg__head">
            <div class="asg__title">${esc(a.title)}</div>
            <span class="asg__status asg__status--${st.key}">${esc(st.label)}</span>
          </div>
          <div class="asg__meta">
            ${a.due_at ? `<span><strong>Due</strong> ${esc(fmtDate(a.due_at))}</span>` : ''}
            ${a.max_score ? `<span><strong>Max</strong> ${a.max_score}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.asg').forEach(el => {
      el.addEventListener('click', () => openAssignment(el.dataset.id));
    });
  }

  // ---------- Assignment detail ----------
  function openAssignment(id) {
    const a = assignments.find(x => x.id === id);
    if (!a) return;
    if (isTeacherOfCourse || canPostAssignment) openTeacherView(a);
    else openStudentView(a);
  }

  function openModal(html) {
    $('modal-body').innerHTML = html;
    $('modal').setAttribute('data-open', '1');
    $('modal').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    $('modal').removeAttribute('data-open');
    $('modal').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal(); });

  function openStudentView(a) {
    const sub = submissions.find(s => s.assignment_id === a.id);
    const st = statusFor(a);
    const canSubmit = !sub && !isOverdue(a.due_at);

    let html = `
      <h2>${esc(a.title)}</h2>
      <p class="sub">${esc(community.name)}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px;font-size:13px;">
        <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Due</div><div style="margin-top:2px;font-weight:500;">${esc(fmtDate(a.due_at))}</div></div>
        <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Max score</div><div style="margin-top:2px;font-weight:500;">${a.max_score ?? '—'}</div></div>
        <div style="grid-column:1/-1;"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Status</div><div style="margin-top:2px;font-weight:500;">${esc(st.label)}</div></div>
      </div>
      ${a.instructions ? `<div class="instructions">${esc(a.instructions)}</div>` : ''}`;

    if (sub) {
      html += `
        <div style="padding:12px;background:var(--bg-sunken);border-radius:10px;margin-bottom:16px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:8px;">Your submission</div>
          ${sub.body ? `<div style="font-size:14px;line-height:1.5;margin-bottom:6px;white-space:pre-wrap;">${esc(sub.body)}</div>` : ''}
          ${sub.file_name ? `<div style="font-size:12px;color:var(--text-subtle);">📎 ${esc(sub.file_name)}</div>` : ''}
          <div style="font-size:12px;color:var(--text-subtle);margin-top:6px;">Submitted ${esc(timeAgo(sub.submitted_at))}</div>
          ${sub.score != null ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><span style="color:var(--text-muted);font-size:13px;">Grade:</span> <strong style="font-size:17px;color:var(--success);">${sub.score}/${a.max_score || '?'}</strong>${sub.feedback ? `<div style="font-size:14px;color:var(--text-muted);margin-top:6px;font-style:italic;">"${esc(sub.feedback)}"</div>` : ''}</div>` : ''}
        </div>
        <div class="modal-actions"><button class="btn-ghost" id="md-close" style="flex:1;">Close</button></div>`;
    } else if (canSubmit) {
      html += `
        <form id="md-submit-form">
          <div class="field"><label for="md-body">Your answer (optional if attaching a file)</label><textarea id="md-body" maxlength="5000" placeholder="Write your answer…"></textarea></div>
          <div class="field"><label for="md-file">Attachment (optional, up to 20 MB)</label><input type="file" id="md-file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.txt,.jpg,.jpeg,.png"></div>
          <div class="modal-alert modal-alert--error" id="md-alert"></div>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="md-close">Cancel</button>
            <button type="submit" class="btn-primary" id="md-submit">Submit</button>
          </div>
        </form>`;
    } else {
      html += `<div class="modal-actions"><button class="btn-ghost" id="md-close" style="flex:1;">Close</button></div>`;
    }

    openModal(html);
    document.getElementById('md-close')?.addEventListener('click', closeModal);

    const form = document.getElementById('md-submit-form');
    if (form) form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('md-submit');
      const alertEl = document.getElementById('md-alert');
      alertEl.removeAttribute('data-show');
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        const text = document.getElementById('md-body').value.trim();
        const file = document.getElementById('md-file').files[0];
        if (!text && !file) throw new Error('Write or attach something.');
        let filePath = null, fileName = null, fileSize = null;
        if (file) {
          if (file.size > 20 * 1024 * 1024) throw new Error('File exceeds 20 MB.');
          const ext = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
          const rand = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
          const path = `${meId}/${a.id}/${rand}${ext}`;
          const { error: upErr } = await supabase.storage.from('assignments').upload(path, file, { contentType: file.type });
          if (upErr) throw upErr;
          filePath = path; fileName = file.name; fileSize = file.size;
        }
        const { error } = await supabase.from('assignment_submissions').insert({
          assignment_id: a.id, student_id: meId, body: text || null,
          file_path: filePath, file_name: fileName, file_size: fileSize,
        });
        if (error) throw error;
        toast('Submitted.');
        closeModal();
        await loadWork();
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Submit';
        alertEl.textContent = err.message || 'Something went wrong.';
        alertEl.setAttribute('data-show', '1');
      }
    });
  }

  function openTeacherView(a) {
    const subs = submissions.filter(s => s.assignment_id === a.id);
    const ungraded = subs.filter(s => s.status !== 'graded').length;

    let html = `
      <h2>${esc(a.title)}</h2>
      <p class="sub">${esc(community.name)}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px;font-size:13px;">
        <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Due</div><div style="margin-top:2px;font-weight:500;">${esc(fmtDate(a.due_at))}</div></div>
        <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Submissions</div><div style="margin-top:2px;font-weight:500;">${subs.length}${ungraded ? ` (${ungraded} to grade)` : ''}</div></div>
      </div>
      ${a.instructions ? `<div class="instructions">${esc(a.instructions)}</div>` : ''}
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:8px;">Submissions</div>
      ${subs.length === 0
        ? '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">No submissions yet.</div>'
        : subs.map(s => `
          <div class="sub-item" data-sub-id="${esc(s.id)}">
            <div class="sub-avatar">${esc(initials(s.profiles?.full_name))}</div>
            <div class="sub-body">
              <div class="sub-name">${esc(s.profiles?.full_name || 'Student')}</div>
              <div class="sub-meta">${esc(timeAgo(s.submitted_at))}${s.file_name ? ' · 📎 ' + esc(s.file_name) : ''}</div>
            </div>
            ${s.status === 'graded' ? `<span class="sub-score">${s.score ?? '—'}/${a.max_score || '?'}</span>` : `<span class="sub-score" data-ungraded>Grade</span>`}
          </div>`).join('')}
      <div class="modal-actions"><button class="btn-ghost" id="md-close" style="flex:1;">Close</button></div>`;

    openModal(html);
    document.getElementById('md-close')?.addEventListener('click', closeModal);
    document.querySelectorAll('.sub-item').forEach(el => {
      el.addEventListener('click', () => {
        const s = subs.find(x => x.id === el.dataset.subId);
        if (s) openGradeView(a, s);
      });
    });
  }

  function openGradeView(a, s) {
    const html = `
      <h2>${esc(s.profiles?.full_name || 'Student')}</h2>
      <p class="sub">${esc(a.title)} · submitted ${esc(timeAgo(s.submitted_at))}</p>
      ${s.body ? `<div class="instructions">${esc(s.body)}</div>` : ''}
      ${s.file_name ? `<div style="font-size:14px;color:var(--text-muted);margin-bottom:12px;">📎 ${esc(s.file_name)}</div>` : ''}
      <form id="md-grade-form">
        <div class="field"><label for="md-score">Score (out of ${a.max_score ?? '—'})</label><input type="number" id="md-score" min="0" max="${a.max_score || 100}" value="${s.score ?? ''}" required></div>
        <div class="field"><label for="md-feedback">Feedback (optional)</label><textarea id="md-feedback" maxlength="2000">${esc(s.feedback || '')}</textarea></div>
        <div class="modal-alert modal-alert--error" id="md-alert"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="md-back">Back</button>
          <button type="submit" class="btn-primary" id="md-save">Save grade</button>
        </div>
      </form>`;
    openModal(html);
    document.getElementById('md-back')?.addEventListener('click', () => openTeacherView(a));
    document.getElementById('md-grade-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('md-save');
      const alertEl = document.getElementById('md-alert');
      alertEl.removeAttribute('data-show');
      const score = parseInt(document.getElementById('md-score').value, 10);
      const feedback = document.getElementById('md-feedback').value.trim() || null;
      if (Number.isNaN(score)) { alertEl.textContent = 'Score required.'; alertEl.setAttribute('data-show', '1'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await supabase.from('assignment_submissions')
        .update({ score, feedback, status: 'graded', graded_at: new Date().toISOString(), graded_by: meId })
        .eq('id', s.id);
      btn.disabled = false; btn.textContent = 'Save grade';
      if (error) { alertEl.textContent = error.message; alertEl.setAttribute('data-show', '1'); return; }
      toast('Grade saved.');
      await loadWork();
      const a2 = assignments.find(x => x.id === a.id);
      if (a2) openTeacherView(a2);
    });
  }

  // ---------- New assignment ----------
  $('btn-new-asg').addEventListener('click', () => {
    const html = `
      <h2>New assignment</h2>
      <p class="sub">Students enrolled in ${esc(community.name)} will see it in Work.</p>
      <form id="md-new-form">
        <div class="field"><label for="md-title">Title</label><input type="text" id="md-title" required maxlength="200" placeholder="e.g. Assignment 2 — Trees"></div>
        <div class="field"><label for="md-instructions">Instructions (optional)</label><textarea id="md-instructions" maxlength="5000"></textarea></div>
        <div class="field"><label for="md-due">Due date</label><input type="datetime-local" id="md-due"></div>
        <div class="field"><label for="md-max">Max score (optional)</label><input type="number" id="md-max" min="1" max="1000" placeholder="100"></div>
        <div class="modal-alert modal-alert--error" id="md-alert"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="md-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="md-create">Publish</button>
        </div>
      </form>`;
    openModal(html);
    document.getElementById('md-cancel').addEventListener('click', closeModal);
    document.getElementById('md-new-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('md-create');
      const alertEl = document.getElementById('md-alert');
      alertEl.removeAttribute('data-show');
      const title = document.getElementById('md-title').value.trim();
      const instructions = document.getElementById('md-instructions').value.trim() || null;
      const dueLocal = document.getElementById('md-due').value;
      const dueAt = dueLocal ? new Date(dueLocal).toISOString() : null;
      const maxScore = parseInt(document.getElementById('md-max').value, 10) || null;
      if (!title) { alertEl.textContent = 'Title required.'; alertEl.setAttribute('data-show', '1'); return; }
      btn.disabled = true; btn.textContent = 'Publishing…';
      const { error } = await supabase.from('assignments').insert({
        institution_id: me.institution_id,
        course_id: community.course_id,
        session_id: community.session_id,
        created_by: meId,
        title, instructions, due_at: dueAt, max_score: maxScore,
        status: 'published',
      });
      btn.disabled = false; btn.textContent = 'Publish';
      if (error) { alertEl.textContent = error.message; alertEl.setAttribute('data-show', '1'); return; }
      toast('Assignment published.');
      closeModal();
      await loadWork();
    });
  });

  // ============================================================
  // MEMBERS
  // ============================================================
  async function loadMembers() {
    const body = $('members-body');
    const { data, error } = await supabase
      .from('community_members')
      .select('user_id, role, joined_at, profiles:user_id ( full_name, email, avatar_url, role, status )')
      .eq('community_id', communityId)
      .order('joined_at');
    if (error) { body.innerHTML = `<div class="state state--error">${esc(error.message)}</div>`; return; }
    if (!data || !data.length) { body.innerHTML = '<div class="empty"><h3>No members yet</h3></div>'; return; }

    body.innerHTML = data.map(m => {
      const p = m.profiles || {};
      const name = p.full_name || p.email || 'Unknown';
      const roleLabel = m.role === 'moderator' ? 'Moderator' : (p.role || 'Member');
      return `
        <div class="member">
          <div class="member__avatar">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(initials(name))}</div>
          <div class="member__body">
            <div class="member__name">${esc(name)}</div>
            <div class="member__sub">${esc(roleLabel)}${p.email ? ' · ' + esc(p.email) : ''}</div>
          </div>
        </div>`;
    }).join('');
  }

  // ============================================================
  // ABOUT
  // ============================================================
  async function loadAbout() {
    const body = $('about-body');
    const kindLabel = community.kind === 'course' ? 'Course channel'
      : community.kind === 'department' ? 'Department community'
      : community.kind === 'faculty' ? 'Faculty community'
      : community.kind === 'institution' ? 'Institution community'
      : community.kind === 'level' ? 'Level community'
      : community.kind === 'programme' ? 'Programme community'
      : 'Interest community';

    const isOwner = isMember && community.membership_mode === 'open';
    body.innerHTML = `
      ${community.description ? `<div class="about-card"><h3>Description</h3><p>${esc(community.description)}</p></div>` : ''}
      <div class="about-card">
        <dl>
          <div class="about-row"><dt>Type</dt><dd>${esc(kindLabel)}</dd></div>
          <div class="about-row"><dt>Membership</dt><dd>${community.membership_mode === 'auto' ? 'Automatic' : 'Open'}</dd></div>
          <div class="about-row"><dt>Created</dt><dd>${esc(new Date(community.created_at).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }))}</dd></div>
        </dl>
      </div>
      ${isOwner ? `<button class="btn-ghost" id="btn-leave" style="width:100%;padding:14px;border-color:color-mix(in srgb, var(--danger) 30%, transparent);color:var(--danger);">Leave community</button>` : ''}
    `;

    if (isOwner) {
      document.getElementById('btn-leave').addEventListener('click', async () => {
        if (!confirm('Leave this community?')) return;
        const { error } = await supabase
          .from('community_members')
          .delete()
          .eq('community_id', communityId)
          .eq('user_id', meId);
        if (error) { toast(error.message, 'error'); return; }
        toast('Left.');
        location.href = 'messages.html?tab=communities';
      });
    }
  }

  // ============================================================
  // BOOT
  // ============================================================
  const res = await loadCommunity();
  if (res.error) {
    $('g-name').textContent = 'Community';
    $('g-meta').textContent = res.error.message;
    $('msgs').innerHTML = `<div class="state state--error">${esc(res.error.message || 'Could not load')}</div>`;
  } else {
    await loadMessages();
    subscribeChat();
  }

  window.addEventListener('beforeunload', () => {
    if (channel) supabase.removeChannel(channel);
  });
</script>

</body>
</html>
