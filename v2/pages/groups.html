<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Communities — Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .btn-primary {
    appearance: none; background: var(--brand); color: var(--brand-fg);
    border: none; padding: 0.5rem 0.9rem;
    border-radius: var(--radius-md); font-size: var(--text-sm);
    font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-5) var(--space-6) var(--space-10); } }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    margin-bottom: var(--space-4);
  }
  .tab {
    appearance: none; border: none; background: transparent;
    padding: 0.55rem 0.25rem;
    font-size: var(--text-sm); font-weight: 500;
    color: var(--text-muted);
    border-radius: calc(var(--radius-md) - 3px);
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 40px; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--bg-elevated); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .tab__count {
    font-size: 0.625rem; font-weight: 700;
    background: var(--bg-sunken); color: var(--text-subtle);
    padding: 1px 5px; border-radius: var(--radius-sm);
    min-width: 16px; text-align: center;
  }
  .tab[aria-selected="true"] .tab__count { background: var(--brand-subtle); color: var(--brand); }

  .panel[hidden] { display: none; }

  .search {
    width: 100%; padding: 0.7rem 0.9rem;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); margin-bottom: var(--space-4);
    min-height: 44px;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }

  .list { display: flex; flex-direction: column; gap: 2px; }

  .row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    text-decoration: none; color: var(--text);
    transition: background var(--duration-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
    border: none; background: transparent;
    width: 100%; text-align: left;
    font-family: inherit; font-size: inherit;
  }
  .row:hover { background: var(--bg-sunken); }
  .row[data-clickable] { cursor: pointer; }

  .badge-icon {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-sm); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
    overflow: hidden;
  }
  .badge-icon--inst { background: #e0e7ff; color: #3730a3; }
  .badge-icon--fac  { background: #dbeafe; color: #1e40af; }
  .badge-icon--dept { background: #dcfce7; color: #166534; }
  .badge-icon--prog { background: #fef3c7; color: #92400e; }
  .badge-icon--lvl  { background: #fee2e2; color: #991b1b; }
  .badge-icon--cour { background: #ede9fe; color: #5b21b6; }
  .badge-icon--int  { background: var(--bg-sunken); color: var(--text-muted); }
  @media (prefers-color-scheme: dark) {
    .badge-icon--inst { background: #1e1b4b; color: #a5b4fc; }
    .badge-icon--fac  { background: #172554; color: #93c5fd; }
    .badge-icon--dept { background: #052e16; color: #86efac; }
    .badge-icon--prog { background: #451a03; color: #fcd34d; }
    .badge-icon--lvl  { background: #450a0a; color: #fca5a5; }
    .badge-icon--cour { background: #2e1065; color: #c4b5fd; }
  }

  .row__body { flex: 1; min-width: 0; }
  .row__name {
    font-size: var(--text-sm); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row__sub {
    font-size: var(--text-xs); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }
  .row__action { flex-shrink: 0; display: flex; gap: 6px; align-items: center; }

  .btn-mini {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 0.35rem 0.7rem;
    border-radius: var(--radius-md);
    font-size: var(--text-xs); font-weight: 500;
    cursor: pointer; min-height: 32px;
    transition: all var(--duration-fast) var(--ease);
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .btn-mini:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .btn-mini:disabled { opacity: 0.5; cursor: wait; }
  .btn-mini--primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .btn-mini--primary:hover:not(:disabled) { background: var(--brand-hover); color: var(--brand-fg); }
  .btn-mini--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
  .btn-mini--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 10%, transparent); }

  .empty {
    padding: var(--space-8) var(--space-4); text-align: center;
    color: var(--text-muted); font-size: var(--text-sm);
    line-height: var(--leading-snug);
  }
  .empty svg { color: var(--border-strong); margin-bottom: var(--space-3); }
  .empty h3 { font-size: var(--text-base); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-lg); width: 100%; max-width: 500px;
    max-height: 90vh; max-height: 90dvh; overflow-y: auto;
    padding: var(--space-5);
    transform: translateY(12px); transition: transform var(--duration) var(--ease);
  }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }
  .modal h2 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; margin-bottom: var(--space-2); }
  .modal .sub { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-5); }
  .modal .field { margin-bottom: var(--space-3); }
  .modal label { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text); margin-bottom: var(--space-2); }
  .modal input, .modal textarea {
    width: 100%; padding: 0.7rem 0.85rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); font-family: inherit;
    transition: all var(--duration-fast) var(--ease);
  }
  .modal textarea { min-height: 80px; resize: vertical; line-height: var(--leading-base); }
  .modal input:focus, .modal textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .modal-alert { display: none; padding: 0.7rem 0.9rem; border-radius: var(--radius-md); font-size: var(--text-sm); margin-bottom: var(--space-4); line-height: var(--leading-snug); overflow-wrap: anywhere; }
  .modal-alert[data-show] { display: block; }
  .modal-alert--error { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); }
  .modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); justify-content: flex-end; }
  @media (max-width: 480px) { .modal-actions { flex-direction: column-reverse; } }
  .btn-ghost {
    appearance: none; background: transparent;
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease); min-height: 40px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  .toast {
    position: fixed; bottom: 84px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all var(--duration) var(--ease);
    z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="../../manifest-v2.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="application-name" content="Matric">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matric">
  <script src="../../v2/js/pwa.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Communities</div>
  <div class="topbar__right">
    <button class="btn-primary" id="btn-create">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </div>
</header>

<main class="wrap">

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="academic">
      Academic <span class="tab__count" id="count-academic">0</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="courses">
      Courses <span class="tab__count" id="count-courses">0</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="interest">
      Interest <span class="tab__count" id="count-interest">0</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="discover">
      Discover <span class="tab__count" id="count-discover">0</span>
    </button>
  </div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>

  <section class="panel" id="panel-academic" hidden>
    <div id="body-academic"></div>
  </section>

  <section class="panel" id="panel-courses" hidden>
    <input type="search" class="search" id="search-courses" placeholder="Search course channels…" autocomplete="off">
    <div id="body-courses"></div>
  </section>

  <section class="panel" id="panel-interest" hidden>
    <input type="search" class="search" id="search-interest" placeholder="Search your interest communities…" autocomplete="off">
    <div id="body-interest"></div>
  </section>

  <section class="panel" id="panel-discover" hidden>
    <input type="search" class="search" id="search-discover" placeholder="Search communities…" autocomplete="off">
    <div id="body-discover"></div>
  </section>

</main>

<!-- Create modal -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Create a community</h2>
    <p class="sub">Interest communities are visible to everyone at your institution.</p>
    <div class="modal-alert modal-alert--error" id="modal-alert"></div>
    <form id="form-create">
      <div class="field">
        <label for="c-name">Name</label>
        <input type="text" id="c-name" required maxlength="80" placeholder="e.g. AI Study Group">
      </div>
      <div class="field">
        <label for="c-desc">Description <span style="color:var(--text-subtle);font-weight:400;">(optional)</span></label>
        <textarea id="c-desc" maxlength="400" placeholder="What is this community for?"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="btn-submit">Create</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let meId = null;
  let myProfile = null;
  let currentTab = 'academic';

  const state = {
    all: [],         // all communities in my institution
    mine: new Set(), // community ids I'm a member of
  };

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  meId = session.user.id;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
  const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }
  function showError(msg) {
    $('state-loading').hidden = true;
    $('state-error').hidden = false;
    $('state-error').textContent = msg;
  }

  // ---- Load profile ----
  const { data: prof } = await supabase
    .from('profiles')
    .select('id, role')
    .eq('id', meId)
    .single();
  myProfile = prof || { role: 'student' };

  // ---- Load all communities + my memberships ----
  async function loadAll() {
    const { data: comms, error: cErr } = await supabase
      .from('communities')
      .select(`
        id, name, description, kind, membership_mode, created_at,
        community_members ( count )
      `)
      .order('name');

    if (cErr) { showError('Could not load communities: ' + cErr.message); return false; }

    state.all = (comms || []).map(c => ({
      ...c,
      member_count: Array.isArray(c.community_members) && c.community_members[0]
        ? c.community_members[0].count
        : 0,
    }));

    const { data: mine, error: mErr } = await supabase
      .from('community_members')
      .select('community_id')
      .eq('user_id', meId);

    if (mErr) { showError('Could not load memberships: ' + mErr.message); return false; }
    state.mine = new Set((mine || []).map(r => r.community_id));
    return true;
  }

  // ---- Kind → display label + icon class ----
  function kindMeta(kind) {
    switch (kind) {
      case 'institution': return { label: 'Institution', cls: 'inst', icon: 'building' };
      case 'faculty':     return { label: 'Faculty',     cls: 'fac',  icon: 'layers' };
      case 'department':  return { label: 'Department',  cls: 'dept', icon: 'building2' };
      case 'programme':   return { label: 'Programme',   cls: 'prog', icon: 'book' };
      case 'level':       return { label: 'Level',       cls: 'lvl',  icon: 'calendar' };
      case 'course':      return { label: 'Course',      cls: 'cour', icon: 'book-open' };
      default:            return { label: 'Interest',    cls: 'int',  icon: 'users' };
    }
  }

  function kindIconSvg(kind, size = 20) {
    const base = (p) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    switch (kind) {
      case 'institution': return base('<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>');
      case 'faculty':     return base('<path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>');
      case 'department':  return base('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>');
      case 'programme':   return base('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>');
      case 'level':       return base('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>');
      case 'course':      return base('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>');
      default:            return base('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');
    }
  }

  function rowForCommunity(c, opts = {}) {
    const meta = kindMeta(c.kind);
    const isMine = state.mine.has(c.id);
    const memberLabel = c.member_count === 1 ? '1 member' : `${c.member_count} members`;
    const canLeave = c.membership_mode === 'open' && isMine;
    const canJoin  = c.membership_mode === 'open' && !isMine;

    let action = '';
    if (canJoin) {
      action = `<button class="btn-mini btn-mini--primary" data-action="join" data-id="${c.id}" type="button">Join</button>`;
    } else if (canLeave) {
      action = `<button class="btn-mini btn-mini--danger" data-action="leave" data-id="${c.id}" type="button">Leave</button>`;
    } else if (isMine) {
      action = `<span class="btn-mini" style="color:var(--text-subtle);cursor:default;">Member</span>`;
    }

    const clickable = isMine ? ' data-clickable data-id="' + c.id + '"' : '';
    const sub = c.description
      ? esc(c.description) + ' · ' + memberLabel
      : meta.label + ' · ' + memberLabel;

    return `
      <button class="row" type="button"${clickable}>
        <div class="badge-icon badge-icon--${meta.cls}">${kindIconSvg(c.kind)}</div>
        <div class="row__body">
          <div class="row__name">${esc(c.name)}</div>
          <div class="row__sub">${sub}</div>
        </div>
        <div class="row__action">${action}</div>
      </button>
    `;
  }

  function renderList(container, items, emptyHtml) {
    if (items.length === 0) {
      container.innerHTML = emptyHtml;
      return;
    }
    container.innerHTML = '<div class="list">' + items.map(c => rowForCommunity(c)).join('') + '</div>';
  }

  // ---- Tab renderers ----
  function renderAcademic() {
    const kinds = ['institution','faculty','department','programme','level'];
    const items = state.all.filter(c => kinds.includes(c.kind) && state.mine.has(c.id));
    $('count-academic').textContent = items.length;
    renderList($('body-academic'), items, `
      <div class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <h3>No academic communities yet</h3>
        <p>Complete your enrollment to be connected to your institution, faculty, department, programme, and level.</p>
      </div>`);
  }

  function renderCourses() {
    const q = ($('search-courses').value || '').trim().toLowerCase();
    let items = state.all.filter(c => c.kind === 'course' && state.mine.has(c.id));
    if (q) items = items.filter(c => (c.name || '').toLowerCase().includes(q));
    $('count-courses').textContent = state.all.filter(c => c.kind === 'course' && state.mine.has(c.id)).length;
    renderList($('body-courses'), items, `
      <div class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <h3>No course channels yet</h3>
        <p>Channels appear automatically when you're enrolled in courses.</p>
      </div>`);
  }

  function renderInterest() {
    const q = ($('search-interest').value || '').trim().toLowerCase();
    let items = state.all.filter(c => c.kind === 'interest' && state.mine.has(c.id));
    if (q) items = items.filter(c => (c.name || '').toLowerCase().includes(q));
    $('count-interest').textContent = state.all.filter(c => c.kind === 'interest' && state.mine.has(c.id)).length;
    renderList($('body-interest'), items, `
      <div class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <h3>No interest communities yet</h3>
        <p>Browse the Discover tab to find groups to join.</p>
      </div>`);
  }

  function renderDiscover() {
    const q = ($('search-discover').value || '').trim().toLowerCase();
    let items = state.all.filter(c => c.kind === 'interest' && !state.mine.has(c.id));
    if (q) items = items.filter(c => (c.name || '').toLowerCase().includes(q));
    $('count-discover').textContent = state.all.filter(c => c.kind === 'interest' && !state.mine.has(c.id)).length;
    renderList($('body-discover'), items, `
      <div class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <h3>You're in everything</h3>
        <p>No new communities to discover right now.</p>
      </div>`);
  }

  function renderAll() {
    renderAcademic();
    renderCourses();
    renderInterest();
    renderDiscover();
  }

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.tab === name))
    );
    ['academic','courses','interest','discover'].forEach(k => {
      const el = $(`panel-${k}`);
      if (el) el.hidden = k !== name;
    });
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  ['courses','interest','discover'].forEach(k => {
    $(`search-${k}`).addEventListener('input', () => {
      if (k === 'courses')  renderCourses();
      if (k === 'interest') renderInterest();
      if (k === 'discover') renderDiscover();
    });
  });

  // ---- Join / Leave / Open (delegated) ----
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      btn.disabled = true;

      try {
        if (action === 'join') {
          const { error } = await supabase.from('community_members').insert({
            community_id: id, user_id: meId, source: 'manual',
          });
          if (error) throw error;
          toast('Joined.');
        } else if (action === 'leave') {
          const { error } = await supabase
            .from('community_members')
            .delete()
            .eq('community_id', id)
            .eq('user_id', meId);
          if (error) throw error;
          toast('Left.');
        }
        await refresh();
      } catch (err) {
        toast(err.message || 'Action failed', 'error');
        btn.disabled = false;
      }
      return;
    }

    const row = e.target.closest('.row[data-clickable]');
    if (row) {
      const id = row.dataset.id;
      if (id) location.href = 'group-chat.html?id=' + id;
    }
  });

  // ---- Create ----
  $('btn-create').addEventListener('click', () => {
    $('modal-alert').removeAttribute('data-show');
    $('form-create').reset();
    $('modal').setAttribute('data-open', '1');
    $('modal').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('c-name').focus(), 50);
  });
  function closeModal() {
    $('modal').removeAttribute('data-open');
    $('modal').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  $('btn-cancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal(); });

  $('form-create').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = $('modal-alert');
    const btn = $('btn-submit');
    alertEl.removeAttribute('data-show');

    const name = $('c-name').value.trim();
    const desc = $('c-desc').value.trim();
    if (!name) { alertEl.textContent = 'Name is required.'; alertEl.setAttribute('data-show', '1'); return; }

    // Use my profile's institution
    const { data: me } = await supabase.from('profiles').select('institution_id').eq('id', meId).single();
    if (!me?.institution_id) {
      alertEl.textContent = 'Your account is not attached to an institution.';
      alertEl.setAttribute('data-show', '1');
      return;
    }

    btn.disabled = true; btn.textContent = 'Creating…';

    try {
      const { data: created, error: cErr } = await supabase
        .from('communities')
        .insert({
          institution_id: me.institution_id,
          name,
          description: desc || null,
          kind: 'interest',
          membership_mode: 'open',
          created_by: meId,
        })
        .select('id')
        .single();
      if (cErr) throw cErr;

      const { error: jErr } = await supabase.from('community_members').insert({
        community_id: created.id, user_id: meId, role: 'moderator', source: 'manual',
      });
      if (jErr) throw jErr;

      closeModal();
      toast('Community created.');
      await refresh();
      switchTab('interest');
    } catch (err) {
      alertEl.textContent = err.message || 'Could not create.';
      alertEl.setAttribute('data-show', '1');
    } finally {
      btn.disabled = false; btn.textContent = 'Create';
    }
  });

  // ---- Refresh ----
  async function refresh() {
    const ok = await loadAll();
    if (ok) renderAll();
  }

  // ---- Boot ----
  const ok = await loadAll();
  if (ok) {
    $('state-loading').hidden = true;
    switchTab('academic');
    renderAll();
  }
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
</html>
