<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health — Matric v2</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0c0a09; color: #fafaf9; padding: 24px; margin: 0; }
  h1 { font-size: 1.25rem; margin: 0 0 16px; font-weight: 600; }
  pre { background: #1c1917; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 0.875rem; line-height: 1.6; margin: 0; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .dim { color: #78716c; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="../../manifest-v2.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="application-name" content="Matric">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matric">
  <script src="../../v2/js/pwa.js" defer></script>
</head>
<body>
<h1>Matric v2 — Health Check</h1>
<pre id="out">Loading…</pre>
<script type="module">
  import { supabase } from '../js/supabase.js';

  const out = document.getElementById('out');
  const lines = [];

  function render() {
    out.innerHTML = lines.map(l => {
      if (l.startsWith('✓')) return `<span class="ok">${l}</span>`;
      if (l.startsWith('✗')) return `<span class="err">${l}</span>`;
      if (l.startsWith('  ')) return `<span class="dim">${l}</span>`;
      return l;
    }).join('\n');
  }

  try {
    lines.push('✓ supabase.js imported');
    lines.push(`  host: ${new URL(supabase.supabaseUrl).host}`);
    render();

    const { data, error } = await supabase.from('institutions').select('*');

    if (error) {
      lines.push('');
      lines.push('✗ Query failed');
      lines.push(`  message: ${error.message}`);
      lines.push(`  code: ${error.code ?? '(none)'}`);
      render();
    } else {
      lines.push('');
      lines.push(`✓ Query succeeded`);
      lines.push(`  institutions visible to anonymous user: ${data.length}`);
      lines.push('  (Expected: 0. RLS is on, and only authenticated users');
      lines.push('   can read. A number > 0 here would mean RLS is broken.)');
      render();
    }
  } catch (e) {
    lines.push(`✗ Exception: ${e.message}`);
    render();
  }
</script>
</body>
</html>
