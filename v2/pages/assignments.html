<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assignments — Matric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/drawer.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); min-height: 56px; }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .btn-primary { appearance: none; background: var(--brand); color: var(--brand-fg); border: none; padding: 0.5rem 0.9rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: all var(--duration-fast) var(--ease); min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-6) var(--space-6) var(--space-10); } }

  .hero h1 { font-size: var(--text-2xl); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
  .hero p { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-5); }
  @media (min-width: 640px) { .hero h1 { font-size: var(--text-3xl); } }

  .search { width: 100%; padding: 0.75rem 1rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--text); margin-bottom: var(--space-3); min-height: 46px; }
  .search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }

  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: var(--space-4); scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { appearance: none; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); padding: 0.4rem 0.75rem; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 500; cursor: pointer; flex-shrink: 0; transition: all var(--duration-fast) var(--ease); font-family: inherit; min-height: 32px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .list { display: flex; flex-direction: column; gap: var(--space-3); }

  .asg {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .asg:hover { border-color: var(--border-strong); }
  .asg__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); margin-bottom: 8px; }
  .asg__course { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.05em; padding: 2px 7px; border-radius: var(--radius-sm); background: var(--brand-subtle); color: var(--brand); }
  .asg__status { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: var(--radius-full); flex-shrink: 0; }
  .asg__status--pending { background: #fef3c7; color: #92400e; }
  .asg__status--submitted { background: #dbeafe; color: #1e40af; }
  .asg__status--graded { background: #dcfce7; color: #166534; }
  .asg__status--overdue { background: #fee2e2; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .asg__status--pending { background: #451a03; color: #fcd34d; }
    .asg__status--submitted { background: #172554; color: #93c5fd; }
    .asg__status--graded { background: #052e16; color: #86efac; }
    .asg__status--overdue { background: #450a0a; color: #fca5a5; }
  }
  .asg__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; line-height: var(--leading-snug); margin-bottom: 6px; }
  .asg__meta { display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: var(--text-xs); color: var(--text-subtle); }
  .asg__meta strong { color: var(--text-muted); font-weight: 600; }

  .empty { padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .empty svg { color: var(--border-strong); margin-bottom: var(--space-3); }
  .empty h3 { font-size: var(--text-base); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }

  .state { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  /* Modal (also serves as detail view) */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: var(--space-4); opacity: 0; pointer-events: none; transition: opacity var(--duration) var(--ease); }
  .modal-backdrop[data-open] { opacity: 1; pointer-events: auto; }
  .modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; padding: var(--space-5); transform: translateY(12px); transition: transform var(--duration) var(--ease); }
  .modal-backdrop[data-open] .modal { transform: translateY(0); }
  .modal h2 { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
  .modal .sub { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-4); }
  .modal .field { margin-bottom: var(--space-3); }
  .modal label { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 0.75rem 0.9rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); font-family: inherit;
    transition: all var(--duration-fast) var(--ease);
    min-height: 46px;
  }
  .modal textarea { min-height: 110px; resize: vertical; line-height: var(--leading-base); }
  .modal input:focus, .modal textarea:focus, .modal select:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); justify-content: flex-end; }
  @media (max-width: 480px) { .modal-actions { flex-direction: column-reverse; } }
  .btn-ghost { appearance: none; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.65rem 1rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: all var(--duration-fast) var(--ease); min-height: 42px; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  .modal-alert { display: none; padding: 0.7rem 0.9rem; border-radius: var(--radius-md); font-size: var(--text-sm); margin-bottom: var(--space-3); overflow-wrap: anywhere; }
  .modal-alert[data-show] { display: block; }
  .modal-alert--error { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: var(--space-3) 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: var(--space-4); font-size: var(--text-sm); }
  .info-grid dt { color: var(--text-muted); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 3px; }
  .info-grid dd { font-weight: 500; overflow-wrap: anywhere; }

  .instructions { padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); font-size: var(--text-sm); line-height: var(--leading-base); white-space: pre-wrap; margin-bottom: var(--space-4); overflow-wrap: anywhere; }

  .sub-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; }
  .sub-item:hover { background: color-mix(in srgb, var(--brand) 6%, transparent); }
  .sub-avatar { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--brand-subtle); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-xs); flex-shrink: 0; text-transform: uppercase; }
  .sub-body { flex: 1; min-width: 0; }
  .sub-name { font-weight: 500; font-size: var(--text-sm); overflow-wrap: anywhere; }
  .sub-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
  .sub-score { font-weight: 700; font-size: var(--text-sm); color: var(--success); flex-shrink: 0; }
  .sub-score[data-ungraded] { color: var(--warning); font-weight: 600; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; }

  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 0.65rem 1rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: all var(--duration) var(--ease); z-index: 60; max-width: 90vw; text-align: center; }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Assignments</div>
  <div class="topbar__right">
    <button class="btn-primary" id="btn-new" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="hero-title">Assignments</h1>
    <p id="hero-sub">Loading…</p>
  </div>

  <input type="search" class="search" id="search" placeholder="Search by title or course…" autocomplete="off">

  <div class="filters" id="filters"></div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div id="list" hidden></div>
</main>

<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  const errBox = $('state-error');
  function fatal(msg) {
    $('state-loading').hidden = true;
    if (errBox) { errBox.hidden = false; errBox.textContent = msg; }
    console.error('[assignments]', msg);
  }

  try {
    let meId = null, me = null, roleNames = [], mode = 'student';
    let assignments = [], submissions = [];
    let filter = 'all';
    let search = '';
    let myCourseIds = [];

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.replace('login.html'); throw new Error('unauth'); }
    meId = session.user.id;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const initials = (name) => (name || '?').split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
    const timeAgo = (iso) => {
      if (!iso) return '';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    };
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    function toast(msg, kind) {
      const el = $('toast');
      if (!el) return;
      el.textContent = msg;
      el.setAttribute('data-show', '1');
      if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
    }
    function isOverdue(d) { return d && new Date(d) < new Date(); }

    // Load profile
    const { data: prof } = await supabase.from('profiles')
      .select('id, full_name, role, institution_id')
      .eq('id', meId).single();
    me = prof || {};

    const { data: roleRows } = await supabase
      .from('user_role_assignments')
      .select('role_definitions(name)')
      .eq('user_id', meId).eq('status', 'active');
    roleNames = (roleRows || []).map(r => r.role_definitions?.name).filter(Boolean);

    if (roleNames.includes('LECTURER') || roleNames.includes('HOD') || roleNames.includes('FACULTY_ADMIN')) {
      mode = 'lecturer';
    } else {
      mode = 'student';
    }

    // Load my courses
    if (mode === 'student') {
      const { data: ce } = await supabase.from('course_enrollments')
        .select('course_id').eq('user_id', meId).eq('status', 'active');
      myCourseIds = (ce || []).map(r => r.course_id);
    } else {
      const { data: ca } = await supabase.from('course_assignments')
        .select('course_id').eq('lecturer_id', meId);
      myCourseIds = (ca || []).map(r => r.course_id);
    }

    const $heroSub = $('hero-sub');
    if (myCourseIds.length === 0) {
      if ($heroSub) $heroSub.textContent = mode === 'lecturer' ? 'You have no course assignments.' : 'Enrol in courses to see assignments.';
      $('state-loading').hidden = true;
      $('list').hidden = false;
      $('list').innerHTML = mode === 'lecturer'
        ? `<div class="empty"><h3>No courses assigned</h3><p>Add courses from My Teaching.</p></div>`
        : `<div class="empty"><h3>No courses yet</h3><p>Complete enrollment first.</p></div>`;
      throw new Error('__short_circuit__');
    }

    if ($heroSub) {
      $heroSub.textContent = mode === 'student'
        ? 'Assignments for your enrolled courses.'
        : 'Assignments you have created.';
    }

    async function load() {
      const { data, error } = await supabase
        .from('assignments')
        .select(`id, title, instructions, due_at, max_score, status, created_at, course_id, created_by, session_id, courses ( code, title )`)
        .in('course_id', myCourseIds)
        .order('created_at', { ascending: false });

      if (error) { fatal(error.message); return; }
      assignments = data || [];

      if (assignments.length > 0) {
        const ids = assignments.map(a => a.id);
        if (mode === 'student') {
          const { data: subs } = await supabase.from('assignment_submissions')
            .select('id, assignment_id, status, submitted_at, score, feedback, body, file_name, file_size')
            .in('assignment_id', ids).eq('student_id', meId);
          submissions = subs || [];
        } else {
          const { data: subs } = await supabase.from('assignment_submissions')
            .select(`id, assignment_id, status, submitted_at, score, feedback, body, file_name, file_size, profiles:student_id ( id, full_name, avatar_url )`)
            .in('assignment_id', ids);
          submissions = subs || [];
        }
      }

      $('state-loading').hidden = true;
      $('list').hidden = false;
      renderFilters();
      render();
    }

    function renderFilters() {
      const set = new Set();
      assignments.forEach(a => { if (a.courses?.code) set.add(a.courses.code); });
      const codes = Array.from(set).sort();
      const f = $('filters');
      f.innerHTML = '<button class="chip" data-c="all" aria-pressed="true">All</button>' +
        codes.map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('');
      f.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          filter = chip.dataset.c;
          f.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.c === filter)));
          render();
        });
      });
    }

    function statusFor(a) {
      if (mode === 'lecturer') {
        const subs = submissions.filter(s => s.assignment_id === a.id);
        const ungraded = subs.filter(s => s.status !== 'graded').length;
        return { key: 'submitted', label: `${subs.length} submission${subs.length === 1 ? '' : 's'}${ungraded ? ` · ${ungraded} to grade` : ''}` };
      }
      const sub = submissions.find(s => s.assignment_id === a.id);
      if (sub && sub.status === 'graded') return { key: 'graded', label: `Graded${sub.score != null ? ` · ${sub.score}/${a.max_score || '?'}` : ''}` };
      if (sub) return { key: 'submitted', label: 'Submitted' };
      if (isOverdue(a.due_at)) return { key: 'overdue', label: 'Overdue' };
      return { key: 'pending', label: 'Not submitted' };
    }

    function render() {
      const q = search.trim().toLowerCase();
      const filtered = assignments.filter(a => {
        if (filter !== 'all' && a.courses?.code !== filter) return false;
        if (!q) return true;
        return (a.title || '').toLowerCase().includes(q) || (a.courses?.code || '').toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        $('list').innerHTML = `<div class="empty"><h3>${mode === 'lecturer' ? 'No assignments yet' : 'Nothing here'}</h3><p>${mode === 'lecturer' ? 'Create your first assignment.' : 'Assignments will appear here.'}</p></div>`;
        return;
      }

      $('list').innerHTML = '<div class="list">' + filtered.map(a => {
        const st = statusFor(a);
        return `
          <div class="asg" data-id="${esc(a.id)}">
            <div class="asg__head">
              <span class="asg__course">${esc(a.courses?.code || 'Course')}</span>
              <span class="asg__status asg__status--${st.key}">${esc(st.label)}</span>
            </div>
            <div class="asg__title">${esc(a.title)}</div>
            <div class="asg__meta">
              ${a.due_at ? `<span><strong>Due</strong> ${esc(fmtDate(a.due_at))}</span>` : ''}
              ${mode === 'lecturer' && a.max_score ? `<span><strong>Max</strong> ${a.max_score}</span>` : ''}
            </div>
          </div>`;
      }).join('') + '</div>';

      document.querySelectorAll('.asg').forEach(el => {
        el.addEventListener('click', () => openDetail(el.dataset.id));
      });
    }

    $('search').addEventListener('input', (e) => { search = e.target.value; render(); });

    function openModal(html) {
      $('modal-body').innerHTML = html;
      $('modal').setAttribute('data-open', '1');
      $('modal').setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      $('modal').removeAttribute('data-open');
      $('modal').setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').hasAttribute('data-open')) closeModal(); });

    function openDetail(id) {
      const a = assignments.find(x => x.id === id);
      if (!a) return;
      if (mode === 'student') openStudentDetail(a);
      else openLecturerDetail(a);
    }

    function openStudentDetail(a) {
      const sub = submissions.find(s => s.assignment_id === a.id);
      const st = statusFor(a);
      const canSubmit = !sub && !isOverdue(a.due_at);

      let body = `
        <h2>${esc(a.title)}</h2>
        <p class="sub">${esc(a.courses?.code || '')} · ${esc(a.courses?.title || '')}</p>
        <div class="info-grid">
          <div><dt>Due</dt><dd>${esc(fmtDate(a.due_at))}</dd></div>
          <div><dt>Max score</dt><dd>${a.max_score ?? '—'}</dd></div>
          <div><dt>Status</dt><dd>${esc(st.label)}</dd></div>
        </div>
        ${a.instructions ? `<div class="instructions">${esc(a.instructions)}</div>` : ''}`;

      if (sub) {
        body += `
          <div style="padding:12px;background:var(--bg-sunken);border-radius:10px;margin-bottom:16px;">
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:8px;">Your submission</div>
            ${sub.body ? `<div style="font-size:14px;line-height:1.5;margin-bottom:6px;white-space:pre-wrap;">${esc(sub.body)}</div>` : ''}
            ${sub.file_name ? `<div style="font-size:12px;color:var(--text-subtle);">Attached: ${esc(sub.file_name)}</div>` : ''}
            ${sub.score != null ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><span style="color:var(--text-muted);">Grade:</span> <strong style="color:var(--success);font-size:17px;">${sub.score}/${a.max_score || '?'}</strong>${sub.feedback ? `<div style="font-size:14px;color:var(--text-muted);margin-top:6px;">"${esc(sub.feedback)}"</div>` : ''}</div>` : ''}
          </div>
          <div class="modal-actions"><button class="btn-ghost" id="md-close">Close</button></div>`;
      } else if (canSubmit) {
        body += `
          <form id="md-submit-form">
            <div class="field">
              <label for="md-body">Your answer (optional if attaching)</label>
              <textarea id="md-body" maxlength="5000" placeholder="Write your answer…"></textarea>
            </div>
            <div class="field">
              <label for="md-file">Attachment (optional, up to 20 MB)</label>
              <input type="file" id="md-file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.txt,.jpg,.jpeg,.png">
            </div>
            <div class="modal-alert modal-alert--error" id="md-alert"></div>
            <div class="modal-actions">
              <button type="button" class="btn-ghost" id="md-close">Cancel</button>
              <button type="submit" class="btn-primary" id="md-submit">Submit</button>
            </div>
          </form>`;
      } else {
        body += `<div class="modal-actions"><button class="btn-ghost" id="md-close">Close</button></div>`;
      }

      openModal(body);
      document.getElementById('md-close')?.addEventListener('click', closeModal);

      const form = document.getElementById('md-submit-form');
      if (form) form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('md-submit');
        const alertEl = document.getElementById('md-alert');
        alertEl.removeAttribute('data-show');
        btn.disabled = true; btn.textContent = 'Submitting…';
        try {
          const text = document.getElementById('md-body').value.trim();
          const file = document.getElementById('md-file').files[0];
          if (!text && !file) throw new Error('Write or attach something.');
          let filePath = null, fileName = null, fileSize = null;
          if (file) {
            if (file.size > 20 * 1024 * 1024) throw new Error('File exceeds 20 MB.');
            const ext = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
            const rand = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
            const path = `${meId}/${a.id}/${rand}${ext}`;
            const { error: upErr } = await supabase.storage.from('assignments').upload(path, file, { contentType: file.type });
            if (upErr) throw upErr;
            filePath = path; fileName = file.name; fileSize = file.size;
          }
          const { error } = await supabase.from('assignment_submissions').insert({
            assignment_id: a.id, student_id: meId, body: text || null,
            file_path: filePath, file_name: fileName, file_size: fileSize,
          });
          if (error) throw error;
          toast('Submitted.');
          closeModal();
          await load();
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Submit';
          alertEl.textContent = err.message || 'Something went wrong.';
          alertEl.setAttribute('data-show', '1');
        }
      });
    }

    function openLecturerDetail(a) {
      const subs = submissions.filter(s => s.assignment_id === a.id);
      const ungraded = subs.filter(s => s.status !== 'graded');
      let body = `
        <h2>${esc(a.title)}</h2>
        <p class="sub">${esc(a.courses?.code || '')} · ${esc(a.courses?.title || '')}</p>
        <div class="info-grid">
          <div><dt>Due</dt><dd>${esc(fmtDate(a.due_at))}</dd></div>
          <div><dt>Submissions</dt><dd>${subs.length}${ungraded.length ? ` (${ungraded.length} to grade)` : ''}</dd></div>
        </div>
        ${a.instructions ? `<div class="instructions">${esc(a.instructions)}</div>` : ''}
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:8px;">Submissions</div>
        ${subs.length === 0
          ? '<div class="empty" style="padding:16px;">No submissions yet.</div>'
          : subs.map(s => `
            <div class="sub-item" data-sub-id="${esc(s.id)}">
              <div class="sub-avatar">${esc(initials(s.profiles?.full_name))}</div>
              <div class="sub-body">
                <div class="sub-name">${esc(s.profiles?.full_name || 'Student')}</div>
                <div class="sub-meta">${esc(timeAgo(s.submitted_at))}${s.file_name ? ' · 📎 ' + esc(s.file_name) : ''}</div>
              </div>
              ${s.status === 'graded' ? `<span class="sub-score">${s.score ?? '—'}/${a.max_score || '?'}</span>` : `<span class="sub-score" data-ungraded>Grade</span>`}
            </div>`).join('')}
        <div class="modal-actions"><button class="btn-ghost" id="md-close">Close</button></div>`;
      openModal(body);
      document.getElementById('md-close')?.addEventListener('click', closeModal);
      document.querySelectorAll('.sub-item').forEach(el => {
        el.addEventListener('click', () => {
          const s = subs.find(x => x.id === el.dataset.subId);
          if (s) openGradeView(a, s);
        });
      });
    }

    function openGradeView(a, s) {
      const body = `
        <h2>${esc(s.profiles?.full_name || 'Student')}</h2>
        <p class="sub">${esc(a.title)} · ${esc(timeAgo(s.submitted_at))}</p>
        ${s.body ? `<div class="instructions">${esc(s.body)}</div>` : ''}
        ${s.file_name ? `<div style="font-size:14px;color:var(--text-muted);margin-bottom:12px;">📎 ${esc(s.file_name)}</div>` : ''}
        <form id="md-grade-form">
          <div class="field">
            <label for="md-score">Score (out of ${a.max_score ?? '—'})</label>
            <input type="number" id="md-score" min="0" max="${a.max_score || 100}" value="${s.score ?? ''}" required>
          </div>
          <div class="field">
            <label for="md-feedback">Feedback (optional)</label>
            <textarea id="md-feedback" maxlength="2000">${esc(s.feedback || '')}</textarea>
          </div>
          <div class="modal-alert modal-alert--error" id="md-alert"></div>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="md-back">Back</button>
            <button type="submit" class="btn-primary" id="md-save">Save grade</button>
          </div>
        </form>`;
      openModal(body);
      document.getElementById('md-back')?.addEventListener('click', () => openLecturerDetail(a));
      document.getElementById('md-grade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('md-save');
        const alertEl = document.getElementById('md-alert');
        alertEl.removeAttribute('data-show');
        const score = parseInt(document.getElementById('md-score').value, 10);
        const feedback = document.getElementById('md-feedback').value.trim() || null;
        if (Number.isNaN(score)) { alertEl.textContent = 'Score required.'; alertEl.setAttribute('data-show', '1'); return; }
        btn.disabled = true; btn.textContent = 'Saving…';
        const { error } = await supabase.from('assignment_submissions')
          .update({ score, feedback, status: 'graded', graded_at: new Date().toISOString(), graded_by: meId })
          .eq('id', s.id);
        btn.disabled = false; btn.textContent = 'Save grade';
        if (error) { alertEl.textContent = error.message; alertEl.setAttribute('data-show', '1'); return; }
        toast('Grade saved.');
        await load();
        const a2 = assignments.find(x => x.id === a.id);
        if (a2) openLecturerDetail(a2);
      });
    }

    if (mode === 'lecturer') $('btn-new').hidden = false;

    $('btn-new')?.addEventListener('click', async () => {
      const { data: taught } = await supabase.from('course_assignments')
        .select('course_id, session_id, courses ( code, title )').eq('lecturer_id', meId);
      if (!taught || taught.length === 0) { toast('No courses assigned to you.', 'error'); return; }

      const body = `
        <h2>New assignment</h2>
        <p class="sub">Students enrolled will be notified.</p>
        <form id="md-new-form">
          <div class="field">
            <label for="md-course">Course</label>
            <select id="md-course" required>
              ${taught.map(t => `<option value="${t.course_id}" data-session="${t.session_id}">${esc(t.courses?.code)} — ${esc(t.courses?.title)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label for="md-title">Title</label><input type="text" id="md-title" required maxlength="200"></div>
          <div class="field"><label for="md-instructions">Instructions (optional)</label><textarea id="md-instructions" maxlength="5000"></textarea></div>
          <div class="field"><label for="md-due">Due date</label><input type="datetime-local" id="md-due"></div>
          <div class="field"><label for="md-max">Max score (optional)</label><input type="number" id="md-max" min="1" max="1000" placeholder="100"></div>
          <div class="modal-alert modal-alert--error" id="md-alert"></div>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="md-cancel">Cancel</button>
            <button type="submit" class="btn-primary" id="md-create">Create</button>
          </div>
        </form>`;
      openModal(body);
      document.getElementById('md-cancel').addEventListener('click', closeModal);
      document.getElementById('md-new-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('md-create');
        const alertEl = document.getElementById('md-alert');
        alertEl.removeAttribute('data-show');
        const courseSel = document.getElementById('md-course');
        const courseId = courseSel.value;
        const sessionId = courseSel.selectedOptions[0]?.dataset.session;
        const title = document.getElementById('md-title').value.trim();
        const instructions = document.getElementById('md-instructions').value.trim() || null;
        const dueLocal = document.getElementById('md-due').value;
        const dueAt = dueLocal ? new Date(dueLocal).toISOString() : null;
        const maxScore = parseInt(document.getElementById('md-max').value, 10) || null;
        if (!title) { alertEl.textContent = 'Title required.'; alertEl.setAttribute('data-show', '1'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        const { error } = await supabase.from('assignments').insert({
          institution_id: me.institution_id, course_id: courseId, session_id: sessionId,
          created_by: meId, title, instructions, due_at: dueAt, max_score: maxScore, status: 'published',
        });
        btn.disabled = false; btn.textContent = 'Create';
        if (error) { alertEl.textContent = error.message; alertEl.setAttribute('data-show', '1'); return; }
        toast('Assignment created.');
        closeModal();
        await load();
      });
    });

    await load();

  } catch (err) {
    if (err && err.message === '__short_circuit__') {
      // already handled
    } else {
      fatal('Assignment load failed: ' + (err && err.message ? err.message : String(err)));
    }
  }
</script>

<script type="module" src="../js/bottom-nav.js"></script>
<script type="module" src="../js/notifications.js"></script>
</body>
</html>
