<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Profile — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-5);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--brand); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .btn-ghost {
    appearance: none; background: transparent;
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.45rem 0.85rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease); min-height: 36px;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn-ghost:hover {
    border-color: var(--border-strong); color: var(--text);
    background: var(--bg-elevated);
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
  @media (min-width: 640px) { .wrap { padding: var(--space-8) var(--space-6); } }

  .head { margin-bottom: var(--space-6); }
  .head h1 {
    font-size: var(--text-2xl); font-weight: 600;
    letter-spacing: -0.02em; line-height: var(--leading-tight);
    margin-bottom: var(--space-2);
  }
  @media (min-width: 640px) { .head h1 { font-size: var(--text-3xl); } }
  .head p { color: var(--text-muted); font-size: var(--text-base); }

  .card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--space-6);
    margin-bottom: var(--space-4);
  }
  .card__head {
    display: flex; align-items: center; gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  .avatar-lg {
    width: 64px; height: 64px; border-radius: var(--radius-full);
    background: var(--brand); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xl); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .card__head-text { min-width: 0; }
  .card__head-text .name {
    font-size: var(--text-lg); font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: 2px;
    overflow-wrap: anywhere;
  }
  .role-badge {
    display: inline-block; font-size: var(--text-xs);
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--brand);
    background: var(--brand-subtle); padding: 0.2rem 0.55rem;
    border-radius: var(--radius-full);
  }

  .field-row {
    display: flex; justify-content: space-between;
    align-items: center; gap: var(--space-4);
    padding: var(--space-3) 0;
    border-bottom: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  .field-row:last-child { border-bottom: none; padding-bottom: 0; }
  .field-row dt { color: var(--text-muted); flex-shrink: 0; }
  .field-row dd {
    color: var(--text); font-weight: 500;
    text-align: right; overflow-wrap: anywhere;
    min-width: 0;
  }

  .form .field { margin-bottom: var(--space-4); }
  .form label {
    display: block; font-size: var(--text-sm);
    font-weight: 500; color: var(--text);
    margin-bottom: var(--space-2);
  }
  .form input, .form select {
    width: 100%; padding: 0.7rem 0.85rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-base);
    color: var(--text); transition: all var(--duration-fast) var(--ease);
    min-height: 46px;
  }
  .form input:focus, .form select:focus {
    border-color: var(--brand); outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .form input:disabled {
    opacity: 0.6; cursor: not-allowed;
    background: var(--bg-sunken);
  }
  .hint {
    font-size: var(--text-xs); color: var(--text-subtle);
    margin-top: var(--space-2); line-height: var(--leading-snug);
  }

  .btn-primary {
    appearance: none; background: var(--brand); color: var(--brand-fg);
    border: none; padding: 0.75rem 1rem;
    border-radius: var(--radius-md); font-size: var(--text-base);
    font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    min-height: 46px; width: 100%;
  }
  .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .alert {
    display: none; padding: 0.7rem 0.9rem;
    border-radius: var(--radius-md); font-size: var(--text-sm);
    margin-bottom: var(--space-4); line-height: var(--leading-snug);
  }
  .alert[data-show] { display: block; }
  .alert--error {
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
  }
  .alert--success {
    background: color-mix(in srgb, var(--success) 10%, transparent);
    color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
  }

  .state { padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }

  #content[hidden] { display: none; }
</style>
  <link rel="stylesheet" href="../css/nav.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    UniConnect
  </div>
  <div class="topbar__right">
    <a class="btn-ghost" href="dashboard.html">Dashboard</a>
    <a class="btn-ghost" href="announcements.html">Announcements</a>
    <button class="btn-ghost" id="btn-signout">Sign out</button>
  </div>
</header>

<main class="wrap">

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>

  <div id="content" hidden>

    <div class="head">
      <h1>Your profile</h1>
      <p>Manage your display name, level, and status.</p>
    </div>

    <!-- Read-only summary -->
    <section class="card">
      <div class="card__head">
        <div class="avatar-lg" id="avatar-lg"></div>
        <div class="card__head-text">
          <div class="name" id="s-name">—</div>
          <span class="role-badge" id="s-role">—</span>
        </div>
      </div>
      <dl>
        <div class="field-row"><dt>Email</dt><dd id="s-email">—</dd></div>
        <div class="field-row"><dt>Institution</dt><dd id="s-institution">—</dd></div>
        <div class="field-row"><dt>Department</dt><dd id="s-department">—</dd></div>
      </dl>
    </section>

    <!-- Editable -->
    <section class="card">
      <div class="alert" id="alert" role="alert"></div>

      <form class="form" id="form-edit" novalidate>
        <div class="field">
          <label for="f-name">Display name</label>
          <input type="text" id="f-name" required maxlength="80" autocomplete="name">
          <div class="hint">This is what others will see. Your email stays unchanged.</div>
        </div>

        <div class="field" id="field-level" hidden>
          <label for="f-level">Level</label>
          <select id="f-level">
            <option value="">Not set</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="300">300</option>
            <option value="400">400</option>
            <option value="500">500</option>
            <option value="600">600</option>
            <option value="700">700</option>
          </select>
        </div>

        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="online">Online</option>
            <option value="away">Away</option>
            <option value="offline">Offline</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" id="btn-save">Save changes</button>
      </form>
    </section>

  </div>

</main>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.replace('login.html');
    throw new Error('unauthenticated');
  }

  // ---- Load profile with joined names ----
  async function load() {
    const { data, error } = await supabase
      .from('profiles')
      .select(`
        id, full_name, email, role, level, status,
        institution_id, department_id,
        institutions ( name ),
        departments ( name )
      `)
      .eq('id', session.user.id)
      .single();

    if (error) {
      $('state-loading').hidden = true;
      $('state-error').textContent = 'Could not load profile: ' + error.message;
      $('state-error').hidden = false;
      return;
    }

    render(data);
    $('state-loading').hidden = true;
    $('content').hidden = false;
  }

  function render(p) {
    // Summary
    const initials = (p.full_name || p.email || '?')
      .split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
    $('avatar-lg').textContent = initials || '?';
    $('s-name').textContent = p.full_name || '(no name set)';
    $('s-role').textContent = p.role;
    $('s-email').textContent = p.email;
    $('s-institution').textContent = p.institutions?.name || 'Not assigned';
    $('s-department').textContent = p.departments?.name || 'Not assigned';

    // Form
    $('f-name').value = p.full_name || '';
    $('f-status').value = p.status || 'offline';

    // Level only applies to students
    if (p.role === 'student') {
      $('field-level').hidden = false;
      $('f-level').value = p.level ? String(p.level) : '';
    } else {
      $('field-level').hidden = true;
    }
  }

  // ---- Save ----
  $('form-edit').addEventListener('submit', async (e) => {
    e.preventDefault();

    const alertEl = $('alert');
    alertEl.removeAttribute('data-show');

    const full_name = $('f-name').value.trim();
    const status    = $('f-status').value;
    const levelRaw  = $('f-level').value;
    const level     = levelRaw ? parseInt(levelRaw, 10) : null;

    if (!full_name) {
      alertEl.className = 'alert alert--error';
      alertEl.textContent = 'Display name cannot be empty.';
      alertEl.setAttribute('data-show', '1');
      return;
    }

    const btn = $('btn-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    // RLS profiles_update_self requires: role unchanged, institution unchanged.
    // We send only the fields we intend to change — safer by construction.
    const payload = { full_name, status };

    // Only send level if the field is visible (role === student)
    const { data: current } = await supabase
      .from('profiles').select('role').eq('id', session.user.id).single();

    if (current?.role === 'student') {
      payload.level = level;
    }

    const { error } = await supabase
      .from('profiles')
      .update(payload)
      .eq('id', session.user.id);

    btn.disabled = false;
    btn.textContent = 'Save changes';

    if (error) {
      alertEl.className = 'alert alert--error';
      alertEl.textContent = error.message;
      alertEl.setAttribute('data-show', '1');
      return;
    }

    alertEl.className = 'alert alert--success';
    alertEl.textContent = 'Profile updated.';
    alertEl.setAttribute('data-show', '1');

    await load();
  });

  // ---- Sign out ----
  $('btn-signout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.replace('login.html');
  });

  load();
</script>

  <script type="module" src="../js/bottom-nav.js"></script>
</body>
</html>
