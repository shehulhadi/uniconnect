<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Group — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
    flex-shrink: 0;
  }
  .topbar__left {
    display: flex; align-items: center; gap: var(--space-3);
    min-width: 0;
  }
  .back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); text-decoration: none;
    transition: all var(--duration-fast) var(--ease);
    flex-shrink: 0;
  }
  .back:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elevated); }

  .head { min-width: 0; }
  .head__name {
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head__meta {
    font-size: var(--text-xs); color: var(--text-subtle);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    max-width: 720px; width: 100%;
    margin: 0 auto;
    padding: 0 var(--space-4);
  }

  .msgs {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: var(--space-4) 0;
    display: flex; flex-direction: column; gap: var(--space-3);
    scroll-behavior: smooth;
  }
  .msgs::-webkit-scrollbar { width: 6px; }
  .msgs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .date-divider {
    text-align: center;
    font-size: var(--text-xs);
    color: var(--text-subtle);
    padding: var(--space-2) 0;
    position: relative;
  }
  .date-divider span {
    background: var(--bg); padding: 0 var(--space-3);
    position: relative; z-index: 1;
  }
  .date-divider::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--border);
  }

  .msg {
    display: flex; gap: var(--space-3);
    align-items: flex-end;
    max-width: 85%;
  }
  .msg--mine {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg__avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--brand-subtle); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: 600;
    flex-shrink: 0; text-transform: uppercase;
  }
  .msg--mine .msg__avatar { background: var(--brand); color: var(--brand-fg); }
  .msg__bubble {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-2) var(--space-3);
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg--mine .msg__bubble {
    background: var(--brand); color: var(--brand-fg);
    border-color: var(--brand);
  }
  .msg__sender {
    font-size: var(--text-xs); font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .msg__time {
    font-size: 0.6875rem; color: var(--text-subtle);
    margin-top: 3px; display: block;
  }
  .msg--mine .msg__time { color: color-mix(in srgb, var(--brand-fg) 70%, transparent); }

  .composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: var(--space-3) 0 max(var(--space-3), env(safe-area-inset-bottom));
  }
  .composer__row {
    display: flex; gap: var(--space-2); align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    min-height: 40px; max-height: 140px;
    padding: 0.65rem 0.85rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: var(--text-base); font-family: inherit;
    color: var(--text); line-height: 1.4;
    resize: none;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .composer textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .send {
    appearance: none;
    background: var(--brand); color: var(--brand-fg);
    border: none; border-radius: var(--radius-md);
    padding: 0 1rem; min-width: 60px; min-height: 40px;
    font-size: var(--text-sm); font-weight: 500;
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--space-1);
  }
  .send:hover:not(:disabled) { background: var(--brand-hover); }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }

  .state {
    padding: var(--space-6) var(--space-4);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-sm);
  }
  .state--error { color: var(--danger); }
  .state--empty {
    margin: auto; max-width: 34ch;
  }
  .state--empty h3 {
    font-size: var(--text-base); color: var(--text);
    margin-bottom: var(--space-2); font-weight: 600;
  }
  .state[hidden] { display: none; }

  .live-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--success);
    margin-right: 4px; vertical-align: middle;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <a class="back" href="groups.html" aria-label="Back to groups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <div class="head">
      <div class="head__name" id="g-name">Group</div>
      <div class="head__meta"><span class="live-dot"></span><span id="g-meta">Loading…</span></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="msgs" id="msgs">
    <div class="state" id="state-loading">Loading messages…</div>
    <div class="state state--error" id="state-error" hidden></div>
  </div>

  <form class="composer" id="composer" hidden>
    <div class="composer__row">
      <textarea id="input" rows="1" placeholder="Write a message…" maxlength="2000" autocomplete="off"></textarea>
      <button class="send" id="btn-send" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </form>
</main>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const groupId = params.get('id');

  if (!groupId) {
    location.replace('groups.html');
    throw new Error('missing group id');
  }

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.replace('login.html'); throw new Error('unauthenticated'); }
  const meId = session.user.id;

  // ---- Cache of profiles so we don't refetch per message ----
  const profilesCache = new Map();
  async function getProfile(userId) {
    if (profilesCache.has(userId)) return profilesCache.get(userId);
    const { data } = await supabase
      .from('profiles')
      .select('id, full_name, email')
      .eq('id', userId)
      .single();
    const val = data || { id: userId, full_name: 'Unknown', email: '' };
    profilesCache.set(userId, val);
    return val;
  }

  // ---- Load group + verify membership ----
  async function loadGroup() {
    const { data, error } = await supabase
      .from('groups')
      .select('id, name, description, type, group_members ( count )')
      .eq('id', groupId)
      .single();

    if (error) {
      $('state-loading').hidden = true;
      $('state-error').hidden = false;
      $('state-error').textContent =
        'Could not open this group. It may not exist, or you may not be a member.';
      return null;
    }

    const count = data.group_members?.[0]?.count || 0;
    $('g-name').textContent = data.name;
    $('g-meta').textContent = `${count} member${count === 1 ? '' : 's'} · live`;
    document.title = `${data.name} — UniConnect`;
    return data;
  }

  // ---- Render one message ----
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString(undefined, {
      hour: '2-digit', minute: '2-digit'
    });
  }
  function dateKey(iso) {
    const d = new Date(iso);
    return d.toDateString();
  }
  function dateLabel(key) {
    const d = new Date(key);
    const now = new Date();
    const day = 1000 * 60 * 60 * 24;
    const diff = Math.floor((now.setHours(0,0,0,0) - d.setHours(0,0,0,0)) / day);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  }

  async function makeMessageNode(m, opts = {}) {
    const isMine = m.sender_id === meId;
    const p = await getProfile(m.sender_id);
    const initials = (p.full_name || p.email || '?')
      .split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();

    const wrap = el('div', 'msg' + (isMine ? ' msg--mine' : ''));
    wrap.dataset.id = m.id;

    const av = el('div', 'msg__avatar', initials);
    const bubble = el('div', 'msg__bubble');

    if (!isMine) {
      const sender = el('div', 'msg__sender', p.full_name || p.email || 'Unknown');
      bubble.appendChild(sender);
    }
    bubble.appendChild(document.createTextNode(m.body));
    const time = el('span', 'msg__time', fmtTime(m.created_at));
    bubble.appendChild(time);

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    return wrap;
  }

  // ---- Load messages ----
  const msgsEl = $('msgs');

  function clearStates() {
    $('state-loading')?.remove();
    $('state-error')?.remove();
  }

  async function loadMessages() {
    const { data, error } = await supabase
      .from('group_messages')
      .select('id, sender_id, body, created_at')
      .eq('group_id', groupId)
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) {
      $('state-loading').hidden = true;
      $('state-error').hidden = false;
      $('state-error').textContent = 'Could not load messages: ' + error.message;
      return;
    }

    clearStates();

    if (!data || data.length === 0) {
      const empty = el('div', 'state state--empty');
      const h = el('h3', null, 'No messages yet');
      const p = el('p', null, 'Say hello, or share what the group is working on.');
      empty.appendChild(h);
      empty.appendChild(p);
      msgsEl.appendChild(empty);
      return;
    }

    let lastDateKey = null;
    for (const m of data) {
      const k = dateKey(m.created_at);
      if (k !== lastDateKey) {
        const d = el('div', 'date-divider');
        d.appendChild(el('span', null, dateLabel(k)));
        msgsEl.appendChild(d);
        lastDateKey = k;
      }
      const node = await makeMessageNode(m);
      msgsEl.appendChild(node);
    }
    scrollToBottom(false);
  }

  function scrollToBottom(smooth = true) {
    requestAnimationFrame(() => {
      msgsEl.scrollTo({
        top: msgsEl.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto',
      });
    });
  }

  // ---- Realtime subscription ----
  let channel = null;
  function subscribe() {
    channel = supabase
      .channel(`group:${groupId}`)
      .on(
        'postgres_changes',
        {
          event: 'INSERT',
          schema: 'public',
          table: 'group_messages',
          filter: `group_id=eq.${groupId}`,
        },
        async (payload) => {
          const m = payload.new;
          // Ignore if we already rendered it (our own insert already appended)
          if (msgsEl.querySelector(`[data-id="${m.id}"]`)) return;

          // Remove empty state if present
          msgsEl.querySelector('.state--empty')?.remove();

          // Date divider if needed
          const lastNode = msgsEl.querySelector('.msg:last-of-type, .date-divider:last-of-type');
          const k = dateKey(m.created_at);
          const lastKey = lastNode?.dataset?.dateKey;
          if (lastKey !== k) {
            const d = el('div', 'date-divider');
            d.dataset.dateKey = k;
            d.appendChild(el('span', null, dateLabel(k)));
            msgsEl.appendChild(d);
          }

          const node = await makeMessageNode(m);
          msgsEl.appendChild(node);
          scrollToBottom();
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          $('g-meta').textContent = $('g-meta').textContent.replace(' · live', ' · live');
        }
      });
  }

  // ---- Composer ----
  const form = $('composer');
  const input = $('input');
  const sendBtn = $('btn-send');

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  // Enter to send on desktop; newline on mobile (shift+enter always newline)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 768px)').matches) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const { data, error } = await supabase
      .from('group_messages')
      .insert({ group_id: groupId, sender_id: meId, body })
      .select('id, sender_id, body, created_at')
      .single();

    sendBtn.disabled = false;

    if (error) {
      // Recover the text so the user doesn't lose it
      input.value = body;
      input.dispatchEvent(new Event('input'));
      // Show a transient alert via title change (lightweight, no modal here)
      const old = $('g-meta').textContent;
      $('g-meta').textContent = 'Send failed: ' + error.message;
      $('g-meta').style.color = 'var(--danger)';
      setTimeout(() => {
        $('g-meta').textContent = old;
        $('g-meta').style.color = '';
      }, 4000);
      return;
    }

    // Optimistic append (skip waiting for the realtime echo)
    msgsEl.querySelector('.state--empty')?.remove();
    const node = await makeMessageNode(data);
    msgsEl.appendChild(node);
    scrollToBottom();
  });

  // ---- Boot ----
  const group = await loadGroup();
  if (!group) throw new Error('group not loaded');

  await loadMessages();
  subscribe();
  form.hidden = false;
  input.focus();

  // Cleanup on leave
  window.addEventListener('beforeunload', () => {
    if (channel) supabase.removeChannel(channel);
  });
</script>

</body>
</html>
