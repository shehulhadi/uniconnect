<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Office Document Hub — Uniconnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="../css/drawer.css">
<link rel="stylesheet" href="../css/notifications.css">
<link rel="stylesheet" href="../css/topbar.css">
<style>
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); min-height: 56px; background: var(--bg); }
  .topbar__title { font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }

  .btn-primary { appearance: none; background: var(--brand); color: var(--brand-fg); border: none; padding: 0.5rem 0.9rem; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 150ms var(--ease); min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .wrap { max-width: 900px; margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-10); }
  @media (min-width: 640px) { .wrap { padding: var(--space-5) var(--space-6) var(--space-10); } }

  .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
  .search { flex: 1; min-width: 240px; padding: 0.75rem 0.95rem; background: var(--bg-sunken); border: 1px solid transparent; border-radius: var(--radius-md); font-size: 14px; color: var(--text); transition: all 150ms var(--ease); font-family: inherit; min-height: 44px; }
  .search::placeholder { color: var(--text-subtle); }
  .search:focus { outline: none; background: var(--bg-elevated); border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat-card { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: 4px; }
  .stat-card__label { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card__value { font-size: 24px; font-weight: 700; color: var(--text); }

  .folders-section { margin-bottom: var(--space-6); }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; justify-content: space-between; }
  .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
  .folder-card { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 150ms var(--ease); text-align: left; width: 100%; font-family: inherit; color: var(--text); }
  .folder-card:hover { border-color: var(--brand); background: var(--bg-elevated); transform: translateY(-1px); }
  .folder-card svg { width: 20px; height: 20px; color: var(--brand); flex-shrink: 0; }
  .folder-info { display: flex; flex-direction: column; min-width: 0; }
  .folder-info__name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder-info__count { font-size: 11px; color: var(--text-muted); }

  .doc-table-wrap { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .doc-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  .doc-table th { background: var(--bg-elevated); padding: 12px 16px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .doc-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .doc-table tr:last-child td { border-bottom: none; }
  .doc-table tr:hover td { background: var(--bg-elevated); }

  .doc-title-cell { display: flex; align-items: center; gap: 12px; }
  .doc-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 11px; color: var(--brand); border: 1px solid var(--border); }
  .doc-name { font-weight: 600; color: var(--text); display: block; }
  .doc-meta { font-size: 11px; color: var(--text-muted); }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 500; }
  .badge--policy { background: color-mix(in srgb, #3b82f6 15%, transparent); color: #3b82f6; }
  .badge--hr { background: color-mix(in srgb, #10b981 15%, transparent); color: #10b981; }
  .badge--finance { background: color-mix(in srgb, #f59e0b 15%, transparent); color: #f59e0b; }
  .badge--projects { background: color-mix(in srgb, #8b5cf6 15%, transparent); color: #8b5cf6; }

  .actions-cell { display: flex; gap: 8px; align-items: center; }
  .btn-icon { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; transition: all 150ms var(--ease); }
  .btn-icon:hover { color: var(--text); border-color: var(--text); background: var(--bg); }

  /* Modal styling */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: center; justify-content: center; padding: var(--space-4); }
  .modal-backdrop.active { display: flex; }
  .modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 500px; padding: var(--space-5); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: var(--space-4); }
  .form-group { margin-bottom: var(--space-4); }
  .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
  .form-control { width: 100%; padding: 10px 12px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; color: var(--text); font-family: inherit; }
  .form-control:focus { outline: none; border-color: var(--brand); }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Office Document Hub</div>
  <div class="topbar__right">
    <button class="btn-primary" id="newFolderBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      New Folder
    </button>
    <button class="btn-primary" id="uploadDocBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      Upload Document
    </button>
  </div>
</header>

<main class="wrap">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-card__label">Total Documents</span>
      <span class="stat-card__value" id="statTotal">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">Active Folders</span>
      <span class="stat-card__value" id="statFolders">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-card__label">Storage Used</span>
      <span class="stat-card__value" id="statStorage">0 MB</span>
    </div>
  </div>

  <!-- Folders Section -->
  <div class="folders-section">
    <div class="section-title">
      <span>Office Folders & Departments</span>
    </div>
    <div class="folders-grid" id="foldersGrid">
      <!-- Dynamic folders -->
    </div>
  </div>

  <!-- Documents Table Section -->
  <div class="folders-section">
    <div class="section-title">
      <span id="currentViewTitle">All Office Documents</span>
      <div class="toolbar" style="margin:0; min-width: 260px;">
        <input type="text" id="searchInput" class="search" placeholder="Search office files...">
      </div>
    </div>
    <div class="doc-table-wrap">
      <table class="doc-table">
        <thead>
          <tr>
            <th>Document Name</th>
            <th>Category / Folder</th>
            <th>Size & Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="docTableBody">
          <!-- Dynamic rows -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Upload Modal -->
<div class="modal-backdrop" id="uploadModal">
  <div class="modal">
    <h3>Upload New Office Document</h3>
    <form id="uploadForm">
      <div class="form-group">
        <label>Document Title</label>
        <input type="text" id="docTitle" class="form-control" required placeholder="e.g., Q3 Financial Report">
      </div>
      <div class="form-group">
        <label>Folder / Department</label>
        <select id="docCategory" class="form-control">
          <option value="Policies">Company Policies</option>
          <option value="HR">Human Resources</option>
          <option value="Finance">Finance & Accounting</option>
          <option value="Projects">Active Projects</option>
        </select>
      </div>
      <div class="form-group">
        <label>Select File</label>
        <input type="file" id="docFile" class="form-control" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-icon" style="padding: 8px 16px;" onclick="closeModals()">Cancel</button>
        <button type="submit" class="btn-primary">Upload & Index</button>
      </div>
    </form>
  </div>
</div>

<!-- Folder Modal -->
<div class="modal-backdrop" id="folderModal">
  <div class="modal">
    <h3>Create New Office Folder</h3>
    <form id="folderForm">
      <div class="form-group">
        <label>Folder Name</label>
        <input type="text" id="folderNameInput" class="form-control" required placeholder="e.g., Legal & Compliance">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-icon" style="padding: 8px 16px;" onclick="closeModals()">Cancel</button>
        <button type="submit" class="btn-primary">Create Folder</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Initial demo state or localStorage persistence
  const DEFAULT_FOLDERS = [
    { id: 'Policies', name: 'Company Policies', count: 3 },
    { id: 'HR', name: 'Human Resources', count: 4 },
    { id: 'Finance', name: 'Finance & Accounting', count: 2 },
    { id: 'Projects', name: 'Active Projects', count: 5 }
  ];

  const DEFAULT_DOCS = [
    { id: 1, title: 'Employee Handbook 2026', category: 'HR', size: '2.4 MB', date: '2026-03-01', ext: 'PDF' },
    { id: 2, title: 'Remote Work Security Policy', category: 'Policies', size: '1.1 MB', date: '2026-03-05', ext: 'PDF' },
    { id: 3, title: 'Q1 Expense Reimbursement Form', category: 'Finance', size: '650 KB', date: '2026-03-10', ext: 'XLSX' },
    { id: 4, title: 'Uniconnect Office Architecture Roadmap', category: 'Projects', size: '4.8 MB', date: '2026-03-15', ext: 'PDF' },
    { id: 5, title: 'Health & Safety Guidelines', category: 'Policies', size: '890 KB', date: '2026-02-20', ext: 'DOCX' },
    { id: 6, title: 'Performance Review Template', category: 'HR', size: '520 KB', date: '2026-02-14', ext: 'DOCX' }
  ];

  let folders = JSON.parse(localStorage.getItem('office_folders')) || DEFAULT_FOLDERS;
  let documents = JSON.parse(localStorage.getItem('office_documents')) || DEFAULT_DOCS;
  let activeFilter = null;
  let searchQuery = '';

  function saveState() {
    localStorage.setItem('office_folders', JSON.stringify(folders));
    localStorage.setItem('office_documents', JSON.stringify(documents));
  }

  function render() {
    // Render Stats
    document.getElementById('statTotal').textContent = documents.length;
    document.getElementById('statFolders').textContent = folders.length;
    document.getElementById('statStorage').textContent = (documents.length * 1.8).toFixed(1) + ' MB';

    // Render Folders
    const foldersGrid = document.getElementById('foldersGrid');
    foldersGrid.innerHTML = folders.map(f => `
      <button class="folder-card" onclick="filterByCategory('${f.id}')" style="${activeFilter === f.id ? 'border-color: var(--brand); background: var(--bg-elevated);' : ''}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <div class="folder-info">
          <span class="folder-info__name">${f.name}</span>
          <span class="folder-info__count">${documents.filter(d => d.category === f.id).length} files</span>
        </div>
      </button>
    `).join('');

    // Render Title
    document.getElementById('currentViewTitle').textContent = activeFilter ? `Folder: ${folders.find(f => f.id === activeFilter)?.name || activeFilter}` : 'All Office Documents';

    // Filter Documents
    const filtered = documents.filter(d => {
      const matchesCategory = !activeFilter || d.category === activeFilter;
      const matchesSearch = !searchQuery || d.title.toLowerCase().includes(searchQuery.toLowerCase()) || d.category.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesCategory && matchesSearch;
    });

    // Render Table
    const tableBody = document.getElementById('docTableBody');
    if (filtered.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 32px;">No office documents found.</td></tr>`;
      return;
    }

    tableBody.innerHTML = filtered.map(d => `
      <tr>
        <td>
          <div class="doc-title-cell">
            <div class="doc-icon">${d.ext}</div>
            <div>
              <span class="doc-name">${d.title}</span>
              <span class="doc-meta">Added ${d.date}</span>
            </div>
          </div>
        </td>
        <td>
          <span class="badge badge--${d.category.toLowerCase()}">${d.category}</span>
        </td>
        <td>
          <div>${d.size}</div>
          <span class="doc-meta">Indexed & Secure</span>
        </td>
        <td>
          <div class="actions-cell">
            <button class="btn-icon" title="Download / View" onclick="alert('Downloading: ${d.title}')">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </button>
            <button class="btn-icon" title="Delete document" onclick="deleteDoc(${d.id})">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterByCategory(cat) {
    activeFilter = activeFilter === cat ? null : cat;
    render();
  }

  function deleteDoc(id) {
    if (confirm('Are you sure you want to delete this office document?')) {
      documents = documents.filter(d => d.id !== id);
      saveState();
      render();
    }
  }

  // Modals
  const uploadModal = document.getElementById('uploadModal');
  const folderModal = document.getElementById('folderModal');

  document.getElementById('uploadDocBtn').onclick = () => uploadModal.classList.add('active');
  document.getElementById('newFolderBtn').onclick = () => folderModal.classList.add('active');

  function closeModals() {
    uploadModal.classList.remove('active');
    folderModal.classList.remove('active');
  }

  document.getElementById('uploadForm').onsubmit = (e) => {
    e.preventDefault();
    const title = document.getElementById('docTitle').value;
    const category = document.getElementById('docCategory').value;
    const fileInput = document.getElementById('docFile');
    const fileName = fileInput.files[0] ? fileInput.files[0].name : 'Document.pdf';
    const ext = fileName.split('.').pop().toUpperCase();
    
    const newDoc = {
      id: Date.now(),
      title,
      category,
      size: '1.2 MB',
      date: new Date().toISOString().split('T')[0],
      ext: ext.length <= 4 ? ext : 'FILE'
    };

    documents.unshift(newDoc);
    saveState();
    closeModals();
    e.target.reset();
    render();
  };

  document.getElementById('folderForm').onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById('folderNameInput').value;
    const id = name.replace(/\s+/g, '');
    if (!folders.some(f => f.id === id)) {
      folders.push({ id, name, count: 0 });
      // Add option to select
      const select = document.getElementById('docCategory');
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = name;
      select.appendChild(opt);
      saveState();
    }
    closeModals();
    e.target.reset();
    render();
  };

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    render();
  };

  // Initial render
  render();
</script>

</body>
</html>
