<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materials — UniConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-5);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .topbar__brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-weight: 600; font-size: var(--text-base);
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar__brand svg { color: var(--brand); }
  .topbar__right { display: flex; align-items: center; gap: var(--space-2); }
  .btn-ghost {
    appearance: none; background: transparent;
    border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.45rem 0.85rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    transition: all var(--duration-fast) var(--ease); min-height: 36px;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn-ghost:hover {
    border-color: var(--border-strong); color: var(--text);
    background: var(--bg-elevated);
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
  @media (min-width: 640px) { .wrap { padding: var(--space-8) var(--space-6); } }

  .head { margin-bottom: var(--space-6); }
  .head h1 {
    font-size: var(--text-2xl); font-weight: 600;
    letter-spacing: -0.02em; line-height: var(--leading-tight);
    margin-bottom: var(--space-2);
  }
  @media (min-width: 640px) { .head h1 { font-size: var(--text-3xl); } }
  .head p { color: var(--text-muted); font-size: var(--text-base); }

  .toolbar {
    display: flex; gap: var(--space-3); margin-bottom: var(--space-5);
    flex-wrap: wrap; align-items: center;
  }
  .toolbar input {
    flex: 1; min-width: 180px;
    padding: 0.6rem 0.85rem;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: var(--text-sm);
    color: var(--text); min-height: 40px;
  }
  .toolbar input:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
  }

  .list { display: flex; flex-direction: column; gap: var(--space-3); }

  .mat {
    display: flex; gap: var(--space-4); align-items: flex-start;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: var(--space-4);
    transition: border-color var(--duration-fast) var(--ease);
  }
  .mat:hover { border-color: var(--border-strong); }

  .mat__icon {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--bg-sunken); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .mat__body { flex: 1; min-width: 0; }
  .mat__meta {
    display: flex; align-items: center; gap: var(--space-2);
    margin-bottom: var(--space-2); flex-wrap: wrap;
    font-size: var(--text-xs); color: var(--text-subtle);
  }
  .course-code {
    font-weight: 600; color: var(--brand);
    background: var(--brand-subtle);
    padding: 0.15rem 0.5rem; border-radius: var(--radius-sm);
    letter-spacing: 0.02em;
  }
  .dot-sep { opacity: 0.5; }

  .mat__title {
    font-size: var(--text-md); font-weight: 600;
    letter-spacing: -0.01em; line-height: var(--leading-snug);
    margin-bottom: var(--space-1);
    overflow-wrap: anywhere;
  }
  .mat__desc {
    font-size: var(--text-sm); color: var(--text-muted);
    line-height: var(--leading-snug);
    overflow-wrap: anywhere;
  }

  .mat__action {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease);
  }
  .mat__action:hover:not(:disabled) {
    color: var(--brand); border-color: var(--brand);
    background: var(--brand-subtle);
  }
  .mat__action:disabled { opacity: 0.5; cursor: wait; }

  .state { padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .state[hidden] { display: none; }
  .state--error { color: var(--danger); }
  .state h3 { font-size: var(--text-md); color: var(--text); margin-bottom: var(--space-2); font-weight: 600; }
  .state p { max-width: 40ch; margin: 0 auto; }

  #list[hidden] { display: none; }

  .toast {
    position: fixed; bottom: var(--space-4); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 0.65rem 1rem; border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: all var(--duration) var(--ease);
    z-index: 50;
  }
  .toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast[data-kind="error"] { background: var(--danger); color: white; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    UniConnect
  </div>
  <div class="topbar__right">
    <a class="btn-ghost" href="dashboard.html">Dashboard</a>
    <a class="btn-ghost" href="announcements.html">Announcements</a>
    <button class="btn-ghost" id="btn-signout">Sign out</button>
  </div>
</header>

<main class="wrap">

  <div class="head">
    <h1>Course materials</h1>
    <p>Lecture notes, handouts, and study resources.</p>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search by title or course code…" aria-label="Search materials">
  </div>

  <div class="state" id="state-loading">Loading…</div>
  <div class="state state--error" id="state-error" hidden></div>
  <div class="state" id="state-empty" hidden>
    <h3>No materials yet</h3>
    <p>When your lecturers upload notes, they'll appear here.</p>
  </div>
  <div class="list" id="list" hidden></div>

</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const $ = (id) => document.getElementById(id);
  let allMaterials = [];
  let query = '';

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.replace('login.html');
    throw new Error('unauthenticated');
  }

  // ---- Load ----
  function showError(msg) {
    $('state-loading').hidden = true;
    $('state-error').textContent = msg;
    $('state-error').hidden = false;
  }

  async function load() {
    const { data, error } = await supabase
      .from('materials')
      .select(`
        id, course_code, title, description, file_name,
        file_size, file_type, storage_path, downloads, created_at,
        uploader:profiles!materials_uploader_id_fkey ( full_name )
      `)
      .order('created_at', { ascending: false });

    if (error) {
      showError('Could not load materials: ' + error.message);
      return;
    }

    allMaterials = data || [];
    $('state-loading').hidden = true;
    render();
  }

  // ---- Helpers ----
  function formatSize(bytes) {
    if (!bytes) return '';
    const kb = bytes / 1024;
    if (kb < 1024) return kb.toFixed(1) + ' KB';
    return (kb / 1024).toFixed(1) + ' MB';
  }
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fileIcon(mime) {
    if (!mime) return 'file';
    if (mime.includes('pdf')) return 'pdf';
    if (mime.includes('word')) return 'doc';
    if (mime.includes('presentation') || mime.includes('powerpoint')) return 'ppt';
    if (mime.includes('zip')) return 'zip';
    if (mime.startsWith('text/')) return 'txt';
    return 'file';
  }
  function iconSvg(kind) {
    // Minimal, inline — no icon font dependency.
    const base = (paths) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    const doc  = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>';
    switch (kind) {
      case 'pdf': return base(doc + '<path d="M9 15h1.5a1.5 1.5 0 0 0 0-3H9v6M14 18v-6h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1z"/>');
      case 'doc': return base(doc + '<path d="M9 13l1.5 5 1.5-5 1.5 5L15 13"/>');
      case 'ppt': return base(doc + '<rect x="9" y="12" width="6" height="5" rx="0.5"/>');
      case 'zip': return base('<path d="M21 8v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h9l7 7z"/><path d="M14 2v6h6"/><path d="M10 9v1M10 12v1M10 15v1"/>');
      case 'txt': return base(doc + '<path d="M9 14h6M9 17h4"/>');
      default:    return base(doc);
    }
  }

  // ---- Render ----
  function render() {
    const q = query.trim().toLowerCase();
    const filtered = !q ? allMaterials : allMaterials.filter(m =>
      (m.title || '').toLowerCase().includes(q) ||
      (m.course_code || '').toLowerCase().includes(q)
    );

    $('list').hidden = filtered.length === 0;
    $('state-empty').hidden = filtered.length !== 0;

    $('list').innerHTML = filtered.map(m => `
      <article class="mat">
        <div class="mat__icon" aria-hidden="true">${iconSvg(fileIcon(m.file_type))}</div>
        <div class="mat__body">
          <div class="mat__meta">
            <span class="course-code">${escapeHtml(m.course_code)}</span>
            <span class="dot-sep">·</span>
            <span>${escapeHtml(m.uploader?.full_name || 'Unknown')}</span>
            <span class="dot-sep">·</span>
            <span>${formatTime(m.created_at)}</span>
            <span class="dot-sep">·</span>
            <span>${formatSize(m.file_size)}</span>
          </div>
          <h2 class="mat__title">${escapeHtml(m.title)}</h2>
          ${m.description ? `<p class="mat__desc">${escapeHtml(m.description)}</p>` : ''}
        </div>
        <button class="mat__action" data-id="${m.id}" title="Download" aria-label="Download ${escapeHtml(m.title)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M12 15V3"/>
          </svg>
        </button>
      </article>
    `).join('');
  }

  // ---- Download ----
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.setAttribute('data-show', '1');
    if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.removeAttribute('data-show'), 3000);
  }

  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('.mat__action');
    if (!btn) return;

    const id = btn.dataset.id;
    const m = allMaterials.find(x => x.id === id);
    if (!m) return;

    btn.disabled = true;
    try {
      // Private bucket → signed URL valid for 60 seconds
      const { data, error } = await supabase
        .storage
        .from('materials')
        .createSignedUrl(m.storage_path, 60, { download: m.file_name });

      if (error) throw error;

      // Trigger download
      const a = document.createElement('a');
      a.href = data.signedUrl;
      a.download = m.file_name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();

      // Optimistic increment for the counter in the DB
      // RLS allows update only if uploader = self or admin — so this may fail silently for others.
      // That's fine: it's a counter, not a critical fact.
      supabase.from('materials')
        .update({ downloads: (m.downloads || 0) + 1 })
        .eq('id', m.id)
        .then(() => {});
    } catch (err) {
      toast(err.message || 'Download failed', 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // ---- Search ----
  $('search').addEventListener('input', (e) => {
    query = e.target.value;
    render();
  });

  // ---- Sign out ----
  $('btn-signout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.replace('login.html');
  });

  load();
</script>

</body>
</html>
